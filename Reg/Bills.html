<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bills &amp; Payments</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<script src="https://amorthopadics.github.io/SurgiStock/shared/cacheWatcher.js?v=1"></script>
<script src="https://amorthopadics.github.io/SurgiStock/shared/api.js?v=1"></script>
<script src="https://amorthopadics.github.io/SurgiStock/shared/cacheSync.js?v=1"></script>
<script src="https://amorthopadics.github.io/SurgiStock/shared/auth.js"></script>
<script src="https://amorthopadics.github.io/SurgiStock/shared/accessGuard.js"></script>
<script src="https://amorthopadics.github.io/SurgiStock/shared/dataLayer.js"></script>
<style>
:root,[data-theme="dark"]{color-scheme:dark;--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--surface:#21262d;--border:#30363d;--border2:#444c56;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent-dim:rgba(88,166,255,.12);--teal:#39d353;--teal-dim:rgba(57,211,83,.12);--amber:#e3b341;--red:#f85149;--orange:#f0883e;--orange-dim:rgba(240,136,62,.12);--radius:8px;--radius-lg:12px;--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace}
[data-theme="light"]{color-scheme:light;--bg:#f0f2f5;--bg2:#fff;--bg3:#e8ecf0;--surface:#fff;--border:#c8d0d9;--border2:#9aa5b1;--text:#0d1117;--text2:#3d454f;--accent:#0550ae;--accent-dim:rgba(5,80,174,.12);--teal:#116329;--teal-dim:rgba(17,99,41,.13);--amber:#7d4e00;--red:#a8111b;--orange:#953800;--orange-dim:rgba(149,56,0,.13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.bar h1{font-size:15px;display:flex;align-items:center;gap:8px;margin-right:auto}
.tabs{display:flex;gap:4px}
.tab,.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:13px}
.tab{background:var(--bg3);color:var(--text2)}.tab.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.out{background:var(--orange-dim);color:var(--orange);border-color:var(--orange)}.btn.in{background:var(--teal-dim);color:var(--teal);border-color:var(--teal)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.sm{padding:3px 8px;font-size:12px}
.btn.dng.armed{background:var(--red);color:#fff;border-color:var(--red)}
main{flex:1;min-height:0;overflow:auto;padding:12px 14px}
input,select{font:inherit;font-size:13px;padding:7px 9px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);color:var(--text);width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tools{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}.tools input{max-width:320px}
.kpi{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:150px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:9px 12px;font-size:12px;color:var(--text2)}.kpi b{display:block;font:600 16px var(--mono);color:var(--text);margin-top:2px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--bg2);border:1px solid var(--border);font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--bg3);color:var(--text2);font-weight:600;font-size:12px}
.n{text-align:right!important;font-family:var(--mono)}td.acts{white-space:nowrap;width:1%}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2)}
.badge.out,.badge.part{background:var(--orange-dim);color:var(--orange)}.badge.in,.badge.paid{background:var(--teal-dim);color:var(--teal)}.badge.unpaid{background:rgba(248,81,73,.12);color:var(--red)}
.mono{font-family:var(--mono)}.dim{color:var(--text2)}.neg{color:var(--red)}.warn{color:var(--amber);font-size:12px}
.empty{padding:36px;text-align:center;color:var(--text2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}.ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:900px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.mh,.mf{padding:12px 16px;display:flex;align-items:center;gap:8px;flex:none}.mh{border-bottom:1px solid var(--border);font-weight:600}.mf{border-top:1px solid var(--border);justify-content:flex-end;flex-wrap:wrap}
.mh .x{margin-left:auto}.mf .sum{margin-right:auto;font:500 13px var(--mono)}
.mb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}.mb>*{flex-shrink:0}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.ib.ok{color:var(--teal)}.ib.err{color:var(--red)}.ib.warn{color:var(--amber)}
.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer}
.ol{border:1px solid var(--border);border-radius:var(--radius-lg);max-height:260px;overflow:auto}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}.opt:last-child{border-bottom:0}
.opt:hover{background:var(--accent-dim)}.opt.off{opacity:.5;cursor:not-allowed}.opt input{width:auto;margin-top:3px}.opt .b{flex:1;min-width:0}
.sec{font-size:12px;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:8px}.sec .btn{margin-left:auto}
.rt{max-width:110px;margin-left:auto;font-family:var(--mono);text-align:right}
.tot{margin-left:auto;width:min(340px,100%);font-size:13px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font:700 15px var(--mono);border-top:1px solid var(--border2);margin-top:4px;padding-top:6px}
.pr-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:8px;align-items:end}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border2);padding:9px 16px;border-radius:var(--radius);z-index:99;display:none;font-size:13px}.toast.error{border-color:var(--red);color:var(--red)}.toast.success{border-color:var(--teal)}
#pr{display:none}
@media(max-width:700px){.fg,.pr-row{grid-template-columns:1fr 1fr}.modal{border-radius:0;border:0}.ov{padding:0}.bar .btn .lbl{display:none}}
/* ── print: only the bill ── */
#pr,#pr *,#pv,#pv *{color:#000!important;background:#fff!important;font-family:Arial,sans-serif}
#pr{padding:6mm 8mm;font-size:12px}
:is(#pr,#pv) .inv{font-size:12px;line-height:1.45}
:is(#pr,#pv) .inv .ihd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:3px solid #000;padding-bottom:10px;margin-bottom:12px}
:is(#pr,#pv) .inv .ico{display:flex;gap:12px;align-items:center}
:is(#pr,#pv) .inv .ilogo{max-height:64px;max-width:120px;object-fit:contain}
:is(#pr,#pv) .inv .icn{font-size:22px;font-weight:700;letter-spacing:.3px}
:is(#pr,#pv) .inv .itag{font-size:10px;margin-top:2px}
:is(#pr,#pv) .inv .itt{text-align:right}
:is(#pr,#pv) .inv .ititle{font-size:28px;font-weight:700;letter-spacing:3px}
:is(#pr,#pv) .inv .ist{display:inline-block;margin-top:4px;padding:2px 14px;border:1.5px solid #000;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px}
:is(#pr,#pv) .inv .imeta{display:flex;gap:12px;margin-bottom:12px}
:is(#pr,#pv) .inv .ibox{flex:1;border:1px solid #888;border-radius:6px;padding:8px 10px}
:is(#pr,#pv) .inv .ilb{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #ccc;padding-bottom:3px;margin-bottom:5px}
:is(#pr,#pv) .inv .ipn{font-size:15px;font-weight:700}
:is(#pr,#pv) .inv table{width:100%;border-collapse:collapse;margin:0}
:is(#pr,#pv) .inv table.mt{border:0}
:is(#pr,#pv) .inv table.mt td{border:0;padding:2px 0;font-size:12px}
:is(#pr,#pv) .inv table.mt td:first-child{width:38%;font-weight:700}
:is(#pr,#pv) .inv table.it{border:1px solid #000;margin-bottom:10px}
:is(#pr,#pv) .inv table.it th,:is(#pr,#pv) .inv table.it td{border:1px solid #888;padding:6px 8px;font-size:12px;text-align:left}
:is(#pr,#pv) .inv table.it th{background:#e9e9e9!important;font-size:11px;text-transform:uppercase;letter-spacing:.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
:is(#pr,#pv) .inv table.it td.n,:is(#pr,#pv) .inv table.it th.n{text-align:right!important}
:is(#pr,#pv) .inv table.it tr{page-break-inside:avoid}
:is(#pr,#pv) .inv .ibot{display:flex;gap:16px;align-items:flex-start;page-break-inside:avoid}
:is(#pr,#pv) .inv .iwords{flex:1}
:is(#pr,#pv) .inv .iwords .w{border:1px solid #888;border-radius:6px;padding:8px 10px;margin-bottom:8px}
:is(#pr,#pv) .inv .iwords .w b{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
:is(#pr,#pv) .inv .tot{width:300px;border:1px solid #000;border-radius:6px;padding:6px 10px}
:is(#pr,#pv) .inv .tot .g{font-size:15px;border-top:2px solid #000;margin-top:4px;padding-top:6px}
:is(#pr,#pv) .inv .pay{font-size:11px}
:is(#pr,#pv) .inv .sig{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;page-break-inside:avoid}
:is(#pr,#pv) .inv .sig span{border-top:1px solid #000;padding-top:4px;width:30%;text-align:center;font-size:11px}
:is(#pr,#pv) .inv .sig img{max-height:90px;max-width:150px}
:is(#pr,#pv) .inv .ift{margin-top:18px;padding-top:8px;border-top:1px solid #000;text-align:center;font-size:10.5px}
@media print{@page{margin:8mm}body>*:not(#pr){display:none!important}html,body{height:auto;overflow:visible}#pr{display:block}}
.sk{height:34px;border-radius:6px;margin-bottom:8px;background:linear-gradient(90deg,var(--bg3),var(--surface),var(--bg3));background-size:200% 100%;animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="bar">
  <h1><i class="ti ti-receipt"></i>Bills &amp; Payments</h1>
  <div class="tabs" id="tabs"></div>
  <button class="ib cache-ind warn" id="cache-ind" type="button" title="Cache: waiting…"><i class="ti ti-database"></i></button>
  <button class="btn out" onclick="openForm('out')"><i class="ti ti-arrow-up-right"></i><span class="lbl">New Bill (Outgoing)</span></button>
  <button class="btn in" onclick="openForm('in')"><i class="ti ti-arrow-down-left"></i><span class="lbl">New Bill (Incoming)</span></button>
</div>
<main>
  <div class="kpi" id="kpi"></div>
  <div class="tools"><input id="q" placeholder="Search doctor, hospital, vendor, date, order no, item…" oninput="render()"/></div>
  <div class="tw" id="view"></div>
</main>

<!-- NEW BILL -->
<div class="ov" id="ov"><div class="modal">
  <div class="mh"><i class="ti ti-receipt"></i><span id="m-title"></span><button class="ib x" onclick="closeForm()"><i class="ti ti-x"></i></button></div>
  <div class="mb">
    <div class="fg">
      <div><label>Bill date</label><input type="date" id="f-date"/></div>
      <div id="w-type"><label>Party type</label><select id="f-type" onchange="f.ptype=this.value;f.party='';fillNames();rOrders()"></select></div>
      <div><label id="l-party">Name</label><select id="f-party" onchange="f.party=this.value;rOrders()"></select></div>
      <div><label>Reference / note</label><input id="f-note" autocomplete="off"/></div>
    </div>
    <div class="fg" style="grid-template-columns:2fr 1fr 1fr"><div><label>Search — doctor, hospital, vendor, order no, date, item</label><input id="f-q" autocomplete="off" oninput="rOrders()"/></div><div><label>From date</label><input type="date" id="f-from" onchange="f.from=this.value;rOrders()"/></div><div><label>To date</label><input type="date" id="f-to" onchange="f.to=this.value;rOrders()"/></div></div>
    <div class="sec">Orders to bill <span class="dim" id="o-cnt"></span>
      
      <button class="btn sm" style="margin-left:auto" onclick="selAll(1)">All</button><button class="btn sm" style="margin-left:0" onclick="selAll(0)">None</button></div>
    <div class="ol" id="f-orders"></div>
    <div class="sec">Items &amp; rates <span class="dim">(net qty = ordered − returned/claimed; edits already included)</span></div>
    <div class="tw" id="f-items"></div>
    <div class="fg" style="grid-template-columns:repeat(2,minmax(0,160px))">
      <div><label>Discount</label><div style="display:flex;gap:4px"><input type="number" id="f-disc" min="0" step="any" value="0" oninput="f.disc=+this.value||0;tot()"/><select id="f-dt" style="width:70px" onchange="f.dt=this.value;tot()"><option value="amt">AED</option><option value="pct">%</option></select></div></div>
      <div><label>VAT %</label><input type="number" id="f-vat" min="0" step="any" value="0" oninput="f.vat=+this.value||0;tot()"/></div>
    </div>
    <div><label>Other charges (fuel, delivery, assistance…) — added to the bill, no VAT</label><div id="f-ex"></div><button class="btn sm" type="button" onclick="addEx()"><i class="ti ti-plus"></i>Add charge</button><datalist id="ex-dl"><option>Fuel</option><option>Delivery</option><option>Assistance</option></datalist></div>
    <div class="tot" id="f-tot"></div>
  </div>
  <div class="mf"><span class="sum" id="m-sum"></span>
    <button class="btn" onclick="closeForm()">Cancel</button><button class="btn" onclick="saveBill(0)"><i class="ti ti-check"></i>Save</button><button class="btn pri" onclick="saveBill(1)"><i class="ti ti-printer"></i>Save &amp; Print</button></div>
</div></div>

<!-- VIEW BILL / PAYMENTS -->
<div class="ov" id="ov2"><div class="modal">
  <div class="mh"><i class="ti ti-file-invoice"></i><span id="v-title"></span><button class="ib x" onclick="closeView()"><i class="ti ti-x"></i></button></div>
  <div class="mb" id="v-body"></div>
  <div class="mf"><button class="btn" onclick="closeView()">Close</button><button class="btn pri" onclick="printBill(vid)"><i class="ti ti-printer"></i>Print</button></div>
</div></div>
<div id="pr"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* Bills are saved in Google Sheet "Bills" (one row per item line) and "Payments".
   Backend: doGet type=bills → {Bills:[…],Payments:[…]} · doPost: addBill / deleteBill / addPayment / deletePayment (see Bills_backend.gs).
   Orders are read from the existing type=orders endpoint. Parties/types come from the orders themselves. */
const CUR='AED',CO='AM Traders';           // ← change company name for the printout
/* invoice header/footer details — leave a value '' to hide it */
const CO_TAG='',CO_ADDR='Al Kareem Medical Complex - 1A Justice Hameed Colony, Nishtar Road, Multan.',CO_PHONE='0300-6355782',CO_EMAIL='amtraders40@gmail.com',CO_TRN='5260719-3',
  CO_LOGO='https://amorthopadics.github.io/SurgiStock/shared/logo.png',CO_STAMP='https://amorthopadics.github.io/SurgiStock/shared/stamp.png';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase();
const match=(q,h)=>{h=String(h).toLowerCase();return String(q||'').toLowerCase().split(/\s+/).filter(Boolean).every(w=>h.includes(w));};
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round((+n||0)*100)/100;
const p2=n=>String(n).padStart(2,'0');
const tsId=t=>{const d=new Date(t);return''+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+String(d.getMilliseconds()).padStart(3,'0')};
const today=()=>new Date().toISOString().slice(0,10);
function showToast(m,t){const e=$('toast');e.textContent=m;e.className='toast '+(t||'');e.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.style.display='none',t==='error'?9000:3000);}
const session=AP2Api.session,errText=m=>String(m),post=(a,p)=>BillsApi.post(a,p);

const OK='orders_sheet_cache_v2';   // same local cache Orders.html writes → orders show instantly, even offline
const fixO=a=>(a||[]).map(o=>({...o,store:o.store||o.storeName||''}));
let orders=(()=>{try{return fixO(JSON.parse(localStorage.getItem(OK)))}catch(e){return[]}})(),bills=[],pays=[],tab='orders',busy=false,vid=null;
const BILLS_KEY='ap2_bills';
const BILLS_BACKEND=true;   // true: bills come from the ap2_bills cache, writes go to the API · false: old local-only mode (localStorage)
const LS={ts:0,fp:'',painted:false,err:'',by:{},list:{}};   // ledger mirror (ap2_ledger) — allocations per bill
const S={ts:0,fp:'',painted:false,state:'loading',err:'',src:'',booting:false,raw:{Bills:[],Payments:[]}};
let items=[],stores=[],parties=[],types=[],suppliers=[];     // from the cache (Master / Specs Settings)

/* ═══ CACHE → customer-type parties · suppliers · items · stores (same rules as Orders)
   cache row = [ID, Specs, Item, Description, Status] */
const IGN=/^(item\s*names?|item\s*lists?|item\s*categor(y|ies)|stores?(\s*branch)?|medical\s*domains?|material\s*sources?|specs)$/i;
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function applyRows(rows){
  const it=[],st=[],pa=[],su=[],T=new Map();
  rows.forEach(r=>{
    if(!Array.isArray(r)||String(r[0]).toLowerCase()==='id')return;
    const id=String(r[0]).trim(),kind=String(r[1]??'').trim(),a=String(r[2]??'').trim(),b=String(r[3]??'').trim(),stv=String(r[4]??'').trim();
    if(!id||!kind||!a)return;
    const strict=/^active$/i.test(stv),lenient=!/^(inactive|in-active|no|0|false|disabled)$/i.test(stv);
    if(/^item\s*lists?$/i.test(kind)){if(strict&&b)it.push({id,domain:a,label:b});return;}
    if(/^stores?(\s*branch)?$/i.test(kind)){if(strict)st.push({id,name:a});return;}
    if(/^suppliers?$/i.test(kind)){if(lenient&&!su.some(x=>norm(x)===norm(a)))su.push(a);return;}
    if(IGN.test(kind)||norm(b)!=='customer'||!lenient)return;
    const k=norm(kind),t=T.get(k);
    if(!t)T.set(k,{k,l:cap(kind)});else if(/^[a-z]/.test(t.l)&&/^[A-Z]/.test(kind))t.l=kind;
    pa.push({name:a,type:k,label:(T.get(k)||{}).l});
  });
  items=it;stores=st;parties=pa;suppliers=su.sort((x,y)=>x.localeCompare(y));types=[...T.values()].sort((a,b)=>a.l.localeCompare(b.l));
}
const cache=AP2Cache.create({
  indicator:'cache-ind',
  toast:(m,t)=>showToast(m,t),
  title:()=>'Cache loaded · '+items.length+' items · '+parties.length+' names · '+suppliers.length+' suppliers',
  onRows:rows=>{applyRows(rows);render();if($('ov').classList.contains('open')){fillTypes();fillNames();rOrders();}return items.length;}
});
const f={extras:[],dir:'out',from:'',to:'',ptype:'',party:'',sel:new Set(),rates:{},disc:0,dt:'amt',vat:0};

/* ═══ DATA ═══ */
function groupOrders(rows){const m=new Map();
  rows.forEach(a=>{if(!Array.isArray(a)||!String(a[0])||String(a[0])==='ID')return;const id=String(a[0]);let o=m.get(id);
    if(!o){o={id,no:String(a[1]||''),type:String(a[2]||''),date:String(a[3]||''),store:String(a[5]||''),partyType:String(a[6]||''),party:String(a[8]||''),note:String(a[9]||''),lines:[]};m.set(id,o);}
    o.lines.push({itemId:String(a[10]||''),label:String(a[11]||''),qty:Math.floor(+a[13])||0});});
  return [...m.values()];}
/* bill row = [ID,Bill No,Dir,Date,PartyType,Party,Note,OrderIDs,Disc,DiscType,VAT,ItemID,Item,OrdQty,RetQty,Rate,Updated] */
function groupBills(rows){const m=new Map();
  rows.forEach(a=>{if(!Array.isArray(a)||!String(a[0])||String(a[0])==='ID')return;const id=String(a[0]);let b=m.get(id);
    if(!b){b={id,no:String(a[1]||''),dir:String(a[2]||''),date:String(a[3]||''),ptype:String(a[4]||''),party:String(a[5]||''),note:String(a[6]||''),oids:String(a[7]||'').split(',').filter(Boolean),disc:+a[8]||0,dt:String(a[9]||'amt'),vat:+a[10]||0,lines:[]};m.set(id,b);}
    b.lines.push({itemId:String(a[11]||''),label:String(a[12]||''),oq:+a[13]||0,rq:+a[14]||0,rate:+a[15]||0});});
  return [...m.values()].sort((a,b)=>b.id.localeCompare(a.id));}
/* ═══ ORDERS ← IndexedDB (same cache dataLayer.js keeps: DB ap2_fleet_cache · store datasets · record {ts,data:{Orders:[…]},fingerprint})
   Read-only. Opened WITHOUT a version number (no mismatch). The store is scanned for the record that holds data.Orders, so the key name doesn't matter. */
function idbOrders(){return new Promise(res=>{
  try{const rq=indexedDB.open('ap2_fleet_cache');
    rq.onerror=()=>res(null);rq.onblocked=()=>res(null);
    rq.onupgradeneeded=()=>{try{rq.transaction.abort();}catch(e){}};      // DB missing → don't create an empty one
    rq.onsuccess=()=>{const db=rq.result;
      try{if(!db.objectStoreNames.contains('datasets')){db.close();return res(null);}
        const cur=db.transaction('datasets','readonly').objectStore('datasets').openCursor();let best=null;
        cur.onsuccess=e=>{const c=e.target.result;
          if(c){const v=c.value;if(v&&v.data&&Array.isArray(v.data.Orders)&&(!best||(+v.ts||0)>=(+best.ts||0)))best=v;c.continue();}
          else{db.close();res(best);}};
        cur.onerror=()=>{db.close();res(null);};
      }catch(e){try{db.close();}catch(x){}res(null);}};
  }catch(e){res(null);}});}
let idbTs=0;
async function loadIDB(){const r=await idbOrders();if(!r||(+r.ts||0)<=idbTs)return;idbTs=+r.ts||0;
  orders=groupOrders(r.data.Orders||[]);render();if($('ov').classList.contains('open'))rOrders();}
window.addEventListener('message',e=>onCacheMessage(e));
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;loadIDB();if(BILLS_BACKEND){if(!allReady()&&!S.booting)bootBills();else{applyFromIDB();if(LEDGER_BACKEND)applyLedgerFromIDB();}}});

/* ═══ BILLS DATA — cache dataset "ap2_bills" (same three-path loader as userPortal.html)
   1. parent push   : post ap-cache-request to index.html → it answers ap-cache-ready / ap-cache-preload
   2. IndexedDB read: AP2CacheWatcher.readKey('ap2_bills'), 6 retries (300 · 500 · 800 · 1200 · 2000 · 3000 ms)
   3. live updates  : AP2CacheWatcher.subscribe → re-read on any change
   Whichever answers first wins; older records (ts) never overwrite newer ones.
   If all three come back empty → AdminPro.get('ap2_bills') fetches it directly. If that fails → error panel with Retry (never an endless skeleton).
   Dataset shape = {Bills:[…rows], Payments:[…rows]}; empty arrays are VALID (fresh system).
   ⚠ dataLayer.js: add 'ap2_bills' to ALLOW_EMPTY_OBJECT_DATASETS, otherwise an empty database throws "empty or invalid data" and nothing is cached. */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const isShape=d=>!!d&&typeof d==='object'&&Array.isArray(d.Bills)&&(d.Payments===undefined||Array.isArray(d.Payments));
function unpack(r){                                  // accepts the IDB record {ts,data,fingerprint} or the bare dataset
  if(!r||typeof r!=='object')return null;
  if(isShape(r))return{data:r,ts:0};
  if(isShape(r.data))return{data:r.data,ts:+r.ts||0};
  return null;}
const normPays=rows=>(rows||[]).filter(a=>Array.isArray(a)&&String(a[0])!=='ID'&&a[0]!=='').map(a=>({id:String(a[0]),billId:String(a[1]),date:String(a[2]||''),amount:+a[3]||0,mode:String(a[4]||''),ref:String(a[5]||'')}));
function rebuild(){bills=groupBills(S.raw.Bills);pays=normPays(S.raw.Payments);}
function refreshOpen(){if($('ov').classList.contains('open'))rOrders();if(vid&&$('ov2').classList.contains('open'))viewBill(vid);}
function applyBills(r,src){
  const u=unpack(r);if(!u)return false;
  if(S.painted&&u.ts&&u.ts<=S.ts)return true;         // not newer than what is on screen
  S.ts=u.ts||Math.max(S.ts,Date.now());S.src=src;
  const fp=JSON.stringify([u.data.Bills,u.data.Payments||[]]);
  if(S.painted&&fp===S.fp)return true;                // identical data → no re-render
  S.fp=fp;S.raw={Bills:u.data.Bills.slice(),Payments:(u.data.Payments||[]).slice()};rebuild();
  S.painted=true;if(allReady()){S.state='ready';S.err='';}
  render();refreshOpen();return true;}
async function readBillsIDB(){
  try{if(window.AP2CacheWatcher&&typeof AP2CacheWatcher.readKey==='function')return await AP2CacheWatcher.readKey(BILLS_KEY);}catch(e){}
  return null;}
async function applyFromIDB(){const r=await readBillsIDB();return r?applyBills(r,'idb'):false;}
async function fetchBillsLive(){
  try{if(!(window.AdminPro&&typeof AdminPro.get==='function'))throw new Error('AdminPro is not available');
    const r=await AdminPro.get(BILLS_KEY);
    if(!applyBills(r,'live')&&!S.painted)throw new Error('Server returned unexpected data for '+BILLS_KEY);
    return true;}
  catch(e){S.err=String((e&&e.message)||e);return false;}}
async function forceRefresh(){                       // after a write: pull the fresh dataset (also updates IndexedDB)
  try{if(!window.AdminPro)return;
    const fn=typeof AdminPro.refresh==='function'?AdminPro.refresh:AdminPro.get;
    const r=await fn.call(AdminPro,BILLS_KEY,{force:true});
    if(r&&unpack(r))applyBills(r,'live');else{await sleep(500);await applyFromIDB();}
  }catch(e){}}
function askParent(){if(window.parent===window)return;try{window.parent.postMessage({type:'ap-cache-request',key:BILLS_KEY,keys:[BILLS_KEY,LEDGER_KEY]},location.origin);}catch(e){}}
function pickPayload(m){
  for(const bag of [m,m.data,m.datasets,m.payload,m.caches])if(bag&&typeof bag==='object'&&bag[BILLS_KEY]!==undefined&&unpack(bag[BILLS_KEY]))return bag[BILLS_KEY];
  if(m.key===BILLS_KEY||m.name===BILLS_KEY||m.dataset===BILLS_KEY){const v=m.data!==undefined?m.data:m.value;if(unpack(v))return v;}
  return null;}
function onCacheMessage(e){                          // same-origin parent only (all pages share one origin, so IndexedDB is shared too)
  if(e.origin!==location.origin||(e.source!==window.parent&&e.source!==window))return;
  const m=e.data;if(!m||typeof m!=='object')return;
  const t=String(m.type||m.msg||'');if(!/^ap-cache/.test(t))return;
  setTimeout(loadIDB,250);                           // orders cache (unchanged)
  if(!BILLS_BACKEND)return;
  const push=/^ap-cache-(ready|preload)$/.test(t);let got=false,gotL=false;
  if(push){const d=pickPayload(m);if(d)got=applyBills(d,'parent');if(LEDGER_BACKEND){const l=pickLedger(m);if(l)gotL=applyLedger(l,'parent');}}
  if(!got)setTimeout(applyFromIDB,250);if(LEDGER_BACKEND&&!gotL)setTimeout(applyLedgerFromIDB,250);}
function watchBills(){
  const W=window.AP2CacheWatcher;if(!W||typeof W.subscribe!=='function')return;
  const cb=k=>{const key=(k&&k.key)||k,any=typeof key!=='string';if(any||key===BILLS_KEY)applyFromIDB();if(LEDGER_BACKEND&&(any||key===LEDGER_KEY))applyLedgerFromIDB();};
  try{W.subscribe(cb);}catch(e){try{W.subscribe(BILLS_KEY,cb);if(LEDGER_BACKEND)W.subscribe(LEDGER_KEY,cb);}catch(x){}}}
async function bootBillsData(){
  let ok=await applyFromIDB();
  for(const d of DELAYS){if(ok||S.painted)break;await sleep(d);ok=await applyFromIDB();}
  if(!ok&&!S.painted)await fetchBillsLive();}
async function bootBills(){
  if(S.booting)return;S.booting=true;S.state='loading';S.err='';LS.err='';render();
  askParent();
  await Promise.all([S.painted?0:bootBillsData(),LS.painted?0:(LEDGER_BACKEND?bootLedger():loadLocalLedger())]);
  S.booting=false;
  if(!allReady()){const p=[];if(!S.painted)p.push('Bills ('+BILLS_KEY+')'+(S.err?': '+S.err:''));if(!LS.painted)p.push('Ledger ('+LEDGER_KEY+')'+(LS.err?': '+LS.err:''));
    S.state='error';S.err=p.join(' · ');render();showToast('Not loaded — '+S.err,'error');}}
function retryBills(){S.booting=false;bootBills();}
function allReady(){return S.painted&&LS.painted;}
const billsReady=()=>{if(allReady())return true;showToast(S.state==='error'?'Bills / ledger data not loaded — press Retry':'Still loading — please wait','error');return false;};
const stateHTML=()=>S.state==='error'
  ?`<div class="empty">Bills / ledger data isn’t available yet.<div class="dim" style="margin:6px 0 10px;font-size:12px">${esc(S.err||'The cache is empty and the server could not be reached.')}</div><button class="btn pri" onclick="retryBills()"><i class="ti ti-refresh"></i>Retry</button></div>`
  :'<div class="sk"></div>'.repeat(6);

/* ═══ LEDGER (read here, written by Allocation / Receipts) — dataset "ap2_ledger"
   Money allocated to a bill in Allocation.html lives in the ledger's Allocations sheet (col D = BillID, col L = amount; reversals are negative rows).
   Bills & Payments adds it to the payments recorded here, so Paid / Balance / Status (Paid · Partial · Unpaid) follow the allocations.
   Allocations against "Extra" charges (fuel, delivery…) are ignored: those are not part of the bill total.
   Same three-path loader as ap2_bills. ⚠ dataLayer.js: add 'ap2_ledger' to ALLOW_EMPTY_OBJECT_DATASETS too. */
const LEDGER_KEY='ap2_ledger',LEDGER_BACKEND=true;      // false → read the old local ledger (acc_ledger_v1)
const DELAYS=[300,500,800,1200,2000,3000];
const isLedger=d=>!!d&&typeof d==='object'&&Array.isArray(d.Charges)&&Array.isArray(d.Receipts)&&Array.isArray(d.Allocations);
function unpackLg(r){if(!r||typeof r!=='object')return null;if(isLedger(r))return{data:r,ts:0};if(isLedger(r.data))return{data:r.data,ts:+r.ts||0};return null;}
function setLedger(d){
  const typ={};(d.Charges||[]).forEach(c=>{if(Array.isArray(c))typ[String(c[0])]=String(c[1]);});
  const by={},list={};
  (d.Allocations||[]).forEach(a=>{if(!Array.isArray(a)||a[0]===''||String(a[0])==='AllocID')return;
    if(typ[String(a[5])]==='Extra')return;
    const bid=String(a[3]||'');if(!bid)return;
    by[bid]=r2((by[bid]||0)+(+a[11]||0));
    (list[bid]=list[bid]||[]).push({id:String(a[0]),rno:String(a[2]||''),date:String(a[10]||''),amount:+a[11]||0,orderNo:String(a[7]||''),note:String(a[12]||''),rev:String(a[13]||'')});});
  LS.by=by;LS.list=list;LS.painted=true;}
function applyLedger(r,src,force){
  const u=unpackLg(r);if(!u)return false;
  if(!force&&LS.painted&&u.ts&&u.ts<=LS.ts)return true;
  LS.ts=force?Date.now():(u.ts||Math.max(LS.ts,Date.now()));
  const fp=JSON.stringify([u.data.Charges,u.data.Allocations]);   // receipts alone don't change a bill
  if(!force&&LS.painted&&fp===LS.fp)return true;
  LS.fp=fp;LS.err='';setLedger(u.data);
  if(allReady()){S.state='ready';S.err='';}
  render();refreshOpen();return true;}
async function readLedgerIDB(){try{if(window.AP2CacheWatcher&&typeof AP2CacheWatcher.readKey==='function')return await AP2CacheWatcher.readKey(LEDGER_KEY);}catch(e){}return null;}
async function applyLedgerFromIDB(){const r=await readLedgerIDB();return r?applyLedger(r,'idb'):false;}
async function fetchLedgerLive(){
  try{if(!(window.AdminPro&&typeof AdminPro.get==='function'))throw new Error('AdminPro is not available');
    const r=await AdminPro.get(LEDGER_KEY);if(!applyLedger(r,'live')&&!LS.painted)throw new Error('unexpected data from server');}
  catch(e){LS.err=String((e&&e.message)||e);}}
async function bootLedger(){
  let ok=await applyLedgerFromIDB();
  for(const d of DELAYS){if(ok||LS.painted)break;await sleep(d);ok=await applyLedgerFromIDB();}
  if(!ok&&!LS.painted)await fetchLedgerLive();}
async function freshLedger(){                         // after a ledger write: force-pull, fall back to the endpoint
  let r=null;
  try{if(window.AdminPro){const fn=typeof AdminPro.refresh==='function'?AdminPro.refresh:AdminPro.get;r=await fn.call(AdminPro,LEDGER_KEY,{force:true});}}catch(e){}
  if(!unpackLg(r))r=await AP2Api.get('ledger');
  if(!applyLedger(r,'live',true))throw new Error('Ledger returned unexpected data');}
async function loadLocalLedger(){try{setLedger(await Ledger.get());}catch(e){LS.err=errText(e.message);}}
function pickLedger(m){
  for(const bag of [m,m.data,m.datasets,m.payload,m.caches])if(bag&&typeof bag==='object'&&bag[LEDGER_KEY]!==undefined&&unpackLg(bag[LEDGER_KEY]))return bag[LEDGER_KEY];
  if(m.key===LEDGER_KEY||m.name===LEDGER_KEY||m.dataset===LEDGER_KEY){const v=m.data!==undefined?m.data:m.value;if(unpackLg(v))return v;}
  return null;}
const allocOf=b=>LS.by[b.id]||0,allocList=b=>LS.list[b.id]||[];

/* ═══ BILLS WRITES ═══ */
function mutateRaw(j,a,p,res){const now=new Date().toISOString();      // optimistic update of the in-memory rows; forceRefresh() then replaces them with the server copy
  if(a==='addBill'){const b=p.bill,no=(res&&res.bill&&res.bill.no)||'';b.lines.forEach(l=>j.Bills.push([b.id,no,b.dir,b.date,b.ptype,b.party,b.note,b.oids.join(','),b.disc,b.dt,b.vat,l.itemId,l.label,l.oq,l.rq,l.rate,now]));return;}
  if(a==='deleteBill'){const ids=new Set(p.ids.map(String));j.Bills=j.Bills.filter(r=>!ids.has(String(r[0])));j.Payments=j.Payments.filter(r=>!ids.has(String(r[1])));return;}
  if(a==='addPayment'){const x=p.payment;j.Payments.push([x.id,x.billId,x.date,x.amount,x.mode,x.ref]);return;}
  if(a==='deletePayment'){const ids=new Set(p.ids.map(String));j.Payments=j.Payments.filter(r=>!ids.has(String(r[0])));}}
/* local-only store (BILLS_BACKEND=false) — row shapes = the Bills / Payments sheets */
const LocalBills=(()=>{
 const KEY='bills_local_v1',now=()=>new Date().toISOString();
 const rd=()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.Bills&&j.Payments)return j;}catch(e){}return{seq:0,Bills:[],Payments:[]};};
 const wr=j=>{try{localStorage.setItem(KEY,JSON.stringify(j));}catch(e){throw new Error('Browser storage is full or blocked');}};
 return{async get(){const j=rd();return{Bills:j.Bills,Payments:j.Payments};},
  async post(a,p){const j=rd();
   if(a==='addBill'){const b=p.bill;j.seq=(j.seq||0)+1;const no=String(j.seq).padStart(4,'0');
    b.lines.forEach(l=>j.Bills.push([b.id,no,b.dir,b.date,b.ptype,b.party,b.note,b.oids.join(','),b.disc,b.dt,b.vat,l.itemId,l.label,l.oq,l.rq,l.rate,now()]));wr(j);return{bill:{id:b.id,no}};}
   if(a==='deleteBill'){const ids=new Set(p.ids.map(String));j.Bills=j.Bills.filter(r=>!ids.has(String(r[0])));j.Payments=j.Payments.filter(r=>!ids.has(String(r[1])));wr(j);return{};}
   if(a==='addPayment'){const x=p.payment;j.Payments.push([x.id,x.billId,x.date,x.amount,x.mode,x.ref]);wr(j);return{};}
   if(a==='deletePayment'){const ids=new Set(p.ids.map(String));j.Payments=j.Payments.filter(r=>!ids.has(String(r[0])));wr(j);return{};}
   throw new Error('Unknown action');}};})();
const BillsApi={
 get:()=>BILLS_BACKEND?Promise.resolve(S.raw):LocalBills.get(),
 async post(a,p){
  if(a==='deleteBill'){for(const id of p.ids.map(String))await Ledger.post('reverseBill',{billId:id});if(LEDGER_BACKEND)await freshLedger().catch(()=>{});}   // reverse the charges first (the ledger refuses if payments are allocated to this bill)
  if(!BILLS_BACKEND)return LocalBills.post(a,p);
  const res=await AP2Api.post(a,p);mutateRaw(S.raw,a,p,res);rebuild();forceRefresh();return res||{};}};
const USE_BACKEND=false;                             // ledger store (below) — separate from the bills cache
async function loadAll(){
  if(USE_BACKEND){const s=session();if(!s.sessionId&&!s.token)return;}
  if(USE_BACKEND)try{const o=await AP2Api.get('orders');orders=groupOrders(o.Orders||[]);}
  catch(e){if(!loadAll._o){loadAll._o=1;showToast('Orders not refreshed (showing cached): '+errText(e.message),'error');}}
  if(!BILLS_BACKEND){                                // local mode only — in cache mode the data arrives through applyBills()
    try{const b=await BillsApi.get();S.raw={Bills:b.Bills||[],Payments:b.Payments||[]};rebuild();S.painted=true;if(!LEDGER_BACKEND)await loadLocalLedger();S.state='ready';}
    catch(e){S.state='error';S.err=errText(e.message);if(!loadAll._b){loadAll._b=1;showToast('Bills not loaded: '+errText(e.message),'error');}}}
  render();refreshOpen();}

/* ═══ RULES ═══
   Outgoing bill (customer): charge = Outgoing orders; credit = Incoming orders with note "Returned"
   Incoming bill (supplier): charge = Incoming orders (not "Returned"); credit = Outgoing orders with note "Claim/Damaged" */
const RET=/^returned$/i,CLM=/^claim\s*\/\s*damaged$/i;
const kd=(o,dir)=>dir==='out'?(o.type==='out'&&!CLM.test(o.note)?'c':(o.type==='in'&&RET.test(o.note)?'r':null)):(o.type==='in'&&!RET.test(o.note)?'c':(o.type==='out'&&CLM.test(o.note)?'r':null));
const billedBy=()=>{const m={};bills.forEach(b=>b.oids.forEach(i=>m[i]=b));return m;};
function agg(ids,dir){const m={};ids.forEach(id=>{const o=orders.find(x=>x.id===id);if(!o)return;const k=kd(o,dir);if(!k)return;
  o.lines.forEach(l=>{const x=m[l.itemId]||(m[l.itemId]={label:l.label,oq:0,rq:0});if(k==='c')x.oq+=l.qty;else x.rq+=l.qty;});});return m;}
const lastRate=(itemId,dir)=>{for(const b of bills){if(b.dir!==dir)continue;const l=b.lines.find(x=>x.itemId===itemId);if(l&&l.rate)return l.rate;}return '';};
const calc=(L,disc,dt,vat)=>{const sub=r2(L.reduce((a,l)=>a+(l.oq-l.rq)*(+l.rate||0),0)),d=r2(dt==='pct'?sub*disc/100:disc),net=r2(sub-d),v=r2(net*vat/100);return{sub,d,net,v,total:r2(net+v)};};
const tb=b=>calc(b.lines,b.disc,b.dt,b.vat);
const paidOf=b=>r2(pays.filter(p=>p.billId===b.id).reduce((a,p)=>a+p.amount,0)+allocOf(b));   // payments recorded here + money allocated in Allocation
const stOf=b=>{const t=tb(b).total,p=paidOf(b);return p>=t-.005?['paid','Paid']:p>0?['part','Partial']:['unpaid','Unpaid'];};
/* orders edited / deleted / returned after billing → snapshot no longer matches */
function drift(b){const cur=agg(b.oids,b.dir),out=[];
  b.oids.forEach(i=>{if(!orders.some(o=>o.id===i))out.push('an order was deleted');});
  b.lines.forEach(l=>{const c=cur[l.itemId]||{oq:0,rq:0};if(c.oq!==l.oq||c.rq!==l.rq)out.push(l.label+': billed '+l.oq+(l.rq?'−'+l.rq:'')+' → now '+c.oq+(c.rq?'−'+c.rq:''));});
  Object.keys(cur).forEach(k=>{if(!b.lines.some(l=>l.itemId===k))out.push(cur[k].label+' added');});
  return [...new Set(out)];}

/* ═══ LIST ═══ */
const TABS=[['orders','Unbilled orders'],['all','All bills'],['out','Outgoing bills'],['in','Incoming bills']];
function render(){
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab${tab===k?' on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
  if(!allReady()){$('kpi').innerHTML='';$('view').innerHTML=stateHTML();return;}
  const bal=d=>r2(bills.filter(b=>b.dir===d).reduce((a,b)=>a+tb(b).total-paidOf(b),0));
  $('kpi').innerHTML=`<div>To receive (outgoing)<b>${CUR} ${money(bal('out'))}</b></div><div>To pay (incoming)<b>${CUR} ${money(bal('in'))}</b></div><div>Bills<b>${bills.length}</b></div>`;
  const q=$('q').value;
  if(tab==='orders')return renderOrders(q);
  const L=bills.filter(b=>(tab==='all'||b.dir===tab)&&match(q,[b.no,b.party,b.ptype,b.note,b.oids.map(i=>(orders.find(o=>o.id===i)||{}).no).join(' '),b.lines.map(l=>l.label).join(' ')].join(' ')));
  $('view').innerHTML=L.length?`<table><thead><tr><th>Bill No</th><th>Date</th><th>Party</th><th class="n">Orders</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Balance</th><th>Status</th><th></th></tr></thead><tbody>${L.map(b=>{
    const t=tb(b).total,p=paidOf(b),s=stOf(b),dr=drift(b).length;
    return `<tr><td class="mono">${esc(b.no)} <span class="badge ${b.dir}">${b.dir==='out'?'Out':'In'}</span></td><td>${esc(b.date)}</td>
    <td>${esc(b.party)}${b.ptype?` <span class="dim" style="font-size:11px">· ${esc(b.ptype)}</span>`:''}${dr?'<div class="warn">⚠ orders changed since billing</div>':''}</td>
    <td class="n">${b.oids.length}</td><td class="n">${money(t)}</td><td class="n">${money(p)}</td><td class="n ${t-p>.005?'neg':''}">${money(t-p)}</td>
    <td><span class="badge ${s[0]}">${s[1]}</span></td>

  <div class="imeta"><div class="ibox"><div class="ilb">${out?'Bill to':'Supplier'}</div><div class="ipn">${esc(b.party)}</div>${b.ptype?`<div>${esc(b.ptype)}</div>`:''}${b.note?`<div><b>Ref:</b> ${esc(b.note)}</div>`:''}</div>
  <div class="ibox"><table class="mt"><tr><td>Invoice No</td><td><b>${esc(no)}</b></td></tr><tr><td>Date</td><td>${esc(b.date)}</td></tr>${b.no&&b.no!==no?`<tr><td>Bill Ref</td><td>${esc(b.no)}</td></tr>`:''}<tr><td>Currency</td><td>${esc(CUR)}</td></tr></table></div></div>
  <table class="it"><thead><tr><th style="width:32px">#</th><th>Description</th>${hr?'<th class="n">Ordered</th><th class="n">Returned</th>':''}<th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead><tbody>${b.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.label)}</td>${hr?`<td class="n">${l.oq}</td><td class="n">${l.rq||''}</td>`:''}<td class="n">${l.oq-l.rq}</td><td class="n">${money(l.rate)}</td><td class="n">${money((l.oq-l.rq)*l.rate)}</td></tr>`).join('')}</tbody></table>
  <div class="ibot"><div class="iwords"><div class="w"><b>Amount in words</b>${esc(amtWords(t.total))}</div>
  ${(ps.length||al.length)?`<div class="pay"><b>Payments received</b>${ps.map(x=>`<div>${esc(x.date)} · ${esc(x.mode)}${x.ref?' · '+esc(x.ref):''} · ${money(x.amount)}</div>`).join('')}${al.map(x=>`<div>${esc(x.date)} · Receipt ${esc(x.rno)}${x.orderNo?' · '+esc(x.orderNo):''} · ${money(x.amount)}</div>`).join('')}</div>`:''}</div>
  <div class="tot"><div><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.d?`<div><span>Discount${b.dt==='pct'?' ('+b.disc+'%)':''}</span><span>− ${money(t.d)}</span></div>`:''}${b.vat?`<div><span>VAT (${b.vat}%)</span><span>${money(t.v)}</span></div>`:''}
  <div class="g"><span>Total ${CUR}</span><span>${money(t.total)}</span></div><div><span>Paid</span><span>${money(p)}</span></div><div><b>Balance Due</b><b>${money(t.total-p)}</b></div></div></div></div>`;};
function printBill(id){const b=bills.find(x=>x.id===id);if(!b)return;const ft=[CO_ADDR,[CO_PHONE&&'Ph: '+CO_PHONE,CO_EMAIL&&'Email: '+CO_EMAIL].filter(Boolean).join(' ')].filter(Boolean).map(esc).join('<br>');
  $('pr').innerHTML=docHTML(b).replace(/<\/div>$/,'')+`<div class="sig"><span>Prepared by</span><span>Received by</span><span>${CO_STAMP?`<img src="${esc(CO_STAMP)}" alt=""><br>`:''}Authorized Signature &amp; Stamp</span></div><div class="ift"><b>Thank you for your business. ${esc(CO)}</b><br>${ft}</div></div>`;setTimeout(()=>window.print(),80);}
function viewBill(id){const b=bills.find(x=>x.id===id);if(!b)return;vid=id;const t=tb(b),p=paidOf(b),dr=drift(b),ps=pays.filter(x=>x.billId===id),s=stOf(b),al=allocList(b);
  $('v-title').innerHTML=esc(b.no)+' <span class="badge '+s[0]+'">'+s[1]+'</span>';
  $('v-body').innerHTML=(dr.length?`<div class="warn" style="border:1px solid var(--amber);border-radius:var(--radius);padding:8px 10px">⚠ Orders changed since this bill was made (edit / return / delete):<br>${dr.map(esc).join('<br>')}<br>Delete and re-create the bill to apply the changes.</div>`:'')
   +`<div style="background:#fff;border-radius:var(--radius);padding:12px" id="pv">${docHTML(b)}</div>`
   +`<div class="sec">Payments · balance <span class="mono ${t.total-p>.005?'neg':''}">${CUR} ${money(t.total-p)}</span></div>`
   +(ps.length?`<table><tbody>${ps.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.mode)}</td><td>${esc(x.ref)}</td><td class="n">${money(x.amount)}</td><td class="acts"><button class="btn sm dng" onclick="delPay('${x.id}')"><i class="ti ti-trash"></i></button></td></tr>`).join('')}</tbody></table>`:'')
   +(al.length?`<div class="sec">Allocated from receipts <span class="dim">(read-only — change in Allocation)</span></div><table><tbody>${al.map(x=>`<tr><td>${esc(x.date)}</td><td class="mono">${esc(x.rno)}</td><td>${esc(x.orderNo)}</td><td class="n ${x.amount<0?'neg':''}">${money(x.amount)}</td><td>${esc(x.note)}${x.rev?' (reversal)':''}</td></tr>`).join('')}</tbody></table>`:'')
   +`<div class="pr-row"><div><label>Date</label><input type="date" id="p-d" value="${today()}"/></div><div><label>Amount</label><input type="number" id="p-a" min="0" step="any" value="${Math.max(0,r2(t.total-p))}"/></div>
     <div><label>Mode</label><select id="p-m"><option>Cash</option><option>Bank transfer</option><option>Cheque</option><option>Card</option></select></div><div style="grid-column:span 2"><label>Reference</label><input id="p-r" autocomplete="off"/></div>
     <button class="btn pri" onclick="addPay()"><i class="ti ti-plus"></i>Add payment</button></div>`;
  $('ov2').classList.add('open');}
function closeView(){$('ov2').classList.remove('open');vid=null;}
async function addPay(){const b=bills.find(x=>x.id===vid);if(!b||busy)return;const a=r2($('p-a').value);if(!(a>0))return showToast('Enter an amount','error');
  const bal=r2(tb(b).total-paidOf(b));if(a>bal+.005&&!confirm('Amount is more than the balance ('+money(bal)+'). Add anyway?'))return;
  busy=true;try{await post('addPayment',{payment:{id:tsId(Date.now()),billId:vid,date:$('p-d').value||today(),amount:a,mode:$('p-m').value,ref:$('p-r').value.trim()}});await loadAll();showToast('Payment added','success');}
  catch(e){showToast('Not saved: '+errText(e.message),'error');}busy=false;}
async function delPay(id){if(!confirm('Delete this payment?'))return;try{await post('deletePayment',{ids:[id]});await loadAll();}catch(e){showToast('Not deleted: '+errText(e.message),'error');}}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('ov2').classList.contains('open'))closeView();else closeForm();});
render();cache.start();loadIDB();
if(BILLS_BACKEND){watchBills();bootBills();setInterval(()=>{if(allReady()){applyFromIDB();if(LEDGER_BACKEND)applyLedgerFromIDB();}},15000);}   // safety net behind the subscription
else{loadAll();setInterval(loadAll,30000);}
setInterval(loadIDB,10000);
</script>
</body>
</html>
