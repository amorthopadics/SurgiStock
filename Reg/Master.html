<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Master Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<script src="https://amorthopadics.github.io/SurgiStock/shared/cacheWatcher.js?v=1"></script>
<script src="https://amorthopadics.github.io/SurgiStock/shared/code.js"></script>
<script src="https://amorthopadics.github.io/SurgiStock/shared/cioView.js"></script>

<style>
/* ═══ THEME — keep identical across every module ═══ */
:root,[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;
  --surface:#21262d;--surface2:#2d333b;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --accent:#58a6ff;--accent-dim:rgba(88,166,255,.12);--accent-glow:rgba(88,166,255,.28);
  --teal:#39d353;--teal-dim:rgba(57,211,83,.12);
  --amber:#e3b341;--amber-dim:rgba(227,179,65,.12);
  --red:#f85149;--red-dim:rgba(248,81,73,.12);
  --purple:#a371f7;--purple-dim:rgba(163,113,247,.12);
  --orange:#f0883e;--orange-dim:rgba(240,136,62,.12);
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.4);--shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 8px 32px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#f0f2f5;--bg2:#fff;--bg3:#e8ecf0;
  --surface:#fff;--surface2:#e2e7ed;
  --border:#c8d0d9;--border2:#9aa5b1;
  --text:#0d1117;--text2:#3d454f;--text3:#5a6370;
  --accent:#0550ae;--accent-dim:rgba(5,80,174,.12);--accent-glow:rgba(5,80,174,.22);
  --teal:#116329;--teal-dim:rgba(17,99,41,.13);
  --amber:#7d4e00;--amber-dim:rgba(125,78,0,.13);
  --red:#a8111b;--red-dim:rgba(168,17,27,.11);
  --purple:#6639c8;--purple-dim:rgba(102,57,200,.13);
  --orange:#953800;--orange-dim:rgba(149,56,0,.13);
  --shadow:0 1px 3px rgba(0,0,0,.10);--shadow-md:0 4px 16px rgba(0,0,0,.12);--shadow-lg:0 8px 32px rgba(0,0,0,.15);
}
[data-theme="purple"]{
  --bg:#0f0b1e;--bg2:#17112e;--bg3:#1e1840;
  --surface:#221a3a;--surface2:#2c2250;
  --border:#3a2e5e;--border2:#5a4890;
  --text:#e8e0ff;--text2:#a899d4;--text3:#7a6ca8;
  --accent:#c084fc;--accent-dim:rgba(192,132,252,.14);--accent-glow:rgba(192,132,252,.3);
  --teal:#4ade80;--teal-dim:rgba(74,222,128,.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);
  --red:#f87171;--red-dim:rgba(248,113,113,.12);
  --purple:#c084fc;--purple-dim:rgba(192,132,252,.14);
  --orange:#fb923c;--orange-dim:rgba(251,146,60,.12);
  --shadow:0 1px 3px rgba(0,0,0,.5);--shadow-md:0 4px 16px rgba(0,0,0,.6);--shadow-lg:0 8px 32px rgba(0,0,0,.7);
}
[data-theme="ocean"]{
  --bg:#071520;--bg2:#0d2035;--bg3:#112840;
  --surface:#143050;--surface2:#1a3d60;
  --border:#1e4a72;--border2:#2e6a9e;
  --text:#d6eeff;--text2:#7db8e8;--text3:#4a87b8;
  --accent:#38bdf8;--accent-dim:rgba(56,189,248,.14);--accent-glow:rgba(56,189,248,.3);
  --teal:#34d399;--teal-dim:rgba(52,211,153,.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);
  --red:#f87171;--red-dim:rgba(248,113,113,.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);
  --orange:#fb923c;--orange-dim:rgba(251,146,60,.12);
  --shadow:0 1px 3px rgba(0,0,0,.5);--shadow-md:0 4px 16px rgba(0,0,0,.55);--shadow-lg:0 8px 32px rgba(0,0,0,.65);
}
[data-theme="slate"]{
  --bg:#0e1117;--bg2:#1a1f28;--bg3:#222836;
  --surface:#28303e;--surface2:#313c4e;
  --border:#3a4556;--border2:#556070;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#60a5fa;--accent-dim:rgba(96,165,250,.13);--accent-glow:rgba(96,165,250,.28);
  --teal:#4ade80;--teal-dim:rgba(74,222,128,.12);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);
  --red:#f87171;--red-dim:rgba(248,113,113,.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);
  --orange:#fb923c;--orange-dim:rgba(251,146,60,.12);
  --shadow:0 1px 3px rgba(0,0,0,.45);--shadow-md:0 4px 16px rgba(0,0,0,.5);--shadow-lg:0 8px 32px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* ═══ LAYOUT ═══ */
body{display:flex;flex-direction:column;}
.portal-wrap{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;max-width:1600px;margin:0 auto;padding:10px;gap:8px;}

/* ═══ VIEW BAR ═══ */
.view-bar{position:relative;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.vb-brand{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border-radius:var(--radius-lg);background:var(--accent-dim);color:var(--accent);border:1px solid var(--border);font-size:16px;}
.vb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.vb-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 auto;min-width:0;}
.vb-field{display:flex;align-items:center;gap:8px;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border-radius:var(--radius-lg);background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:15px;line-height:1;cursor:pointer;transition:color .15s,border-color .15s,background .15s;}
.ib:hover{border-color:var(--accent);color:var(--accent);}
.ib.sm{width:26px;height:26px;font-size:13px;border-radius:var(--radius);}
.vb-sel{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 10px;border-radius:var(--radius-lg);background:var(--bg3);border:1px solid var(--border);color:var(--text2);transition:border-color .15s;}
.vb-sel:hover,.vb-sel:focus-within{border-color:var(--accent);}
.vb-sel i{font-size:15px;line-height:1;}
.vb-sel select{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;max-width:130px;}
.vb-sel select option{background:var(--surface2);color:var(--text);}

/* search-to-select: icon button → input slides open on focus */
.vb-search{display:flex;align-items:center;}
.vb-search>.ib{position:relative;}
.vb-search.has-val>.ib,.vb-search:focus-within>.ib{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.sdw{position:relative;}
.sdw.vb-search input{width:0;margin-left:0;padding:8px 0;border-width:0;opacity:0;transition:width .2s ease,opacity .15s,margin-left .2s;}
.sdw.vb-search:focus-within input{width:clamp(170px,26vw,270px);margin-left:6px;padding:7px 30px 7px 11px;border-width:1.5px;opacity:1;}
.vb-search:not(:focus-within) .clr-btn{display:none!important;}
.sdw input{width:100%;padding:8px 34px 8px 11px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:12.5px;transition:border .15s,box-shadow .15s;}
.sdw input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.sdw input::placeholder{color:var(--text3);}
.sdw .clr-btn{position:absolute;right:7px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;padding:2px;display:none;font-size:14px;line-height:1;}
.sdw .clr-btn:hover{color:var(--text);}
.sdw input:not(:placeholder-shown) ~ .clr-btn{display:flex;}
.sdw.has-val .clr-btn{display:flex;}
.dropdown-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface2);border:1.5px solid var(--border2);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:300;max-height:240px;overflow-y:auto;display:none;}
.dropdown-list.open{display:block;}
.di{padding:8px 12px;font-size:12.5px;cursor:pointer;transition:background .1s;}
.di:hover{background:var(--accent-dim);}
.di .dn{color:var(--text);font-weight:600;}
.di .dn em{color:var(--accent);font-style:normal;}
.di .ds{font-family:var(--mono);font-size:10.5px;color:var(--text3);}
.di.no-match{color:var(--text3);cursor:default;}
.di.no-match:hover{background:none;}

/* confirm strip — shown once a selection is made */
.confirm-strip{display:none;align-items:center;gap:7px;background:var(--accent-dim);border:1px solid rgba(88,166,255,.25);border-radius:var(--radius-lg);padding:6px 10px;flex-shrink:0;flex-wrap:wrap;min-width:0;}
.ca{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;}
.cn{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.cs{font-size:10px;color:var(--text3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}

/* tabs — fixed-size nav, active tab grows and reveals its label */
.tab-nav{display:flex;gap:3px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:3px;}
.tab-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border-radius:var(--radius);border:none;background:transparent;color:var(--text2);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;}
.tab-btn i{font-size:14px;}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 10px var(--accent-glow);}
.tab-btn:not(.active):hover{background:var(--surface2);color:var(--text);}
.tabs-fixed{width:176px;flex-shrink:0;}
.tabs-fixed .tab-btn{flex:0 0 34px;gap:0;min-width:0;padding:6px 0;overflow:hidden;transition:flex-grow .28s ease,background .18s,color .18s,box-shadow .18s;}
.tabs-fixed .tab-btn.active{flex-grow:1;}
.tabs-fixed .tab-btn span{max-width:0;margin-left:0;opacity:0;overflow:hidden;transition:max-width .28s ease,margin-left .28s ease,opacity .2s;}
.tabs-fixed .tab-btn.active span{max-width:80px;margin-left:6px;opacity:1;}
@media(max-width:600px){.tab-btn span{display:none;}.tab-btn{padding:6px 9px;}}

/* cache status indicator */
@keyframes spin{to{transform:rotate(360deg);}}

/* ═══ FIELD / FORM ═══ */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;}
.field label span.req{color:var(--red);}
.date-input{width:100%;padding:8px 11px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:12.5px;}
.date-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}

/* ═══ MAIN SPLIT: sidebar / center / preview ═══ */
.main-split{flex:1;display:flex;gap:10px;min-height:0;}

.doc-sidebar{width:120px;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:8px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;box-shadow:var(--shadow);}
.doc-sidebar-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--text3);text-align:center;padding:12px 6px;}
.doc-sidebar-empty i{font-size:24px;opacity:.35;}
.doc-sidebar-empty span{font-size:10.5px;}
.doc-side-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;border-radius:var(--radius-lg);border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);font-family:var(--font);font-size:10px;font-weight:600;cursor:pointer;transition:all .18s;text-align:center;}
.doc-side-btn i{font-size:18px;}
.doc-side-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.doc-side-btn.selected{border-color:var(--accent);background:var(--accent-dim);color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.doc-side-btn.has-docs{border-color:var(--teal);color:var(--teal);}
.doc-side-btn.has-docs i{color:var(--teal);}
.doc-side-btn.expired-docs{border-color:var(--red);color:var(--red);}
.doc-side-btn.expiring-docs{border-color:var(--amber);color:var(--amber);}
.doc-count-badge{position:absolute;top:4px;right:4px;background:var(--teal);color:#fff;font-size:8.5px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.doc-count-badge.red{background:var(--red);}
.doc-count-badge.amber{background:var(--amber);}
.sidebar-sep{height:1px;background:var(--border);margin:3px 2px;}

.doc-center{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative;}
.doc-center-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;flex-shrink:0;}
.doc-center-header h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;}
.doc-center-header h3 i{color:var(--accent);font-size:17px;}
.doc-center-body{flex:1;overflow-y:auto;padding:14px 16px;}
.doc-center-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:10px;text-align:center;padding:24px;}
.doc-center-placeholder i{font-size:34px;opacity:.3;}
.doc-center-placeholder span{font-size:12.5px;}

/* generic record-list rows inside doc-center-body */
.hist-list{display:flex;flex-direction:column;gap:7px;}
.hist-rec{display:inline-flex;gap:9px;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);transition:border .12s;align-items:flex-start;cursor:pointer;width:100%;max-width:560px;}
.hist-rec:hover{border-color:var(--accent);}
.hist-rec.active{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 0 1px var(--accent);}
.hist-icon{width:30px;height:30px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;margin-top:1px;}
.hist-meta{flex:1;min-width:0;}
.hist-date{font-size:10.5px;color:var(--text2);margin-top:2px;}
.hist-exp{font-size:10px;margin-top:2px;display:flex;align-items:center;gap:3px;}
.hist-exp.red{color:var(--red);}
.hist-exp.amber{color:var(--amber);}
.hist-exp.teal{color:var(--teal);}
.hist-exp.gray{color:var(--text3);}
.hist-note{font-size:10.5px;color:var(--text2);margin-top:2px;font-style:italic;}

.doc-preview-panel{width:0;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow);overflow:hidden;transition:width .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
.doc-preview-panel.open{width:400px;}
.pph{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;flex-shrink:0;}
.pph h3{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pph h3 i{color:var(--accent);font-size:16px;flex-shrink:0;}
.pph-close{margin-left:auto;width:26px;height:26px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s;flex-shrink:0;}
.pph-close:hover{background:var(--red-dim);color:var(--red);border-color:var(--red);}
.ppb{flex:1;overflow-y:auto;padding:14px;}
.ppb img.pi{max-width:100%;border-radius:var(--radius-lg);display:block;margin:0 auto;}
.ppb iframe.pf{width:100%;height:400px;border:none;border-radius:var(--radius-lg);}
.preview-meta{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);}
.pmi{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.pmi .k{font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.pmi .v{font-size:11.5px;font-weight:600;color:var(--text);font-family:var(--mono);text-align:right;}
.ppf{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0;}

/* dashed "add new" row + inline upload form */
.txn-new-row{display:flex;align-items:center;gap:9px;padding:11px 13px;border:1.5px dashed var(--border2);border-radius:var(--radius-lg);margin-top:4px;background:var(--bg2);}
.txn-new-label{flex:1;font-size:12px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:7px;}
.txn-new-label i{font-size:17px;color:var(--text3);}
.btn-new-upload{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:1.5px solid var(--accent);background:var(--accent-dim);color:var(--accent);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .18s;}
.btn-new-upload:hover{background:var(--accent);color:#fff;}
.upload-inline{display:none;margin-top:10px;background:var(--bg3);border:1.5px dashed var(--border2);border-radius:var(--radius-lg);padding:14px;}
.upload-inline.open{display:block;}
.upload-inline-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:5px;}
.upload-inline-title i{font-size:13px;color:var(--accent);}
.upload-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
.upload-row .field{flex:1;min-width:180px;}
.file-upload-zone{border:2px dashed var(--border2);border-radius:var(--radius-lg);padding:14px;text-align:center;cursor:pointer;transition:all .18s;background:var(--surface);position:relative;}
.file-upload-zone:hover,.file-upload-zone.dragover{border-color:var(--accent);background:var(--accent-dim);}
.file-upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.file-upload-zone i{font-size:22px;color:var(--text3);display:block;margin-bottom:4px;}
.file-upload-zone p{font-size:11px;color:var(--text3);}
.file-upload-zone.has-file{border-color:var(--teal);background:var(--teal-dim);}
.file-upload-zone.has-file i,.file-upload-zone.has-file p{color:var(--teal);}
.upload-actions{display:flex;justify-content:flex-end;margin-top:10px;gap:7px;}
.gs-status{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--radius-lg);font-size:11px;font-weight:600;margin-top:8px;}
.gs-status.loading{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(88,166,255,.3);}
.gs-status.success{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(57,211,83,.3);}
.gs-status.error{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,81,73,.3);}

/* ═══ BUTTONS / BADGES ═══ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1.5px solid;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;line-height:1;}
.btn i{font-size:15px;flex-shrink:0;}

/* ═══ FLAT TABLE (e.g. a combined log tab) ═══ */
.log-table{width:100%;border-collapse:collapse;font-size:12px;}
.log-table th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--border);background:var(--bg3);cursor:pointer;white-space:nowrap;position:sticky;top:0;z-index:2;}
.log-table th:hover{color:var(--accent);}
.log-table td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.log-table tbody tr:hover{background:var(--surface2);}
.txn-mono{font-family:var(--mono);font-size:10.5px;color:var(--accent);}
.portal-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:9.5px;font-weight:700;}
.doc-link-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--radius);background:var(--accent-dim);color:var(--accent);border:1px solid rgba(88,166,255,.25);font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .14s;}
.doc-link-btn:hover{background:var(--accent);color:#fff;}

/* ═══ TOAST ═══ */
.toast{position:fixed;bottom:22px;right:22px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);padding:10px 16px;border-radius:var(--radius-lg);font-size:12.5px;font-weight:500;z-index:999;opacity:0;transform:translateY(10px);transition:all .25s cubic-bezier(.34,1.56,.64,1);pointer-events:none;display:flex;align-items:center;gap:9px;box-shadow:var(--shadow-lg);max-width:340px;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:var(--teal-dim);color:var(--teal);border-color:rgba(57,211,83,.25);}
.toast.error{background:var(--red-dim);color:var(--red);border-color:rgba(248,81,73,.25);}
.spinner{animation:spin 1s linear infinite;display:inline-flex;}

/* sub menu — sits between the main tabs and the search box */
.sub-nav{display:none;align-items:center;gap:3px;padding:3px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none;}
.sub-nav::-webkit-scrollbar{display:none;}
.sub-nav{width:360px;flex-shrink:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.sub-btn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;min-width:0;padding:7px 0;border:none;border-radius:var(--radius);background:transparent;color:var(--text2);font-family:var(--font);font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;overflow:hidden;transition:background .18s,color .18s,box-shadow .18s;}
.sub-btn i{font-size:15px;flex-shrink:0;}

</div>

<div class="portal-wrap" id="panels"></div>

  <i id="toast-icon" class="ti ti-circle-check"></i>
  <span id="toast-msg">Saved</span>
</div>

<script>
'use strict';

/* ── Cache layer: shared watcher with safe local fallback (unchanged from structure) ── */
const _IDB_NAME  = 'ap2_fleet_cache';
const _IDB_STORE = 'datasets';

if (typeof window.AP2CacheWatcher === 'undefined') {
  console.warn('[module] cacheWatcher.js did not load — using local fallback');
  window.AP2CacheWatcher = (function () {
    let _conn = null;
    function _open() {
      if (_conn) return Promise.resolve(_conn);
      return new Promise((res, rej) => {
        let done = false;
        const req = indexedDB.open(_IDB_NAME);
        const t = setTimeout(() => { if (!done) { done = true; rej(new Error('idb-open-timeout')); } }, 2000);
        req.onsuccess = e => { if (!done) { done = true; clearTimeout(t); _conn = e.target.result; res(_conn); } };
        req.onerror   = e => { if (!done) { done = true; clearTimeout(t); rej(e.target.error); } };
      });
    }
    return {
      init() {},
      subscribe() { return () => {}; },
      notifyNow() {},
      getStatus() { return { healthy: false, mode: 'local-fallback', lastError: 'cacheWatcher.js not loaded' }; },
      async readKey(key) {
        try {
          const db  = await _open();
          if (!db.objectStoreNames.contains(_IDB_STORE)) return null;
          const rec = await new Promise((res, rej) => {
            const r = db.transaction(_IDB_STORE, 'readonly').objectStore(_IDB_STORE).get(key);
            r.onsuccess = () => res(r.result || null);
            r.onerror   = () => rej(r.error);
          });
          return (rec && rec.data) ? rec.data : null;
        } catch (e) {
          if (e && e.name === 'NotFoundError') return null;
          console.warn('[module] fallback read failed:', e.message);
          return null;
        }
      }
    };
  })();
}

/* ═══════════════════════════════════════════════════════
 *  MODULE CONFIG — add / rename fields here, UI follows
 *  field types: text · textarea · status
 * ═══════════════════════════════════════════════════════ */
const STATUS_FIELD = { key:'status', label:'Status', type:'status' };

const MODULES = [
  { key:'itemlist', label:'Item Lists', plural:'Item Lists', icon:'ti-list-check', custom:true, group:'itemlist',
    hint:'Medical Domain-wise catalog: Item - Specs - Description' },
  { key:'specsetting', label:'Specs Settings', plural:'Specs Settings', icon:'ti-settings', custom:true, group:'settings',
    hint:'One sheet for every kind of Specs: ID - Specs - Item - Description - Status' },
  { key:'storebranch', label:'Store', plural:'Stores', icon:'ti-building-store', group:'spectype',
    hint:'Physical store / location',
    fields:[
      { key:'name',        label:'Store Name',  type:'text',     req:true, ph:'e.g. Main Store' },
      { key:'description', label:'Description', type:'textarea', ph:'Short description…' },
      STATUS_FIELD ] },
  { key:'medbranch',   label:'Medical Domain', plural:'Medical Domains', icon:'ti-bone', group:'spectype',
    hint:'Medical field, e.g. Trauma, Orthoscopy, Orthoplasty',
    fields:[
      { key:'name',        label:'Medical Domain Name', type:'text',     req:true, ph:'e.g. Trauma' },
      { key:'description', label:'Description',         type:'textarea', ph:'Short description…' },
      STATUS_FIELD ] },
  { key:'matsource',   label:'Material Source', plural:'Material Sources', icon:'ti-truck-delivery', group:'spectype',
    hint:'Where the material comes from, e.g. Imported, Local',
    fields:[
      { key:'name',        label:'Material Source Name', type:'text',     req:true, ph:'e.g. Imported' },
      { key:'description', label:'Description',          type:'textarea', ph:'Short description…' },
      STATUS_FIELD ] },
  { key:'item',     label:'Item Name', plural:'Item Names', icon:'ti-package', group:'spectype',
    fields:[
      { key:'name',        label:'Item Name',   type:'text',     req:true, ph:'e.g. Surgical Gloves' },
      { key:'description', label:'Description', type:'textarea', ph:'Short description…' },
      STATUS_FIELD ] },
  { key:'itemcat',  label:'Item Category', plural:'Item Categories', icon:'ti-category', group:'spectype',
    hint:'e.g. Consumables, Implants, Instruments',
    fields:[
      { key:'name',        label:'Item Category Name', type:'text',     req:true, ph:'e.g. Consumables' },
      { key:'description', label:'Description',        type:'textarea', ph:'Short description…' },
      STATUS_FIELD ] },
  { key:'specs',    label:'Specs',    plural:'Specs',     icon:'ti-list-details', group:'spectype',
    fields:[
      { key:'name',        label:'Specs Name',  type:'text',     req:true, ph:'e.g. Cardiology' },
      { key:'description', label:'Description', type:'textarea', ph:'Short description…' },
      STATUS_FIELD ] }
];
/* main tabs — only two; the settings modules live in the sub menu under "Specs Settings" */
const TOP_TABS = [
  { key:'itemlist', label:'Item Lists',     icon:'ti-list-check' },
  { key:'settings', label:'Specs Settings', icon:'ti-settings'   }
];
const BASE_TYPES = MODULES.filter(m => m.group==='spectype');
/* built-in Specs + any Specs the user creates (data.spectypes) — every Specs gets its own table */
function specTypes(){ return BASE_TYPES.concat((data.spectypes||[]).map(t => ({ key:t.key, label:t.label, plural:t.label, icon:'ti-list-details', custom:true }))); }
function typeOf(key){ return specTypes().find(m => m.key===key); }
const PANEL_MODS = MODULES.filter(m => m.group!=='spectype');     // modules that own a screen
const MOD = Object.fromEntries(MODULES.map(m => [m.key, m]));

/* ═══════════════════════════════════════════════════════
 *  DATA LAYER — localStorage now; swap load()/persist() for
 *  your backend / API calls when ready.
 * ═══════════════════════════════════════════════════════ */
const STORE_KEY = 'master_setup_v3';
const CATALOG_KEY = 'item_list_catalog_v1';   // flat copy of Item List for other modules
const OLD_STORE_KEY = 'master_setup_v2';   // earlier version: its single "branch" list becomes Store Branch
const SEED_SAMPLE_ROWS = false;   // set false to start with empty tables

let data = { spectypes:[], storebranch:[], medbranch:[], matsource:[], item:[], itemcat:[], hospital:[], doctor:[], specs:[], itemlist:[] };
const ui = {};   // per-tab UI state
MODULES.forEach(m => ui[m.key] = { q:'', filter:'all', sortKey:'created', sortAsc:false, editId:null, mb:'' });
ui.specsetting.sortKey = 'sid'; ui.specsetting.sortAsc = true; ui.specsetting.type = ''; ui.specsetting.editType = null;
let activeTab = 'itemlist';
let lastSettingsTab = 'specsetting';
let armedDelete = null;

function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { data = Object.assign(data, JSON.parse(raw)); return; }
    const old = localStorage.getItem(OLD_STORE_KEY);          // migrate earlier data once
    if (old) {
      const o = JSON.parse(old);
      data.storebranch = o.branch || [];
      ['item','hospital','doctor','specs'].forEach(k => data[k] = o[k] || []);
      if (SEED_SAMPLE_ROWS) seedMed(); else persist();
      return;
    }
  } catch(e){ console.warn('[module] storage read failed', e.message); }
  if (SEED_SAMPLE_ROWS) seed();
}
function persist(){
  assignSids();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch(e){ console.warn('[module] storage write failed', e.message); }
  publishCatalog();
}
/* ── Specs Settings → Google Sheet: ID | Specs | Item | Description | Status ── */
const SPECS_API   = 'https://script.google.com/macros/s/AKfycbyY3pSYw1m0aaI43_8prqeHrnS-pP-VkHYk40qvYO8YInjVxaRayK3vWyXNabrJotiWfQ/exec';
const SPECS_SHEET = 'Specs Settings';
async function syncSpecsSheet(){
  assignSids();
  const rows = specRows().sort((a,b) => a.r.sid - b.r.sid)
    .map(x => [x.r.sid, x.tl, x.r.name, x.r.description || '', x.r.status==='active' ? 'Active' : 'Inactive']);
  let session = ''; try { session = sessionStorage.getItem('ap_session') || localStorage.getItem('ap_session') || ''; } catch(e){}
  try {
    const res = await fetch(SPECS_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'saveSpecsSettings', sheet:SPECS_SHEET, header:['ID','Specs','Item','Description','Status'], rows, session }) });
    const j = await res.json();
    if (!j || j.success === false) throw new Error((j && j.error) || 'Sheet save failed');
  } catch(e){ console.warn('[specs] sheet sync failed', e.message); showToast('Saved locally — sheet sync failed','error'); }
}
function seed(){ seedBase(); seedLists(); }
function seedLists(){
  const mb = data.medbranch, it = data.item, sp = data.specs;
  if (mb.length < 2 || it.length < 2 || sp.length < 2) return;
  const t = Date.now();
  const e = (n, m, i, j, desc) => ({ id:'e'+(t+n), medbranchId:mb[m].id, medbranchName:mb[m].name, itemId:it[i].id, itemName:it[i].name,
    specsId:sp[j].id, specsName:sp[j].name, desc, status:'active', created:t-n*86400000, updated:t-n*86400000 });
  data.itemlist = [ e(0,0,0,1,'Box of 100'), e(1,0,1,0,'Sterile, single use'), e(2,1,1,1,'') ];
  persist();
}
function seedMed(){
  const t = Date.now();
  data.medbranch = [
    { name:'Trauma',      description:'Fracture and injury care.',        status:'active' },
    { name:'Orthoscopy',  description:'Minimally invasive joint surgery.',status:'active' },
    { name:'Orthoplasty', description:'Joint reconstruction.',            status:'active' } ]
    .map((o,i)=>Object.assign({ id:'r'+(t+i+50), created:t-i*86400000 }, o));
  persist();
}
function seedBase(){
  const t = Date.now();
  const mk = (o,i)=>Object.assign({ id:'r'+(t+i), created:t-i*86400000 }, o);
  data.storebranch = [
    { name:'Main Store',    description:'Head office store.',        status:'active' },
    { name:'North Store',   description:'Outpatient supplies.',      status:'active' },
    { name:'Old Town Store',description:'Closed for renovation.',    status:'inactive' } ].map(mk);
  data.medbranch = [
    { name:'Trauma',      description:'Fracture and injury care.',        status:'active' },
    { name:'Orthoscopy',  description:'Minimally invasive joint surgery.',status:'active' },
    { name:'Orthoplasty', description:'Joint reconstruction.',            status:'active' } ].map(mk);
  data.matsource = [
    { name:'Imported', description:'Sourced from overseas suppliers.', status:'active' },
    { name:'Local',    description:'Sourced from local suppliers.',    status:'active' } ].map(mk);
  data.itemcat = [
    { name:'Consumables', description:'Single-use supplies.',   status:'active' },
    { name:'Implants',    description:'Permanent implants.',    status:'active' },
    { name:'Instruments', description:'Reusable instruments.',  status:'active' } ].map(mk);
  data.item     = [
    { name:'Surgical Gloves', description:'Latex-free, box of 100.', status:'active' },
    { name:'IV Cannula 20G',  description:'Sterile, single use.',     status:'active' },
    { name:'Thermometer',     description:'Discontinued model.',      status:'inactive' } ].map(mk);
  data.hospital = [
    { name:'City General Hospital', description:'Main referral hospital.',   status:'active' },
    { name:'Al Noor Medical Center',description:'Day-care and paediatrics.', status:'active' },
    { name:'Green Valley Clinic',   description:'Temporarily closed.',       status:'inactive' } ].map(mk);
  data.doctor   = [
    { name:'Dr. Ahmed Khan',  description:'Cardiology consultant.', status:'active' },
    { name:'Dr. Sara Ali',    description:'Paediatrician.',         status:'active' },
    { name:'Dr. Omar Hassan', description:'On leave.',              status:'inactive' } ].map(mk);
  data.specs    = [
    { name:'Cardiology',  description:'Heart and vascular care.', status:'active' },
    { name:'Orthopedics', description:'Bone and joint care.',     status:'active' },
    { name:'Dermatology', description:'',                          status:'inactive' } ].map(mk);
  persist();
}

/* ═══════════════════════════════════════════════════════
 *  BUILD UI (tabs · selectors · panels) from MODULES
 * ═══════════════════════════════════════════════════════ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

function buildUI(){
  document.getElementById('tab-nav').innerHTML = TOP_TABS.map((t,i)=>
    `<button class="tab-btn${i===0?' active':''}" id="top-${t.key}-btn" title="${t.label}" onclick="switchTop('${t.key}')"><i class="ti ${t.icon}"></i><span>${t.label}</span></button>`
  ).join('');

  document.getElementById('panels').innerHTML = PANEL_MODS.map((m,i)=> m.key==='specsetting' ? specPanel(m,i) : m.custom ? listPanel(m,i) : `
    <div class="tab-panel" id="tab-${m.key}" style="display:${i?'none':'flex'};flex-direction:column;gap:10px;flex:1;min-height:0;">
      <div class="main-split">
        
        <div class="doc-center" id="${m.key}-center">
          <div class="doc-center-header">
            <h3><i class="ti ${m.icon}"></i>${esc(m.label)} List <span class="badge purple" id="${m.key}-count">0</span></h3>
            ${m.hint ? `<span class="hist-tip"><i class="ti ti-info-circle"></i>${esc(m.hint)}</span>` : ''}
            <div class="hdr-actions">
              ${hdrTools(m.key)}
              <button class="btn btn-primary btn-sm" data-act="add" data-k="${m.key}" title="Add ${esc(m.label)}"><i class="ti ti-plus"></i><span class="lbl">Add ${esc(m.label)}</span></button>
            </div>
          </div>
          <div class="doc-center-body" id="${m.key}-body"></div>
        </div>
        <div class="doc-preview-panel" id="${m.key}-preview-panel">
          <div class="pph"><h3><i class="ti ti-forms"></i><span id="${m.key}-preview-title">Add ${esc(m.label)}</span></h3>
            <button class="pph-close" data-act="cancel" data-k="${m.key}" title="Close"><i class="ti ti-x"></i></button></div>
          <div class="ppb" id="${m.key}-preview-body"></div>
          <div class="ppf form-actions">
            <button class="btn btn-ghost" data-act="cancel" data-k="${m.key}">Cancel</button>
            <button class="btn btn-primary" data-act="save" data-k="${m.key}"><i class="ti ti-device-floppy"></i> <span id="${m.key}-save-lbl">Save</span></button>
          </div>
        </div>
      </div>
    </div>`).join('');
}

/* ═══════════════════════════════════════════════════════
 *  RENDER — sidebar filter tiles + datatable
 * ═══════════════════════════════════════════════════════ */
function renderAll(){ PANEL_MODS.forEach(m => render(m.key)); }
function render(k){ renderSidebar(k); renderTable(k); }

function renderSidebar(k){
  if (k==='specsetting') return renderSpecSidebar();
  if (MOD[k].custom) return renderListSidebar(k);
  renderFilters(k, data[k]);
}
/* Active / Inactive filter icons in the header (click again to clear) */
function renderFilters(k, rows){
  const el = document.getElementById(k+'-filters'); if (!el) return;
  const s = ui[k], n = st => rows.filter(r => r.status===st).length;
  const btn = (f, icon, label) => `<button class="ib flt ${f}${s.filter===f?' on':''}" type="button" data-act="sfilter" data-k="${k}" data-v="${f}"
    title="${label} (${n(f)}) — ${s.filter===f?'click to show all':'click to filter'}" aria-pressed="${s.filter===f}"><i class="ti ${icon}"></i><b class="flt-n">${n(f)}</b></button>`;
  el.innerHTML = btn('active','ti-circle-check','Active') + btn('inactive','ti-circle-x','Inactive');
}

function visibleRows(k){
  const s = ui[k], m = MOD[k], q = s.q.trim().toLowerCase();
  let rows = data[k].filter(r => s.filter==='all' || r.status===s.filter);
  if (q) rows = rows.filter(r => m.fields.some(f => String(r[f.key]||'').toLowerCase().includes(q)));
  const dir = s.sortAsc ? 1 : -1;
  rows.sort((a,b)=>{
    const x = a[s.sortKey] ?? '', y = b[s.sortKey] ?? '';
    return (typeof x==='number' && typeof y==='number') ? (x-y)*dir : String(x).localeCompare(String(y), undefined, {sensitivity:'base'})*dir;
  });
  return rows;
}

function renderTable(k){
  if (k==='specsetting') return renderSpecTable();
  if (MOD[k].custom) return renderListTable(k);
  const m = MOD[k], s = ui[k], rows = visibleRows(k);
  document.getElementById(k+'-count').textContent = rows.length + (rows.length!==data[k].length ? ' / '+data[k].length : '');
  const body = document.getElementById(k+'-body');

  if (!rows.length){
    const empty = !data[k].length;
    body.innerHTML = `<div class="doc-center-placeholder"><i class="ti ${empty?m.icon:'ti-search-off'}"></i>
      <span>${empty ? 'No '+esc(m.plural.toLowerCase())+' added yet' : 'No records match your filter'}</span>
      ${empty ? `<button class="btn btn-primary btn-sm" data-act="add" data-k="${k}"><i class="ti ti-plus"></i> Add ${esc(m.label)}</button>` : ''}</div>`;
    return;
  }

  const th = (key,label) => `<th data-act="sort" data-k="${k}" data-v="${key}">${esc(label)}${
    s.sortKey===key ? `<i class="ti ti-chevron-${s.sortAsc?'up':'down'} sort-i"></i>` : ''}</th>`;
  const cols = m.fields.map(f => th(f.key, f.label)).join('');

  const trs = rows.map((r,i)=>{
    const tds = m.fields.map(f=>{
      if (f.type==='status') return `<td><span class="st-badge ${r.status}">${r.status==='active'?'Active':'Inactive'}</span></td>`;
      if (f.type==='textarea') return r[f.key] ? `<td class="cell-desc" title="${esc(r[f.key])}">${esc(r[f.key])}</td>` : `<td class="cell-muted">—</td>`;
      return `<td><strong>${esc(r[f.key])}</strong></td>`;
    }).join('');
    const armed = armedDelete && armedDelete.k===k && armedDelete.id===r.id;
    return `<tr>
      <td class="num">${i+1}</td>${tds}
      <td class="txn-mono">${fmtDate(r.created)}</td>
      <td class="acts"><div class="act-btns">
        <button class="ib sm" title="Edit" data-act="edit" data-k="${k}" data-id="${r.id}"><i class="ti ti-pencil"></i></button>
        <button class="ib sm" title="Set ${r.status==='active'?'inactive':'active'}" data-act="toggle" data-k="${k}" data-id="${r.id}"><i class="ti ti-${r.status==='active'?'toggle-right':'toggle-left'}"></i></button>
        <button class="ib sm danger ${armed?'armed':''}" title="${armed?'Click again to confirm':'Delete'}" data-act="del" data-k="${k}" data-id="${r.id}"><i class="ti ti-${armed?'check':'trash'}"></i></button>
      </div></td></tr>`;
  }).join('');

  body.innerHTML = `<table class="log-table"><thead><tr>
      <th style="cursor:default">#</th>${cols}${th('created','Added')}<th style="cursor:default"></th>
    </tr></thead><tbody>${trs}</tbody></table>`;
}


/* ═══════════════════════════════════════════════════════
 *  SPECS SETTINGS — ONE sheet for every kind of Specs
 *  ID · Specs (selected) · Item · Description · Status (default Active)
 *  Rows live in the per-type lists (Store, Medical Domain, …) so the
 *  Item List dropdowns keep working; this sheet is the single view/editor.
 * ═══════════════════════════════════════════════════════ */
function assignSids(){
  let max = 0; const pend = [];
  specTypes().forEach(m => (data[m.key]||[]).forEach(r => { if (r.sid) max = Math.max(max, r.sid); else pend.push(r); }));
  pend.sort((a,b) => (a.created||0)-(b.created||0)).forEach(r => { r.sid = ++max; });
}
function specTypeOf(label){
  const q = String(label||'').trim().toLowerCase();
  return specTypes().find(m => m.key===q || m.label.toLowerCase()===q || m.plural.toLowerCase()===q) || null;
}
function specRows(){ return specTypes().flatMap(m => (data[m.key]||[]).map(r => ({ r, t:m.key, tl:m.label, ti:m.icon }))); }
function visibleSpecRows(){
  const s = ui.specsetting, q = s.q.trim().toLowerCase();
  let rows = specRows().filter(x => (s.filter==='all' || x.r.status===s.filter) && (!s.type || x.t===s.type));
  if (q) rows = rows.filter(x => (x.r.sid+' '+x.tl+' '+x.r.name+' '+(x.r.description||'')+' '+x.r.status).toLowerCase().includes(q));
  const val = x => s.sortKey==='sid' ? x.r.sid : s.sortKey==='name' ? x.r.name : s.sortKey==='description' ? (x.r.description||'') : x.r.status;
  const dir = s.sortAsc ? 1 : -1;
  return rows.sort((a,b) => { const p = val(a), c = val(b);
    return (typeof p==='number' && typeof c==='number') ? (p-c)*dir : String(p).localeCompare(String(c), undefined, {sensitivity:'base'})*dir; });
}
function specPanel(m,i){
  return `
    <div class="tab-panel" id="tab-${m.key}" style="display:${i?'none':'flex'};flex-direction:column;gap:10px;flex:1;min-height:0;">
      <div class="main-split">
        <div class="doc-center" id="${m.key}-center">
          <div class="doc-center-header">
            <h3><i class="ti ${m.icon}"></i>${esc(m.label)} <span class="badge purple" id="${m.key}-count">0</span></h3>
            <span class="hist-tip"><i class="ti ti-info-circle"></i>${esc(m.hint)}</span>
            <div class="hdr-actions">
              ${hdrTools(m.key)}
              <button class="btn btn-primary btn-sm" data-act="add" data-k="${m.key}" title="Add Specs Setting"><i class="ti ti-plus"></i><span class="lbl">Add Specs Setting</span></button>
            </div>
          </div>
          <div class="doc-center-body" id="${m.key}-body"></div>
        </div>
        <div class="doc-preview-panel" id="${m.key}-preview-panel"></div>
      </div>
    </div>`;
}
function renderSpecSidebar(){ renderFilters('specsetting', specRows().map(x => x.r)); }
/* every Specs = one table, all shown together in one frame; a new Specs adds a new table */
function renderSpecTable(){
  const k = 'specsetting', s = ui[k], rows = visibleSpecRows(), total = specRows().length, types = specTypes();
  const filtering = s.q.trim() || s.filter!=='all';
  document.getElementById(k+'-count').textContent = types.length + ' Specs · ' + rows.length + (rows.length!==total ? ' / '+total : '') + ' items';
  const body = document.getElementById(k+'-body');
  const th = (key,label) => `<th data-act="sort" data-k="${k}" data-v="${key}">${label}${s.sortKey===key ? `<i class="ti ti-chevron-${s.sortAsc?'up':'down'} sort-i"></i>` : ''}</th>`;

/* ── Add / Edit Specs Setting — foldable side window (multiple New Specs · multiple Items) ── */
let sdraft = null;
const specPanelEl = () => document.getElementById('specsetting-preview-panel');
const blankSpecDraft = (t, status) => ({ id:null, t:t||'', isNew:false, newNames:[''], rows:[{ name:'', description:'' }], status:status||'active' });
function openSpecForm(id, t){
  const rec = id ? (data[t]||[]).find(r => r.id===id) : null;
  sdraft = blankSpecDraft(t);
  if (rec){ sdraft.id = rec.id; sdraft.rows = [{ name:rec.name, description:rec.description||'' }]; sdraft.status = rec.status; }
  renderSpecModal();
  specPanelEl().classList.add('open');
  setTimeout(() => { const f = specPanelEl().querySelector(sdraft && sdraft.isNew ? '[data-sn]' : '[data-si]'); if (f && sdraft && (sdraft.t||sdraft.isNew)) f.focus(); }, 260);
}
function closeSpecModal(){ specPanelEl().classList.remove('open'); sdraft = null; }
function renderSpecModal(){
  const d = sdraft, edit = !!d.id, E = d.errs || {}, has = (k,i) => (E[k]||[]).includes(i);
  const chip = m => `<button type="button" class="chip${d.t===m.key&&!d.isNew?' on':''}${edit&&d.t!==m.key?' dis':''}" data-act="sm-type" data-v="${m.key}"${edit?' disabled':''}><i class="ti ${m.icon}"></i>${esc(m.label)}</button>`;
  const addBtn = (act, show) => show ? `<button class="btn btn-ghost btn-sm" type="button" data-act="${act}" style="margin-left:auto;"><i class="ti ti-plus"></i> Add row</button>` : '';
  const names = d.isNew ? `<div class="field"><div class="fgrp-lbl"><i class="ti ti-list-details"></i>New Specs Name <span class="req">*</span>${addBtn('sm-addname', true)}</div>
      <div class="form-stack" style="gap:8px;">${d.newNames.map((n,i) => `<div class="spec-row"><div class="rno">New Specs ${i+1}</div>
        <input class="date-input${has('n',i)?' bad':''}" data-sn="${i}" type="text" placeholder="e.g. Brand, Size, Color…" value="${esc(n)}" autocomplete="off"/>
        ${d.newNames.length>1 ? `<button class="ib sm danger" type="button" title="Remove row" data-act="sm-delname" data-i="${i}"><i class="ti ti-trash"></i></button>` : '<span></span>'}</div>`).join('')}</div></div>` : '';
  const items = `<div class="field"><div class="fgrp-lbl"><i class="ti ti-package"></i>Item <span class="req">*</span>${addBtn('sm-addrow', !edit)}</div>
      <div class="form-stack" style="gap:8px;">${d.rows.map((r,i) => `<div class="spec-row"><div class="rno">Item ${i+1}</div>
        <div class="rcol"><input class="date-input${has('r',i)?' bad':''}" data-si="${i}" data-sk="name" type="text" placeholder="e.g. Trauma, Main Store, Imported…" value="${esc(r.name)}" autocomplete="off"/>

        ${d.rows.length>1 && !edit ? `<button class="ib sm danger" type="button" title="Remove row" data-act="sm-delrow" data-i="${i}"><i class="ti ti-trash"></i></button>` : '<span></span>'}</div>`).join('')}</div></div>`;
  specPanelEl().innerHTML = `
    <div class="pph"><h3><i class="ti ti-forms"></i><span>${edit?'Edit Specs Setting':'Add Specs Setting'}</span></h3>
      <button class="pph-close" data-act="sm-close" title="Close"><i class="ti ti-x"></i></button></div>
    <div class="ppb"><div class="form-stack">
      <div class="edit-banner ${edit?'show':''}"><i class="ti ti-pencil"></i> Editing existing record · ID ${edit?(((data[d.t]||[]).find(r=>r.id===d.id)||{}).sid||''):''}</div>
      <div class="field"><div class="fgrp-lbl">Specs ${d.isNew?'':'<span class="req">*</span>'}</div>
        <div class="chips${E.t?' bad':''}">${specTypes().map(chip).join('')}${edit?'':`<button type="button" class="chip new${d.isNew?' on':''}" data-act="sm-type" data-v="__new__"><i class="ti ti-plus"></i>New Specs</button>`}</div></div>
      ${names}
      ${items}
      <div class="field inl"><label>Status</label>
        <select class="date-input" data-sf="status"><option value="active"${d.status==='active'?' selected':''}>Active</option><option value="inactive"${d.status==='inactive'?' selected':''}>Inactive</option></select></div>

      <button class="btn btn-ghost" type="button" data-act="sm-close">Cancel</button>
      ${edit ? '' : `<button class="btn btn-ghost" type="button" data-act="sm-save-new"><i class="ti ti-plus"></i> Save &amp; Add Another</button>`}
      <button class="btn btn-primary" type="button" data-act="sm-save"><i class="ti ti-device-floppy"></i> ${edit?'Update':'Save'}</button>
    </div>`;
}
function saveSpec(another){
  const d = sdraft, E = { n:[], r:[] };
  const names = d.newNames.map((n,i) => ({ i, v:n.trim() })).filter(x => x.v);
  const rows  = d.rows.map((r,i) => ({ i, name:r.name.trim(), description:r.description.trim() })).filter(r => r.name || r.description);
  if (!d.isNew && !d.t) E.t = 1;
  if (d.isNew && !names.length) E.n.push(0);
  if (!rows.length) E.r.push(0);
  rows.forEach(r => { if (!r.name) E.r.push(r.i); });
  const seenN = new Set(), taken = specTypes().map(m => m.label.toLowerCase());
  let dupType = false;
  names.forEach(x => { const k = x.v.toLowerCase(); if (seenN.has(k) || taken.includes(k)){ E.n.push(x.i); dupType = true; } seenN.add(k); });
  const targets = d.isNew ? names.map(x => x.v) : [d.t];
  const seenR = new Set(); let dupItem = false;
  rows.forEach(r => { const k = r.name.toLowerCase(); if (!r.name) return;
    const exists = !d.isNew && d.t && (data[d.t]||[]).some(x => x.id!==d.id && x.name.trim().toLowerCase()===k);
    if (seenR.has(k) || exists){ E.r.push(r.i); dupItem = true; } seenR.add(k); });
  if (E.t || E.n.length || E.r.length){
    d.errs = E; renderSpecModal();
    return showToast(dupType ? 'This Specs already exists — select it above' : dupItem ? 'Duplicate — this item already exists' : 'Please fill the required fields','error');
  }
  d.errs = null;
  const now = Date.now(); let n = 0, added = 0, firstKey = d.t;
  const keys = d.isNew ? targets.map((label,i) => { const key = 'sp'+now+i; (data.spectypes = data.spectypes||[]).push({ key, label }); data[key] = []; return key; }) : [d.t];
  firstKey = keys[0];
  if (d.id){
    const r = rows[0]; Object.assign(data[d.t].find(x => x.id===d.id), { name:r.name, description:r.description, status:d.status });
  } else {
    keys.forEach(key => rows.slice().reverse().forEach(r => {
      data[key].unshift({ id:'r'+now+(n++)+Math.floor(Math.random()*1000), name:r.name, description:r.description, status:d.status, created:now }); added++;
    }));
  }
  const wasEdit = !!d.id, newCount = d.isNew ? keys.length : 0;
  persist(); render('specsetting'); syncSpecsSheet();
  if (another && !wasEdit){
    sdraft = blankSpecDraft(firstKey, d.status); renderSpecModal();
    const f = specPanelEl().querySelector('[data-si]'); if (f) f.focus();
    showToast('Saved — add the next one','success');
  } else {
    closeSpecModal();
    showToast(wasEdit ? 'Specs setting updated' : (newCount ? newCount+' new Specs · ' : '') + added+' item'+(added>1?'s':'')+' added','success');
  }
}
function wireSpecEvents(){
  const sync = e => {
    const el = e.target, ds = el.dataset; if (!sdraft || !ds) return;
    if (ds.sn !== undefined){ sdraft.newNames[+ds.sn] = el.value; }
    else if (ds.si !== undefined){ sdraft.rows[+ds.si][ds.sk] = el.value; }
    else if (ds.sf){ sdraft[ds.sf] = el.value; }
    else return;
    if (el.classList.contains('bad') && el.value) el.classList.remove('bad');
  };
  document.addEventListener('input', sync); document.addEventListener('change', sync);
  document.addEventListener('keydown', e => { if (sdraft && e.key==='Escape') closeSpecModal(); });
}

     </div>`;

function saveForm(k){
  if (k==='itemlist') return saveEntry(false);
  if (k==='specsetting') return saveSpec();
  const m = MOD[k], s = ui[k];
  const vals = {}; let ok = true;
  m.fields.forEach(f=>{
    const el = document.getElementById(`${k}-f-${f.key}`), wrap = document.getElementById(`${k}-f-${f.key}-wrap`);
    vals[f.key] = (el.value||'').trim();
    wrap.classList.remove('invalid');
    if (f.req && !vals[f.key]){
      wrap.classList.add('invalid'); wrap.querySelector('.err').textContent = f.label+' is required'; ok = false;
    }
  });
  if (!ok) return showToast('Please fill the required fields','error');

  const reqKeys = m.fields.filter(f=>f.req).map(f=>f.key);
  const dup = data[k].find(r => r.id!==s.editId && reqKeys.every(key => String(r[key]).toLowerCase()===vals[key].toLowerCase()));
  if (dup){
    const first = document.getElementById(`${k}-f-${reqKeys[0]}-wrap`);
    first.classList.add('invalid'); first.querySelector('.err').textContent = 'This record already exists';
    return showToast('Duplicate record','error');
  }

  if (s.editId){
    Object.assign(data[k].find(r=>r.id===s.editId), vals);
    showToast(m.label+' updated','success');
  } else {
    data[k].unshift(Object.assign({ id:'r'+Date.now()+Math.floor(Math.random()*1000), created:Date.now() }, vals));
    showToast(m.label+' added','success');
  }
  persist(); closeForm(k); render(k);
}
function closeForm(k){
  if (k==='specsetting') return closeSpecModal();
  if (k==='itemlist') return closeListModal();
  ui[k].editId = null; closePreview(k);
}

/* ═══════════════════════════════════════════════════════
 *  ITEM LIST — one-time catalog, Medical Domain-wise
 *  Each entry = Medical Branch + Item + Specs + optional Description,
 *  shown merged as:  Item - Specs - Description
 *  A flat, ready-to-use copy is published to localStorage["item_list_catalog_v1"]
 *  every time something is saved, for Sale / Purchase / Item Mgmt / Store Mgmt modules.
 * ═══════════════════════════════════════════════════════ */
let draft = null;                 // entry being added / edited in the modal
let lmErrs = new Set();           // fields flagged invalid
const LABEL_SEP = ' - ';

function liveName(kind, id, snap){
  const r = id ? (data[kind]||[]).find(x => x.id===id) : null;
  return r ? r.name : (snap || '');
}
function entryView(r){
  const mb = liveName('medbranch', r.medbranchId, r.medbranchName);
  const item = liveName('item', r.itemId, r.itemName);
  const specs = liveName('specs', r.specsId, r.specsName);
  const desc = (r.desc || '').trim();
  const extras = Object.keys(r.extras||{}).map(key => liveName(key, r.extras[key], '')).filter(Boolean);
  return { mb, item, specs, extras, desc, label:[item, specs, ...extras, desc].filter(Boolean).join(LABEL_SEP) };
}

/* flat list for other modules */
function publishCatalog(){
  try {
    const out = data.itemlist.map(r => { const v = entryView(r);
      return { id:r.id, medbranchId:r.medbranchId, medbranch:v.mb, itemId:r.itemId, item:v.item,
               specsId:r.specsId, specs:v.specs, desc:v.desc, label:v.label, status:r.status }; });
    localStorage.setItem(CATALOG_KEY, JSON.stringify(out));
  } catch(e){ console.warn('[module] catalog publish failed', e.message); }
}

/* older builds saved lists with "lines" — flatten them into entries once */
function migrateLists(){
  if (data.itemlist.some(r => Array.isArray(r.lines))){
    const out = []; let n = 0;
    data.itemlist.forEach(r => {
      if (!Array.isArray(r.lines)){ out.push(r); return; }
      r.lines.forEach(l => out.push({ id:'e'+Date.now()+(n++), medbranchId:r.medbranchId, medbranchName:r.medbranchName,
        itemId:l.itemId, itemName:l.itemName, specsId:l.specsId, specsName:l.specsName, desc:l.note||'',
        status:r.status, created:r.created||Date.now(), updated:r.updated||Date.now() }));
    });
    data.itemlist = out; persist();
  } else publishCatalog();
}

function exportCsv(){
  const cell = x => '"' + String(x ?? '').replace(/"/g,'""') + '"';
  const rows = [['Medical Domain','Item Name','Specs','Description','Item List Entry','Status']]
    .concat(visibleEntries().map(x => [x.v.mb, x.v.item, x.v.specs, x.v.desc, x.v.label, x.r.status]));
  if (rows.length === 1) return showToast('Nothing to export','error');
  const a = document.createElement('a');

  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);

}

function cbClose(){ document.querySelectorAll('.cb.open').forEach(c => c.classList.remove('open')); }
function cbOpen(inp){
  cbClose();
  const box = inp.parentElement, pop = box.querySelector('.cb-pop'), q = inp.value.trim(), ql = q.toLowerCase(), all = data[inp.dataset.cbk]||[];
  const list = all.filter(o => o.status==='active' && (!ql || o.name.toLowerCase().includes(ql)));

function wireCombo(){
  document.addEventListener('focusin', e => { if (draft && e.target.dataset && e.target.dataset.cbi) cbOpen(e.target); });
  document.addEventListener('input',   e => { if (draft && e.target.dataset && e.target.dataset.cbi){ cbSet(e.target, e.target.value); cbOpen(e.target); } });
  document.addEventListener('mousedown', e => {
    const opt = e.target.closest && e.target.closest('.cb-opt');
    if (opt){
      e.preventDefault();
      const inp = opt.closest('.cb').querySelector('input'); inp.value = opt.dataset.v; cbSet(inp, opt.dataset.v); cbClose(); return;
    }
    if (!(e.target.closest && e.target.closest('.cb'))) cbClose();
  });
  document.addEventListener('keydown', e => {
    const inp = e.target; if (!draft || !inp.dataset || !inp.dataset.cbi) return;
    const box = inp.parentElement, opts = [...box.querySelectorAll('.cb-opt')], cur = opts.findIndex(o => o.classList.contains('hl'));
    const hl = i => { opts.forEach(o => o.classList.remove('hl')); if (opts[i]){ opts[i].classList.add('hl'); opts[i].scrollIntoView && opts[i].scrollIntoView({block:'nearest'}); } };
    if (e.key==='ArrowDown'){ e.preventDefault(); if (!box.classList.contains('open')) cbOpen(inp); else hl(Math.min(opts.length-1, cur+1)); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); hl(Math.max(0, cur-1)); }
    else if (e.key==='Enter'){
      e.preventDefault(); e.stopPropagation();
      if (cur>=0){ inp.value = opts[cur].dataset.v; cbSet(inp, inp.value); }
      cbClose();
    }
    else if (e.key==='Escape' && box.classList.contains('open')){ e.stopPropagation(); cbClose(); }
  }, true);
}

function saveEntry(another){
  const d = draft; lmErrs = new Set();
  const v = {}; ['medbranch','matsource','item','itemcat'].forEach(k => v[k] = (d.vals[k]||'').trim());
  if (!v.medbranch) lmErrs.add('medbranch');
  if (!v.item) lmErrs.add('item');
  const rows = d.rows.map((r,i) => ({ i, specs:(r.specs||'').trim(), desc:(r.desc||'').trim() })).filter(r => r.specs);
  if (!rows.length) lmErrs.add('r0');
  const find = (kind, name) => name ? (data[kind]||[]).find(x => x.name.trim().toLowerCase()===name.toLowerCase()) : null;
  const seen = new Set();
  rows.forEach(r => {
    let dup = seen.has(r.specs.toLowerCase()); seen.add(r.specs.toLowerCase());
    if (!dup){
      const mb = find('medbranch',v.medbranch), it = find('item',v.item), sp = find('specs',r.specs), ms = find('matsource',v.matsource), ic = find('itemcat',v.itemcat);
      if (mb && it && sp && (!v.matsource || ms) && (!v.itemcat || ic))
        dup = data.itemlist.some(e => e.id!==d.id && e.medbranchId===mb.id && e.itemId===it.id && e.specsId===sp.id
          && ((e.extras||{}).matsource||'')===(ms?ms.id:'') && ((e.extras||{}).itemcat||'')===(ic?ic.id:'')
          && (e.desc||'').trim().toLowerCase()===r.desc.toLowerCase());
    }
    if (dup) lmErrs.add('r'+r.i);
  });
  if (lmErrs.size){ renderListModal(); return showToast(lmErrs.has('medbranch')||lmErrs.has('item') ? 'Please fill the highlighted fields' : 'Check the highlighted Specs rows (required or already exists)','error'); }

  const now = Date.now(); let n = 0, created = 0;
  const ensure = (kind, name) => {              // missing → saved to Specs Settings (no description) and used right away
    if (!name) return null;
    let rec = find(kind, name);
    if (!rec){ rec = { id:'r'+now+(n++)+kind, name, description:'', status:'active', created:now }; data[kind].unshift(rec); created++; }
    return rec;
  };
  const mb = ensure('medbranch',v.medbranch), it = ensure('item',v.item), ms = ensure('matsource',v.matsource), ic = ensure('itemcat',v.itemcat);
  const extras = {}; if (ms) extras.matsource = ms.id; if (ic) extras.itemcat = ic.id;
  const wasEdit = !!d.id; let last = null;
  rows.forEach(r => {
    const sp = ensure('specs', r.specs);
    const rec = {
      id: d.id || 'e'+now+(n++)+Math.floor(Math.random()*1000),
      medbranchId:mb.id, medbranchName:mb.name, itemId:it.id, itemName:it.name, specsId:sp.id, specsName:sp.name,
      extras:Object.assign({}, extras), desc:r.desc, status:d.status, created:d.created || now, updated:now
    };
    const idx = data.itemlist.findIndex(x => x.id===rec.id);
    if (idx >= 0) data.itemlist[idx] = rec; else data.itemlist.unshift(rec);
    last = rec;
  });
  persist();
  switchTab('itemlist'); render('itemlist'); render('specsetting');
  const note = created ? ` · ${created} new added to Specs Settings` : '';

  if (another && !wasEdit){
    draft = { id:null, status:d.status, vals:{ medbranch:mb.name, matsource:'', item:'', itemcat:'' }, rows:[{specs:'',desc:''}] };
    lmErrs = new Set(); renderListModal();
    showToast('Saved — add the next one'+note,'success');
  } else {
    closeListModal();
    showToast((wasEdit ? 'Entry updated' : rows.length+(rows.length>1?' entries':' entry')+' saved')+note,'success');
  }
}

}
function csvCell(x){ return '"' + String(x ?? '').replace(/"/g,'""') + '"'; }
function downloadCsv(name, rows){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'}));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadTemplate(k){
  const m = MOD[k];
  if (k==='specsetting') downloadCsv('specs_setting_template.csv', [['Specs','Item','Description','Status'], ['Medical Domain','Trauma','Fracture and injury care','active']]);
  else if (m.custom) downloadCsv('item_list_template.csv', [['Medical Domain','Item Name','Specs','Description','Status'], ['Trauma','Surgical Gloves','Box of 100','Latex-free','active']]);
  else downloadCsv(k+'_template.csv', [[m.fields[0].label,'Description','Status'], [m.fields[0].ph.replace(/^e\.g\.\s*/,''),'Short description','active']]);
  showToast('Template downloaded','success');
}
function parseCsv(text){
  text = text.replace(/^\ufeff/,'');
  const first = text.split(/\r?\n/)[0] || '';
  const d = (first.split(',').length < 2 && first.includes(';')) ? ';' : (first.split(',').length < 2 && first.includes('\t')) ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
const colIdx = (head, re, fallback) => { const i = head.findIndex(h => re.test(h)); return i >= 0 ? i : fallback; };
const normStatus = v => /^(inactive|in-active|no|0|false|disabled)$/i.test(String(v||'').trim()) ? 'inactive' : 'active';

function findOrCreate(kind, name, t, n){
  const nm = name.trim().toLowerCase();
  let r = data[kind].find(x => x.name.trim().toLowerCase() === nm);
  if (!r){ r = { id:'r'+(t+n)+kind, name:name.trim(), description:'', status:'active', created:t }; data[kind].push(r); }
  return r;
}
function importRows(k, rows){
  const head = rows[0].map(h => String(h).trim().toLowerCase()), body = rows.slice(1), t = Date.now();
  let added = 0, skipped = 0, n = 0;
  if (k==='specsetting'){
    const ci = { sp:colIdx(head,/spec|type/,0), it:colIdx(head,/item|name/,1), de:colIdx(head,/desc/,2), st:colIdx(head,/status/,3) };
    body.forEach(r => {
      const t0 = Date.now(), t = specTypeOf((r[ci.sp]||'').trim()), name = (r[ci.it]||'').trim();
      if (!t || !name || data[t.key].some(x => x.name.trim().toLowerCase()===name.toLowerCase())){ skipped++; return; }
      data[t.key].unshift({ id:'r'+t0+(n++)+t.key, name, description:(r[ci.de]||'').trim(), status:normStatus(r[ci.st]), created:Date.now() });
      added++;
    });
  } else if (MOD[k].custom){
    const ci = { mb:colIdx(head,/domain|branch/,0), it:colIdx(head,/item/,1), sp:colIdx(head,/spec/,2), de:colIdx(head,/desc/,3), st:colIdx(head,/status/,4) };
    body.forEach(r => {
      const mbN = (r[ci.mb]||'').trim(), itN = (r[ci.it]||'').trim(), spN = (r[ci.sp]||'').trim();
      if (!mbN || !itN || !spN){ skipped++; return; }
      const mb = findOrCreate('medbranch', mbN, t, n++), it = findOrCreate('item', itN, t, n++), sp = findOrCreate('specs', spN, t, n++);
      if (data.itemlist.some(e => e.medbranchId===mb.id && e.itemId===it.id && e.specsId===sp.id)){ skipped++; return; }
      data.itemlist.unshift({ id:'e'+t+(n++), medbranchId:mb.id, medbranchName:mb.name, itemId:it.id, itemName:it.name, specsId:sp.id, specsName:sp.name,
        desc:(r[ci.de]||'').trim(), status:normStatus(r[ci.st]), created:t, updated:t });
      added++;
    });
  } else {
    const ci = { nm:colIdx(head,/name/,0), de:colIdx(head,/desc/,1), st:colIdx(head,/status/,2) };
    body.forEach(r => {
      const name = (r[ci.nm]||'').trim();
      if (!name || data[k].some(x => x.name.trim().toLowerCase() === name.toLowerCase())){ skipped++; return; }
      data[k].unshift({ id:'r'+t+(n++), name, description:(r[ci.de]||'').trim(), status:normStatus(r[ci.st]), created:t });
      added++;
    });
  }
  if (added) persist();
  renderAll();
  showToast(added ? `Imported ${added} record${added>1?'s':''}` + (skipped ? ` · ${skipped} skipped` : '') : 'Nothing imported — ' + (skipped ? 'all rows were empty or duplicates' : 'file is empty'), added ? 'success' : 'error');
}
function wireImport(){
  document.addEventListener('change', async e => {
    const inp = e.target; if (!inp.classList || !inp.classList.contains('imp-file')) return;
    const f = inp.files && inp.files[0]; if (!f) return;
    try {
      const rows = parseCsv(await f.text());
      if (rows.length < 2) showToast('File has no data rows — download the template to see the format','error');
      else importRows(inp.dataset.k, rows);
    } catch(err){ showToast('Could not read that file','error'); }
    inp.value = '';
  });
}

function clearDrop(key){
  const input=document.getElementById(key+'-search');
  if(input) input.value='';
  document.getElementById(key+'-sdw').classList.remove('has-val');
  ui[key].q=''; renderTable(key);
}
function filterDrop(key,query){
  ui[key].q=query;
  document.getElementById(key+'-sdw').classList.toggle('has-val', !!query.trim());
  renderTable(key);
}
function openPreview(scope){ const p=document.getElementById(scope+'-preview-panel'); if(p) p.classList.add('open'); }
function closePreview(scope){ const p=document.getElementById(scope+'-preview-panel'); if(p) p.classList.remove('open'); }

function showToast(msg,type){
  const t=document.getElementById('toast'), icon=document.getElementById('toast-icon'), label=document.getElementById('toast-msg');
  t.className='toast show'+(type?' '+type:'');
  icon.className='ti '+(type==='error'?'ti-alert-circle':type==='success'?'ti-circle-check':'ti-info-circle');
  label.textContent=msg;
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>{ t.classList.remove('show'); },2600);
}

/* ═══════════════════════════════════════════════════════
 *  EVENT DELEGATION
 * ═══════════════════════════════════════════════════════ */
function wireDelegation(){
  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-act]');
    closeMenus(el && el.dataset.act==='upmenu' ? el.dataset.k : null);
    closeSearch(e.target);
    if (!el) { if (armedDelete){ armedDelete=null; renderTable(activeTab); } return; }
    const { act, k, id, v } = el.dataset;
    const s = ui[k];

    if (act!=='del' && act!=='ss-del' && armedDelete){ const a=armedDelete; armedDelete=null; renderTable(a.k); }

    switch(act){
      case 'add':    k==='specsetting' ? openSpecForm() : k==='itemlist' ? openListModal() : openForm(k); break;
      case 'edit':   k==='specsetting' ? openSpecForm(id, el.dataset.t) : k==='itemlist' ? openListModal(id) : openForm(k, id); break;
      case 'sm-close':    closeSpecModal(); break;
      case 'sm-save':     saveSpec(false); break;
      case 'sm-save-new': saveSpec(true); break;
      case 'sm-type': {
        if (!sdraft || sdraft.id) break;
        if (v==='__new__'){ sdraft.isNew = !sdraft.isNew; if (sdraft.isNew) sdraft.t = ''; }
        else { sdraft.isNew = false; sdraft.t = v; }
        sdraft.errs = null;
        renderSpecModal();
        const f = specPanelEl().querySelector(sdraft.isNew ? '[data-sn]' : '[data-si]'); if (f) f.focus();
        break;
      }
      case 'sm-addname': if (sdraft){ sdraft.newNames.push(''); renderSpecModal(); const a = specPanelEl().querySelectorAll('[data-sn]'); a[a.length-1].focus(); } break;
      case 'sm-delname': if (sdraft && sdraft.newNames.length>1){ sdraft.newNames.splice(+el.dataset.i,1); sdraft.errs = null; renderSpecModal(); } break;
      case 'sm-addrow':  if (sdraft){ sdraft.rows.push({ name:'', description:'' }); renderSpecModal(); const a = specPanelEl().querySelectorAll('[data-si][data-sk="name"]'); a[a.length-1].focus(); } break;
      case 'sm-delrow':  if (sdraft && sdraft.rows.length>1){ sdraft.rows.splice(+el.dataset.i,1); sdraft.errs = null; renderSpecModal(); } break;
      case 'ss-deltype': {
        const t = el.dataset.t;
        if ((data[t]||[]).length) break;
        data.spectypes = (data.spectypes||[]).filter(x => x.key!==t); delete data[t];
        persist(); render(k); showToast('Specs removed','success'); break;
      }
      case 'row-add': {
        if (!draft) break;
        draft.rows.push({ specs:'', desc:'' }); renderListModal();
        const ins = document.querySelectorAll('#itemlist-preview-panel [data-rf="specs"]'); const last = ins[ins.length-1];
        if (last){ last.focus(); if (last.scrollIntoView) last.scrollIntoView({block:'nearest'}); }
        break;
      }
      case 'row-del': {
        if (!draft || draft.rows.length<2) break;
        draft.rows.splice(+el.dataset.i,1); lmErrs = new Set(); renderListModal(); break;
      }
      case 'chip': {
        if (!draft) break;
        const f = el.dataset.f;
        if (f.startsWith('x:')){ const key = f.slice(2); draft.extras = draft.extras || {}; if (draft.extras[key]===v) delete draft.extras[key]; else draft.extras[key] = v; }
        else { draft[f] = v; if (f==='medbranchId') draft.medbranchName = liveName('medbranch',v,''); if (f==='itemId') draft.itemName = liveName('item',v,''); if (f==='specsId') draft.specsName = liveName('specs',v,''); lmErrs.delete(f); }
        renderListModal(); break;
      }
      case 'ss-type':   s.type = (s.type===v ? '' : v); render(k); break;
      case 'ss-toggle': {
        const r = (data[el.dataset.t]||[]).find(x=>x.id===id); if(!r) break;
        r.status = r.status==='active' ? 'inactive' : 'active';
        persist(); render(k); syncSpecsSheet(); showToast('Specs setting set to '+r.status,'success'); break;
      }
      case 'ss-del': {
        const t = el.dataset.t;
        if (armedDelete && armedDelete.k==='specsetting' && armedDelete.id===id){
          armedDelete=null;
          data[t] = data[t].filter(x=>x.id!==id);
          if (s.editId===id) closeForm(k);
          persist(); render(k); syncSpecsSheet(); showToast('Specs setting deleted','success');
        } else {
          armedDelete = { k:'specsetting', id }; renderTable(k);
          clearTimeout(wireDelegation._t);
          wireDelegation._t = setTimeout(()=>{ if(armedDelete && armedDelete.id===id){ armedDelete=null; renderTable(k); } }, 2800);
        }
        break;
      }
      case 'add-list':       openListModal(null, el.dataset.mb); break;
      case 'csv':            exportCsv(); break;
      case 'mbfilter':       s.mb = (s.mb===v ? '' : v); render(k); break;
      case 'modal-close':    closeListModal(); break;
      case 'modal-save':     saveEntry(false); break;
      case 'modal-save-new': saveEntry(true); break;
      case 'cancel': closeForm(k); break;
      case 'save':   saveForm(k); break;
      case 'filter': s.filter = v; render(k); break;
      case 'sfilter': s.filter = (s.filter===v ? 'all' : v); render(k); break;
      case 'srch': {
        const h = document.getElementById(k+'-sdw'), open = !h.classList.contains('open');
        closeSearch(null);
        h.classList.toggle('open', open);
        if (open) setTimeout(() => { const i = document.getElementById(k+'-search'); if (i){ i.focus(); i.select(); } }, 0);
        break;
      }
      case 'srch-clear': clearDrop(k); document.getElementById(k+'-search').focus(); break;
      case 'upmenu':  document.getElementById(k+'-upmenu').classList.toggle('open'); break;
      case 'tpl':     downloadTemplate(k); break;
      case 'upload':  document.getElementById(k+'-file').click(); break;
      case 'sort':   s.sortAsc = (s.sortKey===v) ? !s.sortAsc : true; s.sortKey = v; renderTable(k); break;
      case 'toggle': {
        const r = data[k].find(x=>x.id===id); if(!r) break;
        r.status = r.status==='active' ? 'inactive' : 'active';
        persist(); render(k);
        showToast(MOD[k].label+' set to '+r.status,'success'); break;
      }
      case 'del': {
        if (armedDelete && armedDelete.k===k && armedDelete.id===id){
          armedDelete=null;
          data[k] = data[k].filter(x=>x.id!==id);
          if (s.editId===id || s.viewId===id) closeForm(k);
          persist(); render(k); showToast(MOD[k].label+' deleted','success');
        } else {
          armedDelete = { k, id }; renderTable(k);
          clearTimeout(wireDelegation._t);
          wireDelegation._t = setTimeout(()=>{ if(armedDelete && armedDelete.id===id){ armedDelete=null; renderTable(k); } }, 2800);
        }
        break;
      }
    }
  });

  // Enter submits the form (not inside textarea); Esc closes it
  document.addEventListener('keydown', e=>{
    const panel = e.target.closest && e.target.closest('.doc-preview-panel');
    if (!panel) return;
    const k = panel.id.replace('-preview-panel','');
    if (e.key==='Enter' && e.target.tagName==='INPUT'){ e.preventDefault(); saveForm(k); }
    if (e.key==='Escape') closeForm(k);
  });
}

/* ═══════════════════════════════════════════════════════
 *  INIT
 * ═══════════════════════════════════════════════════════ */
async function init(){
  load();
  assignSids();
  migrateLists();
  buildUI();
  wireDelegation();
  wireListEvents();
  wireSpecEvents();
  wireCombo();
  wireImport();
  renderAll();
  switchTab('itemlist');
}
document.addEventListener('DOMContentLoaded', init);
</script>
