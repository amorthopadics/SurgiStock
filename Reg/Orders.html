<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://amorthopadics.github.io/SurgiStock/shared/api.js?v=1"></script>
<script src="https://amorthopadics.github.io/SurgiStock/shared/cacheSync.js?v=1"></script>

<style>
:root,[data-theme="dark"]{color-scheme:dark;--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--surface:#21262d;--border:#30363d;--border2:#444c56;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent-dim:rgba(88,166,255,.12);--teal:#39d353;--teal-dim:rgba(57,211,83,.12);--amber:#e3b341;--red:#f85149;--red-dim:rgba(248,81,73,.12);--orange:#f0883e;--orange-dim:rgba(240,136,62,.12);--radius:8px;--radius-lg:12px;--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;}
[data-theme="light"]{color-scheme:light;--bg:#f0f2f5;--bg2:#fff;--bg3:#e8ecf0;--surface:#fff;--border:#c8d0d9;--border2:#9aa5b1;--text:#0d1117;--text2:#3d454f;--accent:#0550ae;--accent-dim:rgba(5,80,174,.12);--teal:#116329;--teal-dim:rgba(17,99,41,.13);--amber:#7d4e00;--red:#a8111b;--red-dim:rgba(168,17,27,.11);--orange:#953800;--orange-dim:rgba(149,56,0,.13);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.bar h1{font-size:15px;display:flex;align-items:center;gap:8px;margin-right:auto}
.tabs{display:flex;gap:4px}
.tab{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;font:inherit;font-size:13px}
.tab.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:13px}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.out{background:var(--orange-dim);color:var(--orange);border-color:var(--orange)}
.btn.in{background:var(--teal-dim);color:var(--teal);border-color:var(--teal)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.dng.armed{background:var(--red);color:#fff;border-color:var(--red)}
.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer}
.ib.ok{color:var(--teal)}.ib.err{color:var(--red)}.ib.warn{color:var(--amber)}
main{flex:1;min-height:0;overflow:auto;padding:12px 14px}
input,select,textarea{font:inherit;font-size:13px;padding:7px 9px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input:disabled{opacity:.6}
.tools{display:flex;gap:8px;margin-bottom:10px;align-items:center}.tools input{max-width:320px}
table{width:100%;border-collapse:collapse;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
th{background:var(--bg3);color:var(--text2);font-weight:600;font-size:12px}
td.n,th.n{text-align:right;font-family:var(--mono)}
td.acts{white-space:nowrap;width:1%}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600}
.badge.out{background:var(--orange-dim);color:var(--orange)}.badge.in{background:var(--teal-dim);color:var(--teal)}
.mono{font-family:var(--mono)}.dim{color:var(--text2)}.neg{color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--text2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
.ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:780px;max-height:92vh;display:flex;flex-direction:column}
.mh,.mf{padding:12px 16px;display:flex;align-items:center;gap:8px}
.mh{border-bottom:1px solid var(--border);font-weight:600}.mf{border-top:1px solid var(--border);justify-content:flex-end}
.mb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.span2{grid-column:1/-1}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.req{color:var(--red)}
/* Type chips (same idea as Rate Threshold) */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font:600 12px var(--font);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chips.bad,.cb.bad input{border-color:var(--red);box-shadow:0 0 0 3px var(--red-dim)}
.chips.bad{padding:6px;border:1px solid var(--red);border-radius:var(--radius-lg)}
/* searchable name drop-down */
.cb,.pick{position:relative}
.dd2,.dd{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:5;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);max-height:240px;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.di{padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.di:hover,.di.hi{background:var(--accent-dim)}.di.mute{color:var(--text2);cursor:default}
/* multi-select item picker */
.opt{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.opt:hover{background:var(--accent-dim)}
.opt input{width:auto;padding:0;pointer-events:none}
.ddf{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;background:var(--bg3);border-top:1px solid var(--border2)}
.lines td{padding:6px 8px}.lines input{padding:4px 7px}
.warn{color:var(--amber);font-size:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border2);padding:9px 16px;border-radius:var(--radius);z-index:99;display:none;font-size:13px}
.toast.error{border-color:var(--red);color:var(--red)}.toast.success{border-color:var(--teal)}
@media(max-width:600px){.g2{grid-template-columns:1fr}}

/* ═══ responsive order window ═══ */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#view{overflow-x:auto}#view table{min-width:680px}
.ib{flex:none;transition:.12s}.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib:disabled{opacity:.5;pointer-events:none}
.ib.lg{width:40px;height:40px;font-size:18px}
.ib.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.ib.pri:hover{color:#fff;filter:brightness(1.1)}
.ib.dng:hover{border-color:var(--red);color:var(--red)}
.ov{overflow:hidden}
.modal{max-width:860px;max-height:100%;min-height:0;overflow:hidden}
.mh,.mf{flex:none}
.mb{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.mh{flex-wrap:wrap;row-gap:8px}
.mh .ttl{display:flex;align-items:center;gap:8px;font-size:15px;min-width:0}
.mh .ttl i{font-size:18px;color:var(--accent)}
.mh .chips{flex:1 1 auto;min-width:0}
.mh .x{margin-left:auto}
.mb>*{flex-shrink:0}
.fg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr);gap:10px}
.fg label,.pick label{display:flex;align-items:center;gap:5px}
.fg label i,.pick label i{font-size:14px}
.sbox{position:relative}.sbox>i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text2);pointer-events:none;font-size:16px}
.sbox input{padding-left:34px;padding-top:9px;padding-bottom:9px}
.di.add{color:var(--teal);font-weight:600;display:flex;align-items:center;gap:6px}
.di.add i{font-size:15px}
.lines{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg2)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 84px 104px 34px;grid-template-areas:"it stk qty x";gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border)}
.ln:last-child{border-bottom:0}
.ln.hd{background:var(--bg3);color:var(--text2);font-size:12px;font-weight:600;padding:10px 12px}
.ln .it{min-width:0;grid-area:it}.ln .it b{display:block;font-weight:500;overflow-wrap:anywhere}
.ln .it small{color:var(--text2);font-size:11px}
.ln .stk{text-align:right;font-family:var(--mono);grid-area:stk}.ln .stk .sl{display:none;font-family:var(--font);color:var(--text2);font-size:11px;margin-right:6px}
.ln .qc{grid-area:qty}.ln .rm{grid-area:x}
.ln .qc input{font-family:var(--mono);padding:6px 9px}
.ln .qc input.bad{border-color:var(--amber);box-shadow:0 0 0 3px rgba(227,179,65,.15)}
.ln.none{display:block;text-align:center;color:var(--text2)}
.mf{gap:10px}.mf .sum{margin-right:auto;font-size:12px;color:var(--text2)}
.mf .warn{flex:1;min-width:0}
.dd,.dd2{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.dd.up,.dd2.up{top:auto;bottom:calc(100% + 3px)}
/* ═══ item picker = full-height panel under the search row (no floating drop-down) ═══ */
.modal{height:100%}
.sbox.fs{display:flex;align-items:center;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg3)}
.sbox.fs:focus-within{border-color:var(--accent)}
.sbox.fs select,.sbox.fs input{border:0!important;background:transparent!important;box-shadow:none!important;outline:0;margin:0}
.sbox.fs select{flex:0 1 auto;width:auto;min-width:0;max-width:24%;padding:9px 18px 9px 6px;font-size:12px;color:var(--text2);border-right:1px solid var(--border2)!important;border-radius:0!important;cursor:pointer;text-overflow:ellipsis}
.sbox.fs select:first-of-type{margin-left:32px}
.sbox.fs select.on{color:var(--accent);font-weight:600}
.panel.lock{pointer-events:none}
@media(max-width:700px){
  .sbox.fs{flex-wrap:wrap}.sbox.fs>i{display:none}
  .sbox.fs select,.sbox.fs select:first-of-type{flex:1 1 30%;max-width:none;margin-left:0;border-bottom:1px solid var(--border2)!important}
  .sbox.fs input{flex:1 1 100%}
}
.sbox.fs input{flex:1 1 auto;min-width:0;padding-left:10px}
.pw{position:relative;flex:none;display:inline-flex}
.pw .cnt{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--orange,#f0883e);color:#fff;font:700 10px/16px var(--font);text-align:center;pointer-events:none}
.mf .ib.lg{width:32px;height:32px;font-size:15px}
.ptabs{flex:none;display:flex;gap:4px;padding:6px 8px;background:var(--bg3);border-bottom:1px solid var(--border)}
.ptab{padding:4px 12px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--text2);font:600 12px var(--font);cursor:pointer}
.ptab.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.panel{flex:1 1 auto!important;min-height:220px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg2);overflow:hidden}
.panel .dd,.panel .lines{flex:1 1 auto;min-height:0;overflow-y:auto;border:0;border-radius:0;box-shadow:none;background:transparent;position:static;max-height:none}
.panel .dd{display:none}
.panel.pick .dd{display:block}.panel.pick .lines{display:none}
.panel .lines{display:block}
.panel .opt{padding:10px 14px}
.panel .ln.none{padding:30px 12px}
@media(max-width:760px){
  .fg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fg .w2{grid-column:1/-1}
}
@media(max-width:700px){
  .bar .btn .lbl{display:none}.bar .btn{width:36px;height:36px;padding:0;justify-content:center;font-size:16px}
  .bar h1{width:100%}.tools input{max-width:none}
}
@media(max-width:560px){
  .ov{padding:0;align-items:stretch}
  .modal{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;border:0}
  .mh,.mf{padding:10px 12px}.mb{padding:12px}
  .mh .chips{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .mh .chip{white-space:nowrap}
  .ln.hd{display:none}
  .ln{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"it x" "stk qty";row-gap:8px}
  .ln .stk{text-align:left;align-self:center}.ln .stk .sl{display:inline}
  .ln .qc{justify-self:end;width:112px}
}
</style>
</head>
<body>
<div class="bar">
  <h1><i class="ti ti-truck-delivery"></i>Orders</h1>
  <div class="tabs" id="tabs"></div>
  <button class="btn out" title="New Order (Outgoing)" aria-label="New Order (Outgoing)" onclick="openForm('out')"><i class="ti ti-arrow-up-right"></i><span class="lbl">New Order (Outgoing)</span></button>
  <button class="btn in" title="Add Items (Incoming)" aria-label="Add Items (Incoming)" onclick="openForm('in')"><i class="ti ti-arrow-down-left"></i><span class="lbl">Add Items (Incoming)</span></button>
  <button class="ib cache-ind warn" id="cache-ind" type="button" title="Cache: waiting…"><i class="ti ti-database"></i></button>
</div>
<main>
  <div class="tools"><input id="q" placeholder="Search order no, store, party, item…" oninput="render()"/><span class="dim" id="ldg" style="font-size:12px"></span></div>
  <div id="view"></div>
</main>

<div class="ov" id="ov">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="mh">
      <div class="ttl"><i class="ti" id="m-ico"></i><span id="m-title"></span></div>
      <!-- OUTGOING only: Type chips (from the cache) -->
      <div class="chips" id="f-types"></div>
      <button type="button" class="ib x" title="Close" aria-label="Close" onclick="closeForm()"><i class="ti ti-x"></i></button>
    </div>
    <div class="mb">
      <div class="fg">
        <div><label><i class="ti ti-building-store"></i>Store <span class="req">*</span></label><select id="f-store"></select></div>
        <div><label><i class="ti ti-calendar"></i>Date <span class="req">*</span></label><input type="date" id="f-date"/></div>
        <!-- OUTGOING: Name (by Type) · INCOMING: Supplier (from Specs Settings, can add new) -->
        <div class="w2"><label id="f-plbl"></label><div class="cb" id="f-pcb"></div></div>
        <div class="w2"><label><i class="ti ti-notes"></i>Reference / Note</label><input id="f-note" autocomplete="off"/></div>
      </div>

      <div class="pick">
        <label><i class="ti ti-packages"></i>Add items (from Item List) — tick as many as you need <span class="req">*</span></label>
        <div class="sbox fs"><i class="ti ti-search"></i>
          <select id="f-dom" title="Medical Domain" aria-label="Medical Domain" onchange="showDD()"></select><select id="f-itm" title="Item Name" aria-label="Item Name" onchange="showDD()"></select><select id="f-src" title="Material Source" aria-label="Material Source" onchange="showDD()"></select>
          <input id="f-search" placeholder="Type to search items…" autocomplete="off" oninput="showDD()" onfocus="pullLatest();showDD()"/></div>
      </div>
      <div class="panel pick" id="panel">
        <div class="ptabs"><button type="button" class="ptab on" id="t-pick" onclick="showDD()">Items</button><button type="button" class="ptab" id="t-lines" onclick="setMode('lines')">Order (0)</button></div>
        <div class="dd" id="dd"></div>
        <div class="lines" id="lines"></div>
      </div>
    </div>
    <div class="mf">
      <span class="sum" id="m-sum"></span><span class="warn" id="m-warn"></span>
      <button type="button" class="ib lg" title="Cancel" aria-label="Cancel" onclick="closeForm()"><i class="ti ti-x"></i></button>
      <span class="pw"><button type="button" class="ib lg pri" id="m-save" title="Save" aria-label="Save" onclick="okClick()"><i class="ti ti-check"></i></button><span class="cnt" id="p-cnt" style="display:none"></span></span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* cache button: shared/cacheSync.js · endpoint/session/post → shared/api.js
   Orders are saved in the Google Sheet "Orders" (doPost: addOrder / updateOrder / deleteOrder,
   doGet: type=orders). Parties, items and stores come from the Master cache (IDB). */

const $=id=>document.getElementById(id);
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const OK='orders_sheet_cache_v2';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase();
const words=q=>String(q||'').toLowerCase().split(/[\s\-\u2013\u2014\/,;|]+/).filter(Boolean);
const match=(q,h)=>{h=String(h).toLowerCase();return words(q).every(w=>h.includes(w));};
const p2=n=>String(n).padStart(2,'0');
const tsId=t=>{const d=new Date(t);return''+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+String(d.getMilliseconds()).padStart(3,'0')};
function showToast(m,t){const e=$('toast');e.textContent=m;e.className='toast '+(t||'');e.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.style.display='none',3200);}

const session=AP2Api.session,post=AP2Api.post,errText=m=>AP2Api.errText(m);

/* ═══ STATE ═══ */
let items=[],domains=[],inames=[],msources=[],stores=[],parties=[],types=[],suppliers=[],supplierKind='Supplier',pendingSup=[];     // from the cache
let orders=rd(OK,[]),ordersLoaded=false;          // from the sheet
let tab='all',formType='out',draft=null,pcomb=null,picked=new Set(),busy=false,lastPType='';

/* ═══ CACHE → items / stores / customer-type parties ═══
   cache row = [ID, Specs, Item, Description, Status]
   Item List : [id,"Item List",<Medical Domain>,<item label>,Active]
   Store     : [id,"Store",<name>,…,Active]
   Party     : [id,<Type e.g. Hospital|Doctor|Department>,<Name>,"Customer",Active]   ← same rule as Rate Threshold */
const ELIGIBLE='customer';
const ICONS={customer:'ti-user',vendor:'ti-truck-delivery',hospital:'ti-building-hospital',doctor:'ti-stethoscope',department:'ti-building'};
const typeIcon=k=>ICONS[k]||'ti-tag';
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const IGN=/^(item\s*names?|item\s*lists?|item\s*categor(y|ies)|stores?(\s*branch)?|medical\s*domains?|material\s*sources?|specs)$/i;
function applyRows(rows){
  const it=[],st=[],pa=[],su=[],dm=[],nm=[],ms=[],T=new Map();
  rows.forEach(r=>{
    if(!Array.isArray(r)||String(r[0]).toLowerCase()==='id')return;
    const id=String(r[0]).trim(),kind=String(r[1]??'').trim(),a=String(r[2]??'').trim(),b=String(r[3]??'').trim();
    if(!id||!kind||!a)return;
    const strict=/^active$/i.test(String(r[4]??'').trim());
    const lenient=!/^(inactive|in-active|no|0|false|disabled)$/i.test(String(r[4]??'').trim());
    if(/^item\s*lists?$/i.test(kind)){if(strict&&b)it.push({id,domain:a,label:b});return;}
    /* Specs Settings lists used by the item filters: Medical Domain · Item Name · Material Source (Item column = the value) */
    if(/^medical\s*domains?$/i.test(kind)){if(lenient&&!dm.some(x=>norm(x)===norm(a)))dm.push(a);return;}
    if(/^item\s*names?$/i.test(kind)){if(lenient&&!nm.some(x=>norm(x)===norm(a)))nm.push(a);return;}
    if(/^material\s*sources?$/i.test(kind)){if(lenient&&!ms.some(x=>norm(x)===norm(a)))ms.push(a);return;}
    if(/^stores?(\s*branch)?$/i.test(kind)){if(strict)st.push({id,name:a});return;}
    /* Specs Settings → Specs = "Supplier": Item column = supplier name (used by Incoming orders) */
    if(/^suppliers?$/i.test(kind)){supplierKind=kind;if(lenient&&!su.some(x=>norm(x.name)===norm(a)))su.push({sid:id,name:a});return;}
    if(IGN.test(kind)||norm(b)!==ELIGIBLE||!lenient)return;
    const k=norm(kind),t=T.get(k);
    if(!t)T.set(k,{k,l:cap(kind)});else if(/^[a-z]/.test(t.l)&&/^[A-Z]/.test(kind))t.l=kind;
    pa.push({sid:id,name:a,type:k});
  });
  items=it;domains=dm;inames=nm;msources=ms;stores=st;parties=pa;pendingSup=pendingSup.filter(p=>!su.some(x=>norm(x.name)===norm(p.name)));su.push(...pendingSup);   /* a supplier just added here stays listed until the cache shows it */
  suppliers=su.sort((x,y)=>x.name.localeCompare(y.name));types=[...T.values()].sort((a,b)=>a.l.localeCompare(b.l));
}
const cache=AP2Cache.create({
  indicator:'cache-ind',
  toast:(m,t)=>showToast(m,t),
  title:()=>'Cache loaded · '+items.length+' items · '+stores.length+' stores · '+parties.length+' names · '+suppliers.length+' suppliers',
  onRows:rows=>{
    const sig=()=>[items.length,domains.length,inames.length,msources.length,stores.length,parties.length,suppliers.length,types.length].join();
    const before=sig();applyRows(rows);render();
    if(draft)refreshOpenForm(before!==sig());      // form is open → drop-downs show the new entries right away
    return items.length;}
});

/* ═══ ORDERS ← sheet ═══
   sheet row = [ID, Order No, Type, Date, Store ID, Store, Party Type, Party ID, Party, Note, Item ID, Item, Domain, Qty, Updated, Updated By] */
function groupRows(rows){
  const m=new Map();
  rows.forEach(a=>{
    if(!Array.isArray(a)||!String(a[0])||String(a[0])==='ID')return;
    const id=String(a[0]);let o=m.get(id);
    if(!o){o={id,no:String(a[1]||''),type:String(a[2]||''),date:String(a[3]||''),storeId:String(a[4]||''),storeName:String(a[5]||''),
      partyType:String(a[6]||''),partyId:String(a[7]||''),party:String(a[8]||''),note:String(a[9]||''),lines:[],ts:String(a[14]||''),by:String(a[15]||'')};m.set(id,o);}
    o.lines.push({itemId:String(a[10]||''),label:String(a[11]||''),domain:String(a[12]||''),qty:Math.floor(+a[13])||0});
  });
  return [...m.values()].sort((a,b)=>b.id.localeCompare(a.id));
}
async function loadOrders(){
  const s=session();if(!s.sessionId&&!s.token)return false;
  try{const j=await AP2Api.get('orders');orders=groupRows(j.Orders||[]);ordersLoaded=true;wr(OK,orders);$('ldg').textContent='';render();return true;}
  catch(e){if(!loadOrders._w){loadOrders._w=1;showToast('Could not load orders: '+errText(e.message),'error');}return false;}

/* ═══ ask the portal for the newest cache data (new Items / Suppliers / Names / Stores added in Master).
   Silent + throttled; when the cache changes, onRows → refreshOpenForm updates whatever is open. ═══ */
let lastPull=0;
function pullLatest(force){
  const n=Date.now();if(!force&&n-lastPull<8000)return;lastPull=n;

}

/* keep a drop-down inside the visible part of the window: height = free space (scrolls inside),
   and it opens upwards when there is clearly more room above than below */
function placeDD(dd,anchor){
  const mb=document.querySelector('.modal .mb');if(!mb||!anchor)return;
  const a=anchor.getBoundingClientRect(),m=mb.getBoundingClientRect();
  const bottom=Math.min(m.bottom,window.innerHeight)-8,top=Math.max(m.top,0)+8;
  const below=bottom-a.bottom-4,above=a.top-top-4;
  const up=below<150&&above>below;
  dd.classList.toggle('up',up);
  dd.style.maxHeight=Math.max(up?90:120,Math.min(320,up?above:below))+'px';
}
/* bring the search box near the top of the window when little room is left under it */
function revealSearch(){
  const mb=document.querySelector('.modal .mb'),b=document.querySelector('#ov .sbox');if(!mb||!b)return;
  const m=mb.getBoundingClientRect(),r=b.getBoundingClientRect();
  if(m.bottom-r.bottom<220)mb.scrollTop+=r.top-m.top-8;

/* ═══ searchable drop-down (same behaviour as Rate Threshold) ═══
   o.add(text) → optional: when the typed text is not in the list, an "Add … as new" row appears (returns the new item or null) */
function combo(host,o){
  host.innerHTML='<input autocomplete="off" placeholder="'+esc(o.ph)+'"/><div class="dd2"></div>';
  const inp=host.firstChild,dd=host.lastChild;let cur=[],hi=-1,sel=null,wait=false;
  const close=()=>{dd.style.display='none';hi=-1};
  function draw(q){const tk=words(q),all=o.list(),t=String(q||'').trim().replace(/\s+/g,' ');
    cur=all.filter(x=>tk.every(w=>x.text.toLowerCase().includes(w))).slice(0,80);
    if(o.add&&t&&!all.some(x=>norm(x.text)===norm(t)))cur.push({add:true,text:t});
    dd.innerHTML=cur.length?cur.map((x,i)=>x.add?`<div class="di add${i===hi?' hi':''}" data-i="${i}"><i class="ti ti-plus"></i><span>Add “${esc(x.text)}” as new ${esc(o.addLabel||'entry')}</span></div>`
      :`<div class="di${i===hi?' hi':''}" data-i="${i}">${esc(x.text)}</div>`).join(''):`<div class="di mute">${esc(o.empty||'No matching names for this Type')}</div>`;
    dd.style.display='block';placeDD(dd,host);}
  function set(it){sel=it;inp.value=it?it.text:'';close();o.onPick(it);}
  async function choose(x){
    if(!x)return;
    if(!x.add)return set(x);
    if(wait)return;wait=true;inp.disabled=true;
    try{const r=await o.add(x.text);if(r)set(r);}finally{wait=false;inp.disabled=false;inp.focus();}
  }
  inp.onfocus=()=>{inp.select();if(o.onOpen)o.onOpen();draw('');};
  inp.oninput=()=>{if(sel&&inp.value!==sel.text){sel=null;o.onPick(null);}hi=-1;draw(inp.value);};
  inp.onblur=()=>setTimeout(()=>{if(wait)return;close();inp.value=sel?sel.text:'';},150);
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(dd.style.display!=='block')draw(sel?'':inp.value);hi=Math.max(0,Math.min(cur.length-1,hi+(e.key==='ArrowDown'?1:-1)));draw(sel?'':inp.value);const h=dd.querySelector('.hi');h&&h.scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();choose(cur[hi>=0?hi:0]);}
    else if(e.key==='Escape'&&dd.style.display==='block'){e.stopPropagation();close();}};
  dd.addEventListener('touchstart',()=>lockPanel(),{passive:true});
  dd.onmousedown=e=>{lockPanel();e.preventDefault();const d=e.target.closest('.di');if(d&&d.dataset.i!=null)choose(cur[+d.dataset.i]);};
  return{set,get:()=>sel,focus:()=>inp.focus(),input:inp,redraw:()=>{if(dd.style.display==='block')draw(sel?'':inp.value);}};
}

/* New supplier → written to Specs Settings (same row format Master uses: ID | Specs | Item | Description | Status) */
async function addSupplier(name){
  name=String(name||'').trim().replace(/\s+/g,' ');if(!name)return null;
  const ex=suppliers.find(x=>norm(x.name)===norm(name));if(ex)return{text:ex.name,sid:ex.sid};
  const id=tsId(Date.now());
  try{
    const j=await post('addSpecsSetting',{rows:[{id,specs:supplierKind,item:name,description:'',status:'Active'}]});
    const a=(j&&j.added&&j.added[0])||{},sid=String(a.id||id);
    suppliers.push({sid,name});suppliers.sort((x,y)=>x.name.localeCompare(y.name));pendingSup.push({sid,name});
    try{if(cache.requestRefresh)cache.requestRefresh(true);}catch(e){}
    showToast('Supplier added: '+name,'success');
    return{text:name,sid};
  }catch(e){showToast('Supplier not added: '+errText(e.message),'error');return null;}
}

/* filter drop-downs: Medical Domain · Item Name · Material Source — values come from the cache lists of the same name

/* an Item Name / Material Source value is found inside the item label as a whole word(s), e.g. "Plate" in "Gujrat - Plate - 400mmx20mm" */
const rxFor=v=>v?new RegExp('(?<![\\p{L}\\p{N}])'+v.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'(?![\\p{L}\\p{N}])','iu'):null;

  const w=$('m-warn');w.textContent='';
  if(!draft){$('m-sum').textContent='';return;}
  $('m-sum').textContent=draft.lines.length?draft.lines.length+' item'+(draft.lines.length>1?'s':'')+' · '+draft.lines.reduce((a,l)=>a+(l.qty||0),0)+' qty':'';
  $('lines').querySelectorAll('input[data-n]').forEach(i=>i.classList.remove('bad'));
  if(formType!=='out')return;
  const sm=stockMap(draft.id),store=$('f-store').value;
  const bad=draft.lines.filter(l=>l.qty>(sm[stockKey(store,l.itemId)]||0));
  draft.lines.forEach((l,n)=>{if(bad.includes(l)){const i=$('lines').querySelector('input[data-n="'+n+'"]');i&&i.classList.add('bad');}});
  if(bad.length){w.textContent='⚠ Quantity exceeds stock for '+bad.length+' item'+(bad.length>1?'s':'')+' — you can still save.';w.title=bad.map(l=>l.label).join(', ');}
}

/* ═══ SAVE / DELETE → Google Sheet ═══ */
async function saveOrder(){
  if(busy||!draft)return;
  const d=draft,out=formType==='out',storeId=$('f-store').value,date=$('f-date').value;
  if(!storeId||!date)return showToast('Store and date are required','error');
  if(out&&!d.ptype){$('f-types').classList.add('bad');return showToast('Choose a Type','error');}
  if(!d.party){$('f-pcb').classList.add('bad');return showToast(out?'Choose a name':'Choose or add a supplier','error');}
  if(!d.lines.length)return showToast('Add at least one item','error');
  if(d.lines.some(l=>!(l.qty>0)))return showToast('Every quantity must be 1 or more','error');
  const st=stores.find(s=>s.id===storeId);
  const tl=out?(types.find(t=>t.k===d.ptype)||{l:d.ptypeLabel||d.ptype}).l:'';
  const order={
    id:d.id||tsId(Date.now()),type:formType,date,storeId,storeName:st?st.name:(d.storeName||storeId),
    partyType:out?tl:supplierKind,partyId:d.party.sid||'',party:d.party.text,
    note:$('f-note').value.trim(),lines:d.lines.map(l=>({itemId:l.itemId,label:l.label,domain:l.domain,qty:l.qty}))};
  busy=true;$('m-save').disabled=true;
  try{
    const j=await post(d.id?'updateOrder':'addOrder',{order});
    const no=(j&&j.order&&j.order.no)||d.no;
    await loadOrders();
    closeForm();render();
    showToast((d.id?'Order updated: ':'Order saved: ')+no,'success');
  }catch(e){showToast('Not saved: '+errText(e.message),'error');}
  busy=false;$('m-save').disabled=false;
}
let armed=null;
async function delOrder(id){
  if(armed!==id){armed=id;const b=$('del-'+id);if(b){b.classList.add('armed');b.title='Click again to confirm delete';}
    clearTimeout(delOrder.t);delOrder.t=setTimeout(()=>{armed=null;render();},2800);return;}
  armed=null;
  try{await post('deleteOrder',{ids:[id]});await loadOrders();showToast('Order deleted — stock recalculated','success');}
  catch(e){showToast('Not deleted: '+errText(e.message),'error');render();}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('ov').classList.contains('open'))closeForm();});

render();cache.start();
loadOrders();setInterval(loadOrders,30000);
</script>
