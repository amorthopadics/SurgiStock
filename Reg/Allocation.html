<main><div class="tools"><input id="party" list="dl" placeholder="Party name (customer / supplier)…" oninput="setParty(this.value)"/><datalist id="dl"></datalist>
<span class="seg"><button class="tab on" id="m-auto" onclick="setMode('auto')">Automatic (FIFO)</button><button class="tab" id="m-man" onclick="setMode('man')">Manual</button></span><button class="btn" onclick="syncBills()" title="Create charges for bills that have none yet"><i class="ti ti-refresh"></i>Sync bills</button></div>

<div class="tools" style="margin-top:10px"><span class="mono" id="ctr"></span><input id="cm" placeholder="Comments (optional)" style="max-width:260px;margin-left:auto"/><button class="btn pri" id="sv" onclick="save()"><i class="ti ti-device-floppy"></i>Save allocation</button></div></div></div>
<h3 style="margin:16px 0 8px;font-size:14px">Allocation history for this party</h3><div class="tw" id="hist"></div></main>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ═══ LEDGER STORE — local-cache mode (no backend). Same data shape as the Apps Script backend,
   so going live later = set USE_BACKEND=true (and re-enable the shared scripts in <head>). ═══ */
const USE_BACKEND=true;   // true: ledger + bills are read from the ap2_ledger / ap2_bills caches, ledger writes go to the API · false: old local-only mode (localStorage)
const Ledger=USE_BACKEND?{get:()=>freshLedger(),post:(a,p)=>AP2Api.post(a,p).then(r=>r||{})}:(()=>{
 const KEY='acc_ledger_v1',H={
  Charges:['ChargeID','Type','BillID','BillNo','OrderID','OrderNo','PartyType','Party','Dir','Date','Description','Amount','Comments','Created'],
  Receipts:['PaymentID','ReceiptNo','Dir','PartyType','Party','Date','Mode','Ref','Amount','Comments','Type','Created'],
  Allocations:['AllocID','PaymentID','ReceiptNo','BillID','BillNo','ChargeID','OrderID','OrderNo','PartyType','Party','Date','Amount','Comments','Reverses','Created']};
 const rd=()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.Charges&&j.Receipts&&j.Allocations)return j;}catch(e){}return{Charges:[H.Charges],Receipts:[H.Receipts],Allocations:[H.Allocations]};};
 const wr=j=>{try{localStorage.setItem(KEY,JSON.stringify(j));}catch(e){throw new Error('Browser storage is full or blocked — export a backup and clear space');}};
 const R=n=>Math.round((+n||0)*100)/100,now=()=>new Date().toISOString(),uid=(p,i)=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+(i||0);
 const sm=(a,f)=>R(a.reduce((s,x)=>s+f(x),0));
 return{
  async get(){return rd();},
  async post(action,p){const j=rd();
   if(action==='addCharges'){
    const rows=(p.rows||[]).map((c,i)=>{if(!c.party)throw new Error('Party missing');return[uid('C',i),c.type||'Order',c.billId||'',c.billNo||'',c.orderId||'',c.orderNo||'',c.ptype||'',c.party,c.dir||'out',c.date,c.desc||'',R(c.amount),c.comments||'',now()];});
    j.Charges.push(...rows);wr(j);return{count:rows.length};}
   if(action==='addReceipt'){const r=p.receipt;if(!r.party||!(+r.amount>0))throw new Error('Party and amount required');
    const no=(r.dir==='in'?'P-':'R-')+String(j.Receipts.length).padStart(4,'0');
    j.Receipts.push([r.id||uid('P'),no,r.dir||'out',r.ptype||'',r.party,r.date,r.mode||'',r.ref||'',R(r.amount),r.comments||'',r.type||'Receipt',now()]);wr(j);return{receipt:{id:r.id,no}};}
   if(action==='addAllocations'){
    const rec=j.Receipts.slice(1).find(x=>x[0]==p.paymentId);if(!rec)throw new Error('Receipt not found');
    const al=j.Allocations.slice(1);let rem=R(rec[8]-sm(al.filter(a=>a[1]==rec[0]),a=>+a[11]));const out=[];
    (p.rows||[]).forEach((x,i)=>{const ch=j.Charges.slice(1).find(c=>c[0]==x.chargeId);if(!ch)throw new Error('Charge not found');
     if(ch[7]!=rec[4])throw new Error('Charge belongs to another party');
     const amt=R(x.amount),due=R(ch[11]-sm(al.filter(a=>a[5]==ch[0]),a=>+a[11])-sm(out.filter(o=>o[5]==ch[0]),o=>o[11]));
     if(amt>0){if(amt>rem+.005)throw new Error('More than receipt balance');if(amt>due+.005)throw new Error('More than due on '+(ch[5]||ch[10]));}
     rem=R(rem-amt);out.push([uid('A',i),rec[0],rec[1],ch[2],ch[3],ch[0],ch[4],ch[5],ch[6],ch[7],p.date,amt,x.comments||'',x.reverses||'',now()]);});
    j.Allocations.push(...out);wr(j);return{count:out.length};}
   if(action==='reverseBill'){const al=j.Allocations.slice(1),ch=j.Charges.slice(1),done=new Set(ch.filter(c=>c[1]==='Reversal').map(c=>String(c[12]).replace('rev:','')));
    const t=ch.filter(c=>c[2]==p.billId&&c[1]!=='Reversal'&&!done.has(String(c[0])));
    t.forEach(c=>{if(Math.abs(sm(al.filter(a=>a[5]==c[0]),a=>+a[11]))>.005)throw new Error('This bill has allocated payments — reverse them in Allocation first');});
    const rows=t.map((c,i)=>[uid('C',i),'Reversal',c[2],c[3],c[4],c[5],c[6],c[7],c[8],now().slice(0,10),'Reversal: '+(c[10]||''),R(-c[11]),'rev:'+c[0],now()]);
    j.Charges.push(...rows);wr(j);return{count:rows.length};}
   throw new Error('Unknown action');},
  backup(){return JSON.stringify(rd());},
  restore(t){const j=JSON.parse(t);if(!(j&&j.Charges&&j.Receipts&&j.Allocations))throw new Error('Not a ledger backup');wr(j);}
 };})();
const CUR='AED',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),r2=n=>Math.round((+n||0)*100)/100;
const today=()=>new Date().toISOString().slice(0,10),post=(a,p)=>Ledger.post(a,p),errText=m=>String(m);
function showToast(m,t){const e=$('toast');e.textContent=m;e.className='toast '+(t||'');e.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.style.display='none',t==='error'?9000:3000);}
let L={Charges:[],Receipts:[],Allocations:[]};
const rw=(a,h)=>(a||[]).filter(r=>Array.isArray(r)&&r[0]!==''&&String(r[0])!==h);
function data(){
 const al=rw(L.Allocations,'AllocID').map(a=>({id:String(a[0]),pid:String(a[1]),rno:a[2],billNo:a[4],cid:String(a[5]),orderNo:a[7],party:a[9],date:String(a[10]),amt:+a[11]||0,note:a[12],rev:String(a[13]||'')}));
 const rvC={};rw(L.Charges,'ChargeID').forEach(c=>{if(c[1]==='Reversal')rvC[String(c[12]).replace('rev:','')]=+c[11]||0;});const bC={},bP={};al.forEach(a=>{bC[a.cid]=r2((bC[a.cid]||0)+a.amt);bP[a.pid]=r2((bP[a.pid]||0)+a.amt);});
 const ch=rw(L.Charges,'ChargeID').map(c=>({id:String(c[0]),type:c[1],billId:String(c[2]||''),billNo:String(c[3]||''),orderNo:String(c[5]||''),ptype:c[6],party:String(c[7]).trim(),dir:c[8],date:String(c[9]),desc:c[10],amt:+c[11]||0,note:c[12]})).map(c=>({...c,paid:bC[c.id]||0,due:r2(c.amt-(bC[c.id]||0)+(rvC[c.id]||0))}));
 const rc=rw(L.Receipts,'PaymentID').map(r=>({id:String(r[0]),no:r[1],dir:r[2],party:String(r[4]).trim(),date:String(r[5]),mode:r[6],ref:r[7],amt:+r[8]||0,note:r[9],type:r[10]})).map(r=>({...r,alloc:bP[r.id]||0,un:r2(r.amt-(bP[r.id]||0))}));
 return{al,ch,rc};}
const fifo=(a,b)=>a.date.localeCompare(b.date)||((b.type==='Opening')-(a.type==='Opening'))||a.billNo.localeCompare(b.billNo)||a.id.localeCompare(b.id);
let BL={Bills:[],Payments:[]};
/* ═══ CACHE SOURCES — "ap2_ledger" + "ap2_bills" (same three-path loader as userPortal.html / Bills.html)
   1. parent push   : ap-cache-request → index.html answers ap-cache-ready / ap-cache-preload (same-origin only)
   2. IndexedDB read: AP2CacheWatcher.readKey(key), 6 retries (300 · 500 · 800 · 1200 · 2000 · 3000 ms)
   3. live updates  : AP2CacheWatcher.subscribe → re-read on any change (+15 s poll, + on tab focus)
   Newest record wins (ts). All empty → AdminPro.get(key). Still nothing → error panel + Retry (never an endless skeleton).
   Both datasets are needed to build the open-items list, so the page paints once BOTH have arrived.
   ⚠ dataLayer.js: add 'ap2_ledger' and 'ap2_bills' to ALLOW_EMPTY_OBJECT_DATASETS (a fresh system has no rows). */
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),DELAYS=[300,500,800,1200,2000,3000];
const isObj=d=>!!d&&typeof d==='object';
const SRC={
 ledger:{key:'ap2_ledger',label:'Ledger',shape:d=>isObj(d)&&Array.isArray(d.Charges)&&Array.isArray(d.Receipts)&&Array.isArray(d.Allocations),
  set:d=>{L={Charges:d.Charges,Receipts:d.Receipts,Allocations:d.Allocations};}},
 bills:{key:'ap2_bills',label:'Bills',shape:d=>isObj(d)&&Array.isArray(d.Bills)&&(d.Payments===undefined||Array.isArray(d.Payments)),
  set:d=>{BL={Bills:d.Bills,Payments:d.Payments||[]};}}};
const SV=Object.values(SRC);SV.forEach(s=>Object.assign(s,{ts:0,fp:'',painted:false,err:''}));
const S={state:'loading',err:'',booting:false};
const ready=()=>SV.every(s=>s.painted);
function unpackS(s,r){if(!isObj(r))return null;if(s.shape(r))return{data:r,ts:0};if(s.shape(r.data))return{data:r.data,ts:+r.ts||0};return null;}
function applySrc(s,r,from,force){
 const u=unpackS(s,r);if(!u)return false;
 if(!force&&s.painted&&u.ts&&u.ts<=s.ts)return true;           // not newer than what is on screen
 s.ts=force?Date.now():(u.ts||Math.max(s.ts,Date.now()));
 const fp=JSON.stringify(u.data);
 if(!force&&s.painted&&fp===s.fp)return true;                   // identical → no re-render
 s.fp=fp;s.set(u.data);s.painted=true;s.err='';
 if(ready()){S.state='ready';S.err='';after();}else render();
 return true;}
async function readIDB(s){try{if(window.AP2CacheWatcher&&typeof AP2CacheWatcher.readKey==='function')return await AP2CacheWatcher.readKey(s.key);}catch(e){}return null;}
async function applyFromIDB(s){const r=await readIDB(s);return r?applySrc(s,r,'idb'):false;}
async function fetchLive(s){
 try{if(!(window.AdminPro&&typeof AdminPro.get==='function'))throw new Error('AdminPro is not available');
  const r=await AdminPro.get(s.key);if(!applySrc(s,r,'live')&&!s.painted)throw new Error('unexpected data from server');}
 catch(e){s.err=String((e&&e.message)||e);}}
async function freshLedger(){                                   // after a write: force-pull the ledger (updates IndexedDB too), fall back to the endpoint
 const s=SRC.ledger;let r=null;
 try{if(window.AdminPro){const fn=typeof AdminPro.refresh==='function'?AdminPro.refresh:AdminPro.get;r=await fn.call(AdminPro,s.key,{force:true});}}catch(e){}
 if(!unpackS(s,r))r=await AP2Api.get('ledger');
 if(!applySrc(s,r,'live',true))throw new Error('Ledger returned unexpected data');
 return L;}
function askParent(){if(window.parent===window)return;try{window.parent.postMessage({type:'ap-cache-request',keys:SV.map(s=>s.key)},location.origin);}catch(e){}}
function pickPayload(m,s){
 for(const bag of [m,m.data,m.datasets,m.payload,m.caches])if(isObj(bag)&&bag[s.key]!==undefined&&unpackS(s,bag[s.key]))return bag[s.key];
 if(m.key===s.key||m.name===s.key||m.dataset===s.key){const v=m.data!==undefined?m.data:m.value;if(unpackS(s,v))return v;}
 return null;}
function onCacheMessage(e){                                     // same-origin parent only
 if(e.origin!==location.origin||(e.source!==window.parent&&e.source!==window))return;
 const m=e.data;if(!isObj(m))return;const t=String(m.type||m.msg||'');if(!/^ap-cache/.test(t))return;
 SV.forEach(s=>{let got=false;if(/^ap-cache-(ready|preload)$/.test(t)){const d=pickPayload(m,s);if(d)got=applySrc(s,d,'parent');}
  if(!got)setTimeout(()=>applyFromIDB(s),250);});}
function watchSrc(){
 const W=window.AP2CacheWatcher;if(!W||typeof W.subscribe!=='function')return;
 const cb=k=>{const key=(k&&k.key)||k;const hit=typeof key==='string'?SV.filter(s=>s.key===key):SV;hit.forEach(applyFromIDB);};
 try{W.subscribe(cb);}catch(e){SV.forEach(s=>{try{W.subscribe(s.key,()=>applyFromIDB(s));}catch(x){}});}}
async function bootSrc(s){
 let ok=await applyFromIDB(s);
 for(const d of DELAYS){if(ok||s.painted)break;await sleep(d);ok=await applyFromIDB(s);}
 if(!ok&&!s.painted)await fetchLive(s);}
async function bootAll(){
 if(S.booting)return;S.booting=true;S.state='loading';S.err='';render();askParent();
 await Promise.all(SV.filter(s=>!s.painted).map(bootSrc));
 S.booting=false;
 if(!ready()){S.state='error';S.err=SV.filter(s=>!s.painted).map(s=>s.label+' ('+s.key+')'+(s.err?': '+s.err:'')).join(' · ');render();showToast('Not loaded — '+S.err,'error');}}
function retryAll(){S.booting=false;bootAll();}
const stateHTML=()=>S.state==='error'
 ?`<div class="empty">Ledger / bills data isn’t available yet.<div class="dim" style="margin:6px 0 10px;font-size:12px">${esc(S.err||'The cache is empty and the server could not be reached.')}</div><button class="btn pri" onclick="retryAll()"><i class="ti ti-refresh"></i>Retry</button></div>`
 :'<div class="sk"></div>'.repeat(5);
const notReady=()=>{if(USE_BACKEND&&!ready()){showToast(S.state==='error'?'Data not loaded — press Retry':'Still loading — please wait','error');return true;}return false;};

async function load(){
 if(USE_BACKEND){try{await freshLedger();}catch(e){showToast('Ledger not reachable: '+errText(e.message),'error');}after();return;}   // bills come from the cache; only the ledger changes through this page
 try{const j=await Ledger.get();L={Charges:j.Charges||[],Receipts:j.Receipts||[],Allocations:j.Allocations||[]};}
 catch(e){showToast('Ledger not reachable: '+errText(e.message),'error');}
 try{const b=await BillsApi.get();BL={Bills:b.Bills||[],Payments:b.Payments||[]};}
 catch(e){showToast('Bills not reachable: '+errText(e.message),'error');}
 after();}

/* ═══ BILLS STORE — local-cache mode (no backend). Row shapes = the Bills / Payments sheets, so the backend can take over later. ═══ */
const BillsApi=USE_BACKEND?{get:async()=>BL,post:(a,p)=>AP2Api.post(a,p)}:(()=>{
 const KEY='bills_local_v1',now=()=>new Date().toISOString();
 const rd=()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.Bills&&j.Payments)return j;}catch(e){}return{seq:0,Bills:[],Payments:[]};};
 const wr=j=>{try{localStorage.setItem(KEY,JSON.stringify(j));}catch(e){throw new Error('Browser storage is full or blocked');}};
 return{async get(){const j=rd();return{Bills:j.Bills,Payments:j.Payments};},
  async post(a,p){const j=rd();
   if(a==='addBill'){const b=p.bill;j.seq=(j.seq||0)+1;const no=String(j.seq).padStart(4,'0');
    b.lines.forEach(l=>j.Bills.push([b.id,no,b.dir,b.date,b.ptype,b.party,b.note,b.oids.join(','),b.disc,b.dt,b.vat,l.itemId,l.label,l.oq,l.rq,l.rate,now()]));wr(j);return{bill:{id:b.id,no}};}
   if(a==='deleteBill'){const ids=new Set(p.ids.map(String));for(const id of ids)await Ledger.post('reverseBill',{billId:id});
    j.Bills=j.Bills.filter(r=>!ids.has(String(r[0])));j.Payments=j.Payments.filter(r=>!ids.has(String(r[1])));wr(j);return{};}
   if(a==='addPayment'){const x=p.payment;j.Payments.push([x.id,x.billId,x.date,x.amount,x.mode,x.ref]);wr(j);return{};}
   if(a==='deletePayment'){const ids=new Set(p.ids.map(String));j.Payments=j.Payments.filter(r=>!ids.has(String(r[0])));wr(j);return{};}
   throw new Error('Unknown action');}};})();

/* Bills & Payments → open items. A bill that has no Charge rows yet is listed as ONE bill-level item
   (total − payments already recorded in Bills & Payments). It becomes a real Charge the moment you allocate to it. */
const calcB=(L,disc,dt,vat)=>{const sub=r2(L.reduce((a,l)=>a+(l.oq-l.rq)*l.rate,0)),d=r2(dt==='pct'?sub*disc/100:disc),net=r2(sub-d);return r2(net+net*vat/100);};
function virt(d){const m=new Map(),have=new Set(d.ch.map(c=>c.billId));
 rw(BL.Bills,'ID').forEach(a=>{const id=String(a[0]);let b=m.get(id);if(!b){b={id,no:String(a[1]),dir:String(a[2]),date:String(a[3]),party:String(a[5]).trim(),disc:+a[8]||0,dt:String(a[9]||'amt'),vat:+a[10]||0,lines:[]};m.set(id,b);}b.lines.push({oq:+a[13]||0,rq:+a[14]||0,rate:+a[15]||0});});
 const pay={};rw(BL.Payments,'ID').forEach(p=>pay[String(p[1])]=r2((pay[String(p[1])]||0)+(+p[3]||0)));
 return[...m.values()].filter(b=>!have.has(b.id)).map(b=>{const tot=calcB(b.lines,b.disc,b.dt,b.vat),due=r2(tot-(pay[b.id]||0));
  return{id:'V'+b.id,virtual:true,billId:b.id,type:'Bill',billNo:b.no,orderNo:'',desc:'Bill '+b.no+(pay[b.id]?' (net of earlier payments)':''),ptype:'',party:b.party,dir:b.dir,date:b.date,amt:due,due,note:'Auto-created from Bills when allocating'};}).filter(v=>v.due>.005);}
const chargeRow=v=>({type:'Bill',billId:v.billId,billNo:v.billNo,orderId:'',orderNo:'',ptype:v.ptype,party:v.party,dir:v.dir,date:v.date,desc:v.desc,amount:v.amt,comments:v.note});
async function syncBills(){if(notReady())return;const V=virt(D());if(!V.length)return showToast('Every bill already has charges','success');
 if(!confirm('Create bill-level charges for '+V.length+' bill(s) that have none yet? (They then appear in Reports too.)'))return;
 try{await post('addCharges',{rows:V.map(chargeRow)});await load();showToast(V.length+' bill(s) synced','success');}catch(e){showToast('Not synced: '+errText(e.message),'error');}}
let party='',rid=null,mode='auto',amts={},busy=false;
const D=()=>data();
function after(){const d=D();$('dl').innerHTML=[...new Set([...d.ch.map(c=>c.party),...d.rc.map(r=>r.party)])].sort().map(n=>`<option value="${esc(n)}">`).join('');render();}
function setParty(v){party=v.trim();rid=null;amts={};render();}
function setMode(m){mode=m;if(m==='auto')fill();render();}
function cur(){const d=D();return{d,r:d.rc.find(x=>x.id===rid&&x.party===party),R:d.rc.filter(r=>r.party===party&&r.un>.005)};}
function open_(d,r){return d.ch.filter(c=>c.party===party&&r&&c.dir===r.dir&&c.due>.005).concat(virt(d).filter(v=>r&&v.party===party&&v.dir===r.dir)).sort(fifo);}
function why(d,r){const mine=d.ch.filter(c=>c.party===party),same=mine.filter(c=>c.dir===r.dir);
 if(same.length)return `All ${same.length} charge(s) for “${esc(party)}” are already fully allocated.`;
 if(mine.length)return `“${esc(party)}” only has ${r.dir==='out'?'supplier':'customer'} charges — this receipt is a ${r.dir==='out'?'customer receipt':'supplier payment'}.`;
 return `Nothing open for “${esc(party)}” in Bills &amp; Payments or the ledger. Check the spelling of the name (it must match the party on the bill), and that the bill is in the same direction as this receipt.`;}
function fill(){const{d,r}=cur();amts={};if(!r)return;let rem=r.un;open_(d,r).forEach(c=>{const a=Math.min(c.due,rem);if(a>.005){amts[c.id]=r2(a);rem=r2(rem-a);}});}
function pickR(id){rid=id;if(mode==='auto')fill();else amts={};render();}
function sum(){return r2(Object.values(amts).reduce((a,x)=>a+(+x||0),0));}
function ctr(){const{r}=cur();if(!r){$('ctr').textContent='';return;}const u=r2(r.un-sum());$('ctr').innerHTML=`Allocating ${money(sum())} of ${money(r.un)} · <span class="${u<-.005?'neg':''}">Left (advance): ${money(u)}</span>`;}
function render(){
 if(USE_BACKEND&&!ready()){$('rc').innerHTML=stateHTML();$('items').innerHTML='';$('hist').innerHTML='';$('ctr').textContent='';return;}
 const{d,r,R}=cur();
 $('m-auto').classList.toggle('on',mode==='auto');$('m-man').classList.toggle('on',mode==='man');
 $('rc').innerHTML=!party?'<div class="empty">Enter a party name</div>':R.length?R.map(x=>`<div class="rcp${x.id===rid?' on':''}" onclick="pickR('${x.id}')"><input type="radio" ${x.id===rid?'checked':''}/><div><b class="mono">${esc(x.no)}</b> <span class="badge ${x.dir}">${x.dir==='out'?'In':'Out'}</span><div class="dim" style="font-size:12px">${esc(x.date)} · ${esc(x.mode||'')} ${esc(x.note||'')}</div></div><div class="mono" style="margin-left:auto">${money(x.un)}</div></div>`).join(''):'<div class="empty">No unallocated receipts for this party</div>';
 const I=open_(d,r),ro=mode==='auto'?'readonly':'';
 $('items').innerHTML=!r?'<div class="empty">Select a receipt</div>':I.length?`<table><thead><tr><th>Date</th><th>Bill</th><th>Order / item</th><th class="n">Charge</th><th class="n">Due</th><th class="n">Allocate</th></tr></thead><tbody>${I.map(c=>`<tr><td>${esc(c.date)}</td><td class="mono">${esc(c.billNo)||'–'} ${c.type!=='Order'?`<span class="badge">${esc(c.type)}</span>`:''}</td><td>${esc(c.orderNo||c.desc)}</td><td class="n">${money(c.amt)}</td><td class="n">${money(c.due)}</td><td><input type="number" min="0" step="any" ${ro} value="${amts[c.id]||''}" oninput="amts['${c.id}']=Math.min(+this.value||0,${c.due});ctr()" onchange="if(+this.value>${c.due})this.value=${c.due}"/></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${why(d,r)}</div>`;
 ctr();
 const rv=new Set(d.al.filter(a=>a.rev).map(a=>a.rev)),H=d.al.filter(a=>a.party===party).sort((a,b)=>b.id.localeCompare(a.id));
 $('hist').innerHTML=!party?'':H.length?`<table><thead><tr><th>Date</th><th>Receipt</th><th>Bill</th><th>Order</th><th class="n">Amount</th><th>Note</th><th></th></tr></thead><tbody>${H.map(a=>`<tr><td>${esc(a.date)}</td><td class="mono">${esc(a.rno)}</td><td class="mono">${esc(a.billNo)}</td><td>${esc(a.orderNo)}</td><td class="n ${a.amt<0?'neg':''}">${money(a.amt)}</td><td>${esc(a.note)}${a.rev?' <span class="badge unpaid">Reversal</span>':rv.has(a.id)?' <span class="badge">Reversed</span>':''}</td><td class="acts">${a.amt>0&&!rv.has(a.id)?`<button class="btn sm dng" onclick="rev('${a.id}')">Reverse</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No allocations yet</div>';}
async function save(){if(busy||notReady())return;const{r}=cur();if(!r)return showToast('Select a receipt','error');
 const rows=Object.entries(amts).filter(([k,v])=>+v>0).map(([k,v])=>({chargeId:k,amount:r2(v),comments:$('cm').value.trim()}));
 if(!rows.length)return showToast('Nothing to allocate','error');if(sum()>r.un+.005)return showToast('More than the receipt balance','error');
 busy=true;try{
  const vs=rows.filter(x=>x.chargeId[0]==='V');
  if(vs.length){const V=virt(D()),pick=vs.map(x=>V.find(v=>v.id===x.chargeId));if(pick.some(v=>!v))throw new Error('A bill changed — reload the page');
   await post('addCharges',{rows:pick.map(chargeRow)});const j=await Ledger.get();
   vs.forEach(x=>{const bid=x.chargeId.slice(1),c=rw(j.Charges,'ChargeID').find(c=>String(c[2])===bid&&c[1]==='Bill');if(!c)throw new Error('Charge not created for bill '+bid);x.chargeId=String(c[0]);});}
  await post('addAllocations',{paymentId:r.id,date:today(),rows});amts={};rid=null;await load();showToast('Allocation saved','success');}catch(e){showToast('Not saved: '+errText(e.message),'error');}busy=false;}
async function rev(id){if(notReady())return;const a=D().al.find(x=>x.id===id);if(!a||!confirm('Reverse this allocation of '+money(a.amt)+'? A negative row is added; the original stays.'))return;
 try{await post('addAllocations',{paymentId:a.pid,date:today(),rows:[{chargeId:a.cid,amount:-a.amt,reverses:a.id,comments:'Reversal of '+a.id}]});await load();showToast('Reversed','success');}catch(e){showToast('Not reversed: '+errText(e.message),'error');}}

/* ═══ BOOT ═══ */
if(USE_BACKEND){
 window.addEventListener('message',onCacheMessage);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(!ready()&&!S.booting)bootAll();else SV.forEach(applyFromIDB);});
 watchSrc();bootAll();setInterval(()=>{if(ready())SV.forEach(applyFromIDB);},15000);   // safety net behind the subscription
}else load();
</script>
</body>
