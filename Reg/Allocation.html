<style>
:root,[data-theme="dark"]{color-scheme:dark;--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--surface:#21262d;--border:#30363d;--border2:#444c56;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent-dim:rgba(88,166,255,.12);--teal:#39d353;--teal-dim:rgba(57,211,83,.12);--amber:#e3b341;--red:#f85149;--orange:#f0883e;--orange-dim:rgba(240,136,62,.12);--radius:8px;--radius-lg:12px;--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace}
[data-theme="light"]{color-scheme:light;--bg:#f0f2f5;--bg2:#fff;--bg3:#e8ecf0;--surface:#fff;--border:#c8d0d9;--border2:#9aa5b1;--text:#0d1117;--text2:#3d454f;--accent:#0550ae;--accent-dim:rgba(5,80,174,.12);--teal:#116329;--teal-dim:rgba(17,99,41,.13);--amber:#7d4e00;--red:#a8111b;--orange:#953800;--orange-dim:rgba(149,56,0,.13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}

.tabs{display:flex;gap:4px}

.tab{background:var(--bg3);color:var(--text2)}.tab.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}

.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.sm{padding:3px 8px;font-size:12px}

main{flex:1;min-height:0;overflow:auto;padding:12px 14px}

input:focus,select:focus{outline:none;border-color:var(--accent)}

input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tools{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}.tools input{max-width:320px}
.kpi{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:150px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:9px 12px;font-size:12px;color:var(--text2)}.kpi b{display:block;font:600 16px var(--mono);color:var(--text);margin-top:2px}
.tw{overflow-x:auto}

.n{text-align:right!important;font-family:var(--mono)}td.acts{white-space:nowrap;width:1%}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2)}
.badge.out,.badge.part{background:var(--orange-dim);color:var(--orange)}.badge.in,.badge.paid{background:var(--teal-dim);color:var(--teal)}.badge.unpaid{background:rgba(248,81,73,.12);color:var(--red)}
.mono{font-family:var(--mono)}.dim{color:var(--text2)}.neg{color:var(--red)}.warn{color:var(--amber);font-size:12px}
.empty{padding:36px;text-align:center;color:var(--text2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}.ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:900px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.mh,.mf{padding:12px 16px;display:flex;align-items:center;gap:8px;flex:none}.mh{border-bottom:1px solid var(--border);font-weight:600}.mf{border-top:1px solid var(--border);justify-content:flex-end;flex-wrap:wrap}
.mh .x{margin-left:auto}.mf .sum{margin-right:auto;font:500 13px var(--mono)}
.mb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}.mb>*{flex-shrink:0}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.ib.ok{color:var(--teal)}.ib.err{color:var(--red)}.ib.warn{color:var(--amber)}
.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer}
.ol{border:1px solid var(--border);border-radius:var(--radius-lg);max-height:260px;overflow:auto}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}.opt:last-child{border-bottom:0}
.opt:hover{background:var(--accent-dim)}.opt.off{opacity:.5;cursor:not-allowed}.opt input{width:auto;margin-top:3px}.opt .b{flex:1;min-width:0}
.sec{font-size:12px;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:8px}.sec .btn{margin-left:auto}
.rt{max-width:110px;margin-left:auto;font-family:var(--mono);text-align:right}
.tot{margin-left:auto;width:min(340px,100%);font-size:13px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font:700 15px var(--mono);border-top:1px solid var(--border2);margin-top:4px;padding-top:6px}
.pr-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:8px;align-items:end}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border2);padding:9px 16px;border-radius:var(--radius);z-index:99;display:none;font-size:13px}.toast.error{border-color:var(--red);color:var(--red)}.toast.success{border-color:var(--teal)}
#pr{display:none}
@media(max-width:700px){.fg,.pr-row{grid-template-columns:1fr 1fr}.modal{border-radius:0;border:0}.ov{padding:0}.bar .btn .lbl{display:none}}
/* ── print: only the bill ── */
#pr,#pr *,#pv,#pv *{color:#000!important;background:#fff!important;font-family:Arial,sans-serif}
#pr{padding:8mm;font-size:12px}#pr h2{font-size:20px}#pr .hd{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
#pr table,#pv table{border:1px solid #000;margin:8px 0}#pr th,#pr td,#pv th,#pv td{border:1px solid #888;padding:5px 7px;font-size:12px}#pr th,#pv th{background:#eee!important}#pv .hd{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}#pv .tot{width:300px}#pv h2{font-size:20px}#pv{font-size:12px}
#pr .tot{width:300px}#pr .sig{display:flex;justify-content:space-between;margin-top:50px}#pr .sig span{border-top:1px solid #000;padding-top:4px;width:30%;text-align:center}
@media print{@page{margin:8mm}body>*:not(#pr){display:none!important}html,body{height:auto;overflow:visible}#pr{display:block}}
.seg{display:inline-flex}.seg .tab{border-radius:0}.seg .tab:first-child{border-radius:8px 0 0 8px}.seg .tab:last-child{border-radius:0 8px 8px 0}.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px}@media(max-width:800px){.cols{grid-template-columns:1fr}}.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px}.rcp{display:flex;gap:8px;align-items:center;padding:7px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer}.rcp.on{border-color:var(--accent);background:var(--accent-dim)}td input{max-width:120px;text-align:right}

.sk{height:34px;border-radius:6px;margin-bottom:8px;background:linear-gradient(90deg,var(--bg3),var(--surface),var(--bg3));background-size:200% 100%;animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}

/* ═══ v3 — compact toolbar, search dropdown, two-column cards, open-items table ═══ */
[hidden]{display:none!important}
.bar{position:relative;z-index:30;flex-wrap:nowrap;gap:10px;align-items:center;padding:9px 14px}
.bar>*{flex:none}
.bar>.bar-scroll{flex:0 1 auto;min-width:0;margin-right:auto}
.bar-scroll{display:flex;align-items:center;gap:10px;overflow-x:auto;overflow-y:hidden;padding:3px 2px;scrollbar-width:none;-ms-overflow-style:none}
.bar-scroll>*{flex:none}
.bar h1{margin-right:2px;white-space:nowrap}
.bar .seg .tab{height:36px;padding:0 12px;font-size:15px}
.ib{border-radius:var(--radius);height:36px;width:36px}
main{max-width:1600px;width:100%;margin:0 auto}
/* pills */
.bw-caps{display:inline-flex;gap:3px;padding:3px;background:var(--bg3);border:1px solid var(--border);border-radius:99px;flex-wrap:nowrap}
.bw-cap{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 13px;border-radius:99px;border:1px solid transparent;background:transparent;color:var(--text2);font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.bw-cap i{font-size:15px}.bw-cap:hover{color:var(--text)}
.bw-cap.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.bw-cap .cn{font:600 10.5px var(--mono);padding:1px 6px;border-radius:99px;background:var(--bg2);color:var(--text2)}.bw-cap.on .cn{background:var(--accent);color:#fff}
/* search button + dropdown / dropup panel */
.ps{position:relative}
.ps-b{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:16px}
.ps-b:hover,.ps.open .ps-b{color:var(--text);border-color:var(--accent)}.ps-b.act{color:var(--accent);background:var(--accent-dim);border-color:var(--accent)}
.ps-b .ti-chevron-down,.ps-b .ti-chevron-up{font-size:14px}
.ps-m{position:fixed;display:none;flex-direction:column;overflow:hidden;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);box-shadow:0 14px 34px rgba(0,0,0,.4);z-index:90}
.ps.open .ps-m{display:flex}
.ps-s{position:relative;flex:none;padding:8px;border-bottom:1px solid var(--border)}
.ps-s>i{position:absolute;left:19px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:16px;pointer-events:none}
.ps-s input{height:36px;padding:0 34px 0 34px}
.ps-x{position:absolute;right:12px;top:12px;width:28px;height:28px;border:0;background:transparent;color:var(--text2);cursor:pointer;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}.ps-x:hover{background:var(--surface);color:var(--text)}
.ps-l{flex:1;min-height:0;overflow:auto}
.pm-h{position:sticky;top:0;background:var(--bg2);padding:7px 12px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.05em}
.pi{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border)}.pi:last-child{border-bottom:0}
.pi:hover,.pi.hl{background:var(--accent-dim)}.pi.sel{box-shadow:inset 3px 0 0 var(--accent)}
.pi>i{width:30px;height:30px;border-radius:50%;background:var(--bg3);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.pn{min-width:0;flex:1}.pn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pn span{font-size:11.5px;color:var(--text2)}
.pa{margin-left:auto;text-align:right;font-size:12.5px;white-space:nowrap}.pa small{display:block;color:var(--text2);font:400 11px var(--font)}.pa0{font-size:11.5px;white-space:nowrap}
.qchip{display:inline-flex;align-items:center;gap:6px;height:30px;max-width:170px;padding:0 6px 0 10px;border-radius:99px;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);font-size:12.5px}
.qchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qchip button{border:0;background:transparent;color:inherit;cursor:pointer;display:inline-flex;font-size:14px;padding:2px}
/* From / To dates */
.bw-d{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;margin:0;border:1px solid var(--border);background:var(--bg3);border-radius:var(--radius);color:var(--text2);cursor:pointer;position:relative}
.bw-d .lb{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.bw-d:focus-within,.bw-d.has{border-color:var(--accent)}.bw-d.has{background:var(--accent-dim);color:var(--accent)}
.bw-d input{width:auto;height:auto;border:0;background:transparent;padding:0;color:var(--text);font-size:13px}
/* cards: same two-column arrangement as before */
.cols{display:grid;grid-template-columns:minmax(340px,1fr) minmax(0,2fr);gap:12px;align-items:start}
.cols .card{padding:12px 14px}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ch .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:var(--bg3);border:1px solid var(--border);font:500 11.5px var(--mono);color:var(--text2)}
.chip.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
/* receipts: ONE compact icon row per entry */
.rl{display:flex;flex-direction:column;gap:5px;max-height:214px;overflow:auto;padding:1px}
.rcp{display:grid;grid-template-columns:18px 22px 16px 16px auto minmax(0,1fr) auto;gap:7px;align-items:center;padding:7px 10px;margin:0;background:var(--bg2);transition:border-color .15s,background .15s}
.rcp:hover{border-color:var(--border2)}.rcp.on{border-color:var(--accent);background:var(--accent-dim)}
.rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:12px}
.rcp.on .rd{background:var(--accent);border-color:var(--accent);color:#fff}
.rdir{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.rdir.out{background:var(--orange-dim);color:var(--orange)}.rdir.in{background:var(--teal-dim);color:var(--teal)}
.rty{color:var(--accent);font-size:16px}.rmo{color:var(--text2);font-size:16px}
.rdt{font:500 11px var(--mono);color:var(--text2);white-space:nowrap}
.rnm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ra{font-size:13px;text-align:right;white-space:nowrap}
.tip{position:fixed;z-index:95;max-width:270px;padding:9px 11px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);box-shadow:0 10px 28px rgba(0,0,0,.4);font-size:12px;pointer-events:none}
.tip .th{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border)}.tip .th b{font-size:13px}
.tip .tr{display:flex;justify-content:space-between;gap:14px;padding:1.5px 0}.tip .tr span:first-child{color:var(--text2)}.tip .tr span:last-child{text-align:right;overflow-wrap:anywhere}
/* open items: table */
.itw{max-height:282px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-lg)}
.itw table{border:0}.itw th{position:sticky;top:0;z-index:2}
.itw td{vertical-align:middle}.itw th.ck,.itw td.ck{width:34px;padding-right:0}
.itw tr.it{cursor:pointer;transition:background .12s}.itw tr.it:hover td{background:var(--accent-dim)}
.itw tr.it.on td{background:var(--accent-dim)}.itw tr.it.on td.ck{box-shadow:inset 3px 0 0 var(--accent)}
.itw tr:last-child td{border-bottom:0}
.ckb{width:18px;height:18px;padding:0;accent-color:var(--accent);cursor:pointer}
.itw td input[type=number]{max-width:130px;width:100%;height:32px;text-align:right;font-family:var(--mono)}
/* footer */
.ft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.ctr{flex:1 1 280px;min-width:0;font-size:12.5px}.ctr .ct{margin-bottom:5px}
.pg{height:6px;border-radius:99px;background:var(--bg3);overflow:hidden}.pg i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .2s}.pg i.bad{background:var(--red)}
.ft input{flex:1 1 200px;max-width:none}
.ch .ctr{flex:1 1 240px;min-width:200px;max-width:520px;margin:0 6px}
/* v4 — row actions, 5-row scroll areas, hidden scrollbars */
.rb{width:30px;height:30px;border-radius:var(--radius);font-size:16px;flex:none}
.rb:hover{color:var(--text);border-color:var(--accent)}
.rb.has{color:var(--accent);background:var(--accent-dim);border-color:var(--accent)}
.rb.rsv{color:var(--teal)}.rb.rsv:hover{background:var(--teal-dim);border-color:var(--teal)}
td.ra2{white-space:nowrap;width:1%;text-align:right}td.ra2 .rb{margin-left:4px}
tr.cmr td{background:var(--bg3);padding:6px 10px}
.itw td input.cmi{max-width:none;width:100%;text-align:left;font-family:var(--font);height:32px}
.tw{max-height:244px;overflow:auto}
.tw th{position:sticky;top:0;z-index:2}
.bar-scroll,.rl,.itw,.tw,.ps-l,.ol,.mb,.tools{scrollbar-width:none;-ms-overflow-style:none}
.bar-scroll::-webkit-scrollbar,.rl::-webkit-scrollbar,.itw::-webkit-scrollbar,.tw::-webkit-scrollbar,.ps-l::-webkit-scrollbar,.ol::-webkit-scrollbar,.mb::-webkit-scrollbar,.tools::-webkit-scrollbar{display:none;width:0;height:0}
.hh{margin:16px 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.empty i{color:var(--text2)}
/* compact: icons only, bar scrolls sideways */
@media(max-width:1180px){
 .bar{padding:8px 10px;gap:8px}
 .bar h1 .t,.bw-cap .l,.bw-d .lb{display:none}
 .bw-cap{padding:0 10px}
 .bw-d{width:36px;padding:0;justify-content:center}
 .bw-d input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
 .qchip{max-width:120px}
}
@media(max-width:900px){.cols{grid-template-columns:1fr}.ft input{max-width:none;flex:1 1 100%}.ft .btn{flex:1 1 100%;justify-content:center}}
@media(max-width:600px){.qchip{display:none}}
/* v5 — all toolbar controls live in ONE pill (scrolls sideways inside it, no scrollbar) */
.bar-scroll{gap:4px;padding:2px 4px;background:var(--bg3);border:1px solid var(--border);border-radius:99px}
.bar-scroll .bw-caps{background:transparent;border:0;padding:0;gap:2px}
.bar-scroll .bw-cap{height:30px}
.bar-scroll .bw-caps:not([hidden])+.ps{margin-left:4px;padding-left:6px;border-left:1px solid var(--border)}
.bar-scroll .ps-b,.bar-scroll .bw-d,.bar-scroll .ib{height:30px;border:0;background:transparent;border-radius:99px}
.bar-scroll .ib{width:30px}
.bar-scroll .ps-b:hover,.bar-scroll .ps.open .ps-b,.bar-scroll .bw-d:hover,.bar-scroll .ib:hover{background:var(--bg2)}
.bar-scroll .ps-b.act,.bar-scroll .bw-d.has{background:var(--accent-dim);color:var(--accent)}
.bar-scroll .qchip{height:26px}

<body>
<div class="bar">

<script>
'use strict';
/* ═══ LEDGER STORE — local-cache mode (no backend). Same data shape as the Apps Script backend,
   so going live later = set USE_BACKEND=true (and re-enable the shared scripts in <head>). ═══ */
const USE_BACKEND=true;   // true: ledger + bills are read from the ap2_ledger / ap2_bills caches, ledger writes go to the API · false: old local-only mode (localStorage)
const Ledger=USE_BACKEND?{get:()=>freshLedger(),post:(a,p)=>AP2Api.post(a,p).then(r=>r||{})}:(()=>{
 const KEY='acc_ledger_v1',H={
  Charges:['ChargeID','Type','BillID','BillNo','OrderID','OrderNo','PartyType','Party','Dir','Date','Description','Amount','Comments','Created'],
  Receipts:['PaymentID','ReceiptNo','Dir','PartyType','Party','Date','Mode','Ref','Amount','Comments','Type','Created'],
  Allocations:['AllocID','PaymentID','ReceiptNo','BillID','BillNo','ChargeID','OrderID','OrderNo','PartyType','Party','Date','Amount','Comments','Reverses','Created']};
 const rd=()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.Charges&&j.Receipts&&j.Allocations)return j;}catch(e){}return{Charges:[H.Charges],Receipts:[H.Receipts],Allocations:[H.Allocations]};};
 const wr=j=>{try{localStorage.setItem(KEY,JSON.stringify(j));}catch(e){throw new Error('Browser storage is full or blocked — export a backup and clear space');}};
 const R=n=>Math.round((+n||0)*100)/100,now=()=>new Date().toISOString(),uid=(p,i)=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+(i||0);
 const sm=(a,f)=>R(a.reduce((s,x)=>s+f(x),0));
 return{
  async get(){return rd();},
  async post(action,p){const j=rd();
   if(action==='addCharges'){
    const rows=(p.rows||[]).map((c,i)=>{if(!c.party)throw new Error('Party missing');return[uid('C',i),c.type||'Order',c.billId||'',c.billNo||'',c.orderId||'',c.orderNo||'',c.ptype||'',c.party,c.dir||'out',c.date,c.desc||'',R(c.amount),c.comments||'',now()];});
    j.Charges.push(...rows);wr(j);return{count:rows.length};}
   if(action==='addReceipt'){const r=p.receipt;if(!r.party||!(+r.amount>0))throw new Error('Party and amount required');
    const no=(r.dir==='in'?'P-':'R-')+String(j.Receipts.length).padStart(4,'0');
    j.Receipts.push([r.id||uid('P'),no,r.dir||'out',r.ptype||'',r.party,r.date,r.mode||'',r.ref||'',R(r.amount),r.comments||'',r.type||'Receipt',now()]);wr(j);return{receipt:{id:r.id,no}};}
   if(action==='addAllocations'){
    const rec=j.Receipts.slice(1).find(x=>x[0]==p.paymentId);if(!rec)throw new Error('Receipt not found');
    const al=j.Allocations.slice(1);let rem=R(rec[8]-sm(al.filter(a=>a[1]==rec[0]),a=>+a[11]));const out=[];
    (p.rows||[]).forEach((x,i)=>{const ch=j.Charges.slice(1).find(c=>c[0]==x.chargeId);if(!ch)throw new Error('Charge not found');
     if(ch[7]!=rec[4])throw new Error('Charge belongs to another party');
     const amt=R(x.amount),due=R(ch[11]-sm(al.filter(a=>a[5]==ch[0]),a=>+a[11])-sm(out.filter(o=>o[5]==ch[0]),o=>o[11]));
     if(amt>0){if(amt>rem+.005)throw new Error('More than receipt balance');if(amt>due+.005)throw new Error('More than due on '+(ch[5]||ch[10]));}
     rem=R(rem-amt);out.push([uid('A',i),rec[0],rec[1],ch[2],ch[3],ch[0],ch[4],ch[5],ch[6],ch[7],p.date,amt,x.comments||'',x.reverses||'',now()]);});
    j.Allocations.push(...out);wr(j);return{count:out.length};}
   if(action==='reverseBill'){const al=j.Allocations.slice(1),ch=j.Charges.slice(1),done=new Set(ch.filter(c=>c[1]==='Reversal').map(c=>String(c[12]).replace('rev:','')));
    const t=ch.filter(c=>c[2]==p.billId&&c[1]!=='Reversal'&&!done.has(String(c[0])));
    t.forEach(c=>{if(Math.abs(sm(al.filter(a=>a[5]==c[0]),a=>+a[11]))>.005)throw new Error('This bill has allocated payments — reverse them in Allocation first');});
    const rows=t.map((c,i)=>[uid('C',i),'Reversal',c[2],c[3],c[4],c[5],c[6],c[7],c[8],now().slice(0,10),'Reversal: '+(c[10]||''),R(-c[11]),'rev:'+c[0],now()]);
    j.Charges.push(...rows);wr(j);return{count:rows.length};}
   throw new Error('Unknown action');},
  backup(){return JSON.stringify(rd());},
  restore(t){const j=JSON.parse(t);if(!(j&&j.Charges&&j.Receipts&&j.Allocations))throw new Error('Not a ledger backup');wr(j);}
 };})();
const CUR='AED',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),r2=n=>Math.round((+n||0)*100)/100;
const today=()=>new Date().toISOString().slice(0,10),post=(a,p)=>Ledger.post(a,p),errText=m=>String(m);
function showToast(m,t){const e=$('toast');e.textContent=m;e.className='toast '+(t||'');e.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.style.display='none',t==='error'?9000:3000);}
let L={Charges:[],Receipts:[],Allocations:[]};
const rw=(a,h)=>(a||[]).filter(r=>Array.isArray(r)&&r[0]!==''&&String(r[0])!==h);
function data(){
 const al=rw(L.Allocations,'AllocID').map(a=>({id:String(a[0]),pid:String(a[1]),rno:a[2],billNo:a[4],cid:String(a[5]),orderNo:a[7],party:a[9],date:String(a[10]),amt:+a[11]||0,note:a[12],rev:String(a[13]||'')}));
 const rvC={};rw(L.Charges,'ChargeID').forEach(c=>{if(c[1]==='Reversal')rvC[String(c[12]).replace('rev:','')]=+c[11]||0;});const bC={},bP={};al.forEach(a=>{bC[a.cid]=r2((bC[a.cid]||0)+a.amt);bP[a.pid]=r2((bP[a.pid]||0)+a.amt);});
 const ch=rw(L.Charges,'ChargeID').map(c=>({id:String(c[0]),type:c[1],billId:String(c[2]||''),billNo:String(c[3]||''),orderNo:String(c[5]||''),ptype:c[6],party:String(c[7]).trim(),dir:c[8],date:String(c[9]),desc:c[10],amt:+c[11]||0,note:c[12]})).map(c=>({...c,paid:bC[c.id]||0,due:r2(c.amt-(bC[c.id]||0)+(rvC[c.id]||0))}));
 const rc=rw(L.Receipts,'PaymentID').map(r=>({id:String(r[0]),no:r[1],dir:r[2],party:String(r[4]).trim(),date:String(r[5]),mode:r[6],ref:r[7],amt:+r[8]||0,note:r[9],type:r[10],ptype:String(r[3]||'')})).map(r=>({...r,alloc:bP[r.id]||0,un:r2(r.amt-(bP[r.id]||0))}));
 const pm={};ch.forEach(c=>{if(c.ptype&&!pm[c.party])pm[c.party]=String(c.ptype);});rc.forEach(r=>{if(!r.ptype)r.ptype=pm[r.party]||'';});
 return{al,ch,rc};}
const fifo=(a,b)=>a.date.localeCompare(b.date)||((b.type==='Opening')-(a.type==='Opening'))||a.billNo.localeCompare(b.billNo)||a.id.localeCompare(b.id);
let BL={Bills:[],Payments:[]};
/* ═══ CACHE SOURCES — "ap2_ledger" + "ap2_bills" (same three-path loader as userPortal.html / Bills.html)
   1. parent push   : ap-cache-request → index.html answers ap-cache-ready / ap-cache-preload (same-origin only)
   2. IndexedDB read: AP2CacheWatcher.readKey(key), 6 retries (300 · 500 · 800 · 1200 · 2000 · 3000 ms)
   3. live updates  : AP2CacheWatcher.subscribe → re-read on any change (+15 s poll, + on tab focus)
   Newest record wins (ts). All empty → AdminPro.get(key). Still nothing → error panel + Retry (never an endless skeleton).
   Both datasets are needed to build the open-items list, so the page paints once BOTH have arrived.
   ⚠ dataLayer.js: add 'ap2_ledger' and 'ap2_bills' to ALLOW_EMPTY_OBJECT_DATASETS (a fresh system has no rows). */
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),DELAYS=[300,500,800,1200,2000,3000];
const isObj=d=>!!d&&typeof d==='object';
const SRC={
 ledger:{key:'ap2_ledger',label:'Ledger',shape:d=>isObj(d)&&Array.isArray(d.Charges)&&Array.isArray(d.Receipts)&&Array.isArray(d.Allocations),
  set:d=>{L={Charges:d.Charges,Receipts:d.Receipts,Allocations:d.Allocations};}},
 bills:{key:'ap2_bills',label:'Bills',shape:d=>isObj(d)&&Array.isArray(d.Bills)&&(d.Payments===undefined||Array.isArray(d.Payments)),
  set:d=>{BL={Bills:d.Bills,Payments:d.Payments||[]};}}};
SRC.specs={key:'ap2_specsData',label:'Parties',shape:d=>isObj(d)&&Array.isArray(d.Specs),set:d=>{applySpecs(d.Specs);}};   // parties / categories — optional: the page works without it, just no pills
const SV=Object.values(SRC);SV.forEach(s=>Object.assign(s,{ts:0,fp:'',painted:false,err:''}));
const S={state:'loading',err:'',booting:false};
const REQ=[SRC.ledger,SRC.bills],ready=()=>REQ.every(s=>s.painted);   // parties (specs) load alongside but never block the page
function unpackS(s,r){if(!isObj(r))return null;if(s.shape(r))return{data:r,ts:0};if(s.shape(r.data))return{data:r.data,ts:+r.ts||0};return null;}
function applySrc(s,r,from,force){
 const u=unpackS(s,r);if(!u)return false;
 if(!force&&s.painted&&u.ts&&u.ts<=s.ts)return true;           // not newer than what is on screen
 s.ts=force?Date.now():(u.ts||Math.max(s.ts,Date.now()));
 const fp=JSON.stringify(u.data);
 if(!force&&s.painted&&fp===s.fp)return true;                   // identical → no re-render
 s.fp=fp;s.set(u.data);s.painted=true;s.err='';
 if(ready()){S.state='ready';S.err='';after();}else render();
 return true;}
async function readIDB(s){try{if(window.AP2CacheWatcher&&typeof AP2CacheWatcher.readKey==='function')return await AP2CacheWatcher.readKey(s.key);}catch(e){}return null;}
async function applyFromIDB(s){const r=await readIDB(s);return r?applySrc(s,r,'idb'):false;}
async function fetchLive(s){
 try{if(!(window.AdminPro&&typeof AdminPro.get==='function'))throw new Error('AdminPro is not available');
  const r=await AdminPro.get(s.key);if(!applySrc(s,r,'live')&&!s.painted)throw new Error('unexpected data from server');}
 catch(e){s.err=String((e&&e.message)||e);}}
async function freshLedger(){                                   // after a write: force-pull the ledger (updates IndexedDB too), fall back to the endpoint
 const s=SRC.ledger;let r=null;
 try{if(window.AdminPro){const fn=typeof AdminPro.refresh==='function'?AdminPro.refresh:AdminPro.get;r=await fn.call(AdminPro,s.key,{force:true});}}catch(e){}
 if(!unpackS(s,r))r=await AP2Api.get('ledger');
 if(!applySrc(s,r,'live',true))throw new Error('Ledger returned unexpected data');
 return L;}
function askParent(){if(window.parent===window)return;try{window.parent.postMessage({type:'ap-cache-request',keys:SV.map(s=>s.key)},location.origin);}catch(e){}}
function pickPayload(m,s){
 for(const bag of [m,m.data,m.datasets,m.payload,m.caches])if(isObj(bag)&&bag[s.key]!==undefined&&unpackS(s,bag[s.key]))return bag[s.key];
 if(m.key===s.key||m.name===s.key||m.dataset===s.key){const v=m.data!==undefined?m.data:m.value;if(unpackS(s,v))return v;}
 return null;}
function onCacheMessage(e){                                     // same-origin parent only
 if(e.origin!==location.origin||(e.source!==window.parent&&e.source!==window))return;
 const m=e.data;if(!isObj(m))return;const t=String(m.type||m.msg||'');if(!/^ap-cache/.test(t))return;
 SV.forEach(s=>{let got=false;if(/^ap-cache-(ready|preload)$/.test(t)){const d=pickPayload(m,s);if(d)got=applySrc(s,d,'parent');}
  if(!got)setTimeout(()=>applyFromIDB(s),250);});}
function watchSrc(){
 const W=window.AP2CacheWatcher;if(!W||typeof W.subscribe!=='function')return;
 const cb=k=>{const key=(k&&k.key)||k;const hit=typeof key==='string'?SV.filter(s=>s.key===key):SV;hit.forEach(applyFromIDB);};
 try{W.subscribe(cb);}catch(e){SV.forEach(s=>{try{W.subscribe(s.key,()=>applyFromIDB(s));}catch(x){}});}}
async function bootSrc(s){
 let ok=await applyFromIDB(s);
 for(const d of DELAYS){if(ok||s.painted)break;await sleep(d);ok=await applyFromIDB(s);}
 if(!ok&&!s.painted)await fetchLive(s);}
async function bootAll(){
 if(S.booting)return;S.booting=true;S.state='loading';S.err='';render();askParent();
 await Promise.all(SV.filter(s=>!s.painted).map(bootSrc));
 S.booting=false;
 if(!ready()){S.state='error';S.err=REQ.filter(s=>!s.painted).map(s=>(s.err&&console.warn('[load]',s.label,s.err),s.label)).join(' · ');render();showToast('Not loaded — '+S.err,'error');}}
function retryAll(){S.booting=false;bootAll();}
const stateHTML=()=>S.state==='error'
 ?`<div class="empty">Ledger / bills data isn’t available yet.<div class="dim" style="margin:6px 0 10px;font-size:12px">${esc(S.err||'Data isn’t available right now. Check your connection and try again.')}</div><button class="btn pri" onclick="retryAll()"><i class="ti ti-refresh"></i>Retry</button></div>`
 :'<div class="sk"></div>'.repeat(5);
const notReady=()=>{if(USE_BACKEND&&!ready()){showToast(S.state==='error'?'Data not loaded — press Retry':'Still loading — please wait','error');return true;}return false;};

async function load(){
 if(USE_BACKEND){try{await freshLedger();}catch(e){showToast('Could not refresh the ledger: '+errText(e.message),'error');}after();return;}   // bills come from the cache; only the ledger changes through this page
 try{const j=await Ledger.get();L={Charges:j.Charges||[],Receipts:j.Receipts||[],Allocations:j.Allocations||[]};}
 catch(e){showToast('Could not refresh the ledger: '+errText(e.message),'error');}
 try{const b=await BillsApi.get();BL={Bills:b.Bills||[],Payments:b.Payments||[]};}
 catch(e){showToast('Bills not reachable: '+errText(e.message),'error');}
 after();}

/* ═══ BILLS STORE — local-cache mode (no backend). Row shapes = the Bills / Payments sheets, so the backend can take over later. ═══ */
const BillsApi=USE_BACKEND?{get:async()=>BL,post:(a,p)=>AP2Api.post(a,p)}:(()=>{
 const KEY='bills_local_v1',now=()=>new Date().toISOString();
 const rd=()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.Bills&&j.Payments)return j;}catch(e){}return{seq:0,Bills:[],Payments:[]};};
 const wr=j=>{try{localStorage.setItem(KEY,JSON.stringify(j));}catch(e){throw new Error('Browser storage is full or blocked');}};
 return{async get(){const j=rd();return{Bills:j.Bills,Payments:j.Payments};},
  async post(a,p){const j=rd();
   if(a==='addBill'){const b=p.bill;j.seq=(j.seq||0)+1;const no=String(j.seq).padStart(4,'0');
    b.lines.forEach(l=>j.Bills.push([b.id,no,b.dir,b.date,b.ptype,b.party,b.note,b.oids.join(','),b.disc,b.dt,b.vat,l.itemId,l.label,l.oq,l.rq,l.rate,now()]));wr(j);return{bill:{id:b.id,no}};}
   if(a==='deleteBill'){const ids=new Set(p.ids.map(String));for(const id of ids)await Ledger.post('reverseBill',{billId:id});
    j.Bills=j.Bills.filter(r=>!ids.has(String(r[0])));j.Payments=j.Payments.filter(r=>!ids.has(String(r[1])));wr(j);return{};}
   if(a==='addPayment'){const x=p.payment;j.Payments.push([x.id,x.billId,x.date,x.amount,x.mode,x.ref]);wr(j);return{};}
   if(a==='deletePayment'){const ids=new Set(p.ids.map(String));j.Payments=j.Payments.filter(r=>!ids.has(String(r[0])));wr(j);return{};}
   throw new Error('Unknown action');}};})();

/* Bills & Payments → open items. A bill that has no Charge rows yet is listed as ONE bill-level item
   (total − payments already recorded in Bills & Payments). It becomes a real Charge the moment you allocate to it. */
const calcB=(L,disc,dt,vat)=>{const sub=r2(L.reduce((a,l)=>a+(l.oq-l.rq)*l.rate,0)),d=r2(dt==='pct'?sub*disc/100:disc),net=r2(sub-d);return r2(net+net*vat/100);};
function virt(d){const m=new Map(),have=new Set(d.ch.map(c=>c.billId));
 rw(BL.Bills,'ID').forEach(a=>{const id=String(a[0]);let b=m.get(id);if(!b){b={id,no:String(a[1]),dir:String(a[2]),date:String(a[3]),party:String(a[5]).trim(),disc:+a[8]||0,dt:String(a[9]||'amt'),vat:+a[10]||0,lines:[]};m.set(id,b);}b.lines.push({oq:+a[13]||0,rq:+a[14]||0,rate:+a[15]||0});});
 const pay={};rw(BL.Payments,'ID').forEach(p=>pay[String(p[1])]=r2((pay[String(p[1])]||0)+(+p[3]||0)));
 return[...m.values()].filter(b=>!have.has(b.id)).map(b=>{const tot=calcB(b.lines,b.disc,b.dt,b.vat),due=r2(tot-(pay[b.id]||0));
  return{id:'V'+b.id,virtual:true,billId:b.id,type:'Bill',billNo:b.no,orderNo:'',desc:'Bill '+b.no+(pay[b.id]?' (net of earlier payments)':''),ptype:'',party:b.party,dir:b.dir,date:b.date,amt:due,due,note:'Auto-created from Bills when allocating'};}).filter(v=>v.due>.005);}
const chargeRow=v=>({type:'Bill',billId:v.billId,billNo:v.billNo,orderId:'',orderNo:'',ptype:v.ptype,party:v.party,dir:v.dir,date:v.date,desc:v.desc,amount:v.amt,comments:v.note});
let party='',qtxt='',rid=null,mode='auto',amts={},cmts={},cOpen=new Set(),busy=false,pill='',dFrom='',dTo='',psL=[],psIdx=-1;
const D=()=>data();
/* ── PARTIES — read from the "ap2_specsData" cache, same rules as Receipts.html
   row = [ID, Category, Name, Description, Status]
   Customers = any category whose Description is "Customer" (Doctor · Hospital · Vendor …) → one pill per category
   Suppliers = category "Supplier" → one "Supplier" pill. Nothing is hard-coded: new categories / parties appear by themselves. ── */
let CUST=[],SUPP=[],TYPES=[],PM=new Map();
const norm=s=>String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase();
const IGN=/^(item\s*names?|item\s*lists?|item\s*categor(y|ies)|stores?(\s*branch)?|medical\s*domains?|material\s*sources?|specs|delivery\s*challan|dc\s*lists?|add\s*charges?)$/i;
const cap=s=>{s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1);},d10=s=>String(s||'').slice(0,10);
const TICO={doctor:'ti-stethoscope',hospital:'ti-building-hospital',vendor:'ti-truck-delivery',supplier:'ti-truck-delivery'};
const tIcon=k=>TICO[norm(k)]||'ti-user';
function applySpecs(rows){const cu=[],su=[],T=new Map(),seen=new Set();
 (rows||[]).forEach(r=>{if(!Array.isArray(r)||String(r[0]).toLowerCase()==='id')return;
  const kind=String(r[1]??'').trim(),a=String(r[2]??'').trim(),b=String(r[3]??'').trim(),st=String(r[4]??'').trim();
  if(!kind||!a||/^(inactive|in-active|no|0|false|disabled)$/i.test(st))return;
  if(/^suppliers?$/i.test(kind)){if(!su.some(x=>norm(x)===norm(a)))su.push(a);return;}

<script>
/* shared/permGate.js — front-end permission gate: disables denied buttons, blocks denied clicks and shows the "Permission not granted" label */
PermGate.init({
  dataset:'ap2_ledger',
  controls:[
    { sel:'[onclick*="saveRow("]',      need:'add',            fn:'saveRow' },     /* Save one row */
    { sel:'[onclick^="rev("]',         need:'add&editDelete', fn:'rev' }          /* Reverse an allocation */
  ]
});
</script>
<script>
/* shared/syncQueue.js — offline hold & sync + cache / sync buttons */
AP2Sync.init({
  key:'allocation',
  queue:[],                                     /* allocation depends on the live ledger → needs the network */
  online:['addCharges','addAllocations','reverseBill'],
  state:()=> ready() ? {state:'ok',title:'Up to date'} : (S.state==='error' ? {state:'err',title:'Could not load — '+S.err} : {state:'warn',title:'Loading…'}),
  refresh:()=>{ S.booting=false; SV.forEach(applyFromIDB); }
});
</script>
</body>
</html>
