<style>
:root,[data-theme="dark"]{color-scheme:dark;--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--surface:#21262d;--border:#30363d;--border2:#444c56;--text:#e6edf3;--text2:#8b949e;--accent:#58a6ff;--accent-dim:rgba(88,166,255,.12);--teal:#39d353;--teal-dim:rgba(57,211,83,.12);--amber:#e3b341;--red:#f85149;--orange:#f0883e;--orange-dim:rgba(240,136,62,.12);--radius:8px;--radius-lg:12px;--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace}
[data-theme="light"]{color-scheme:light;--bg:#f0f2f5;--bg2:#fff;--bg3:#e8ecf0;--surface:#fff;--border:#c8d0d9;--border2:#9aa5b1;--text:#0d1117;--text2:#3d454f;--accent:#0550ae;--accent-dim:rgba(5,80,174,.12);--teal:#116329;--teal-dim:rgba(17,99,41,.13);--amber:#7d4e00;--red:#a8111b;--orange:#953800;--orange-dim:rgba(149,56,0,.13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
body{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.bar h1{font-size:15px;display:flex;align-items:center;gap:8px;margin-right:auto}
.tabs{display:flex;gap:4px}
.tab,.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-size:13px}
.tab{background:var(--bg3);color:var(--text2)}.tab.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.out{background:var(--orange-dim);color:var(--orange);border-color:var(--orange)}.btn.in{background:var(--teal-dim);color:var(--teal);border-color:var(--teal)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.sm{padding:3px 8px;font-size:12px}
.btn.dng.armed{background:var(--red);color:#fff;border-color:var(--red)}
main{flex:1;min-height:0;overflow:auto;padding:12px 14px}
input,select{font:inherit;font-size:13px;padding:7px 9px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);color:var(--text);width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tools{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}.tools input{max-width:320px}
.kpi{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}.kpi div{flex:1;min-width:150px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:9px 12px;font-size:12px;color:var(--text2)}.kpi b{display:block;font:600 16px var(--mono);color:var(--text);margin-top:2px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--bg2);border:1px solid var(--border);font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--bg3);color:var(--text2);font-weight:600;font-size:12px}
.n{text-align:right!important;font-family:var(--mono)}td.acts{white-space:nowrap;width:1%}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--text2)}
.badge.out,.badge.part{background:var(--orange-dim);color:var(--orange)}.badge.in,.badge.paid{background:var(--teal-dim);color:var(--teal)}.badge.unpaid{background:rgba(248,81,73,.12);color:var(--red)}
.mono{font-family:var(--mono)}.dim{color:var(--text2)}.neg{color:var(--red)}.warn{color:var(--amber);font-size:12px}
.empty{padding:36px;text-align:center;color:var(--text2)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:50}.ov.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:900px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.mh,.mf{padding:12px 16px;display:flex;align-items:center;gap:8px;flex:none}.mh{border-bottom:1px solid var(--border);font-weight:600}.mf{border-top:1px solid var(--border);justify-content:flex-end;flex-wrap:wrap}
.mh .x{margin-left:auto}.mf .sum{margin-right:auto;font:500 13px var(--mono)}
.mb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}.mb>*{flex-shrink:0}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.ib.ok{color:var(--teal)}.ib.err{color:var(--red)}.ib.warn{color:var(--amber)}
.ib{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer}
.ol{border:1px solid var(--border);border-radius:var(--radius-lg);max-height:260px;overflow:auto}
.opt{display:flex;gap:9px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}.opt:last-child{border-bottom:0}
.opt:hover{background:var(--accent-dim)}.opt.off{opacity:.5;cursor:not-allowed}.opt input{width:auto;margin-top:3px}.opt .b{flex:1;min-width:0}
.sec{font-size:12px;color:var(--text2);font-weight:600;display:flex;align-items:center;gap:8px}.sec .btn{margin-left:auto}
.rt{max-width:110px;margin-left:auto;font-family:var(--mono);text-align:right}
.tot{margin-left:auto;width:min(340px,100%);font-size:13px}.tot div{display:flex;justify-content:space-between;padding:3px 0}.tot .g{font:700 15px var(--mono);border-top:1px solid var(--border2);margin-top:4px;padding-top:6px}
.pr-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:8px;align-items:end}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border2);padding:9px 16px;border-radius:var(--radius);z-index:99;display:none;font-size:13px}.toast.error{border-color:var(--red);color:var(--red)}.toast.success{border-color:var(--teal)}
#pr{display:none}
@media(max-width:700px){.fg,.pr-row{grid-template-columns:1fr 1fr}.modal{border-radius:0;border:0}.ov{padding:0}.bar .btn .lbl{display:none}}
/* ── print: only the bill ── */
#pr,#pr *,#pv,#pv *{color:#000!important;background:#fff!important;font-family:Arial,sans-serif}
#pr{padding:8mm;font-size:12px}#pr h2{font-size:20px}#pr .hd{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
#pr table,#pv table{border:1px solid #000;margin:8px 0}#pr th,#pr td,#pv th,#pv td{border:1px solid #888;padding:5px 7px;font-size:12px}#pr th,#pv th{background:#eee!important}#pv .hd{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}#pv .tot{width:300px}#pv h2{font-size:20px}#pv{font-size:12px}
#pr .tot{width:300px}#pr .sig{display:flex;justify-content:space-between;margin-top:50px}#pr .sig span{border-top:1px solid #000;padding-top:4px;width:30%;text-align:center}
@media print{@page{margin:8mm}body>*:not(#pr){display:none!important}html,body{height:auto;overflow:visible}#pr{display:block}}
.seg{display:inline-flex}.seg .tab{border-radius:0}.seg .tab:first-child{border-radius:8px 0 0 8px}.seg .tab:last-child{border-radius:0 8px 8px 0}.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px}@media(max-width:800px){.cols{grid-template-columns:1fr}}.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px}.rcp{display:flex;gap:8px;align-items:center;padding:7px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer}.rcp.on{border-color:var(--accent);background:var(--accent-dim)}td input{max-width:120px;text-align:right}
</style>
</head>
<body>
<div class="bar"><h1><i class="ti ti-arrows-split"></i>Amount Allocation</h1></div>
<main><div class="tools"><input id="party" list="dl" placeholder="Party name (customer / supplier)…" oninput="setParty(this.value)"/><datalist id="dl"></datalist>
<span class="seg"><button class="tab on" id="m-auto" onclick="setMode('auto')">Automatic (FIFO)</button><button class="tab" id="m-man" onclick="setMode('man')">Manual</button></span></div>
<div class="cols"><div class="card"><b>1. Receipt / payment to allocate</b><div id="rc" style="margin-top:8px"></div></div>
<div class="card"><b>2. Open items <span class="dim" style="font-weight:400">(oldest first)</span></b><div class="tw" id="items" style="margin-top:8px"></div>
<div class="tools" style="margin-top:10px"><span class="mono" id="ctr"></span><input id="cm" placeholder="Comments (optional)" style="max-width:260px;margin-left:auto"/><button class="btn pri" id="sv" onclick="save()"><i class="ti ti-device-floppy"></i>Save allocation</button></div></div></div>
<h3 style="margin:16px 0 8px;font-size:14px">Allocation history for this party</h3><div class="tw" id="hist"></div></main>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ═══ LEDGER STORE — local-cache mode (no backend). Same data shape as the Apps Script backend,
   so going live later = set USE_BACKEND=true (and re-enable the shared scripts in <head>). ═══ */
const USE_BACKEND=false;
const Ledger=USE_BACKEND?{get:()=>AP2Api.get('ledger'),post:(a,p)=>AP2Api.post(a,p)}:(()=>{
 const KEY='acc_ledger_v1',H={
  Charges:['ChargeID','Type','BillID','BillNo','OrderID','OrderNo','PartyType','Party','Dir','Date','Description','Amount','Comments','Created'],
  Receipts:['PaymentID','ReceiptNo','Dir','PartyType','Party','Date','Mode','Ref','Amount','Comments','Type','Created'],
  Allocations:['AllocID','PaymentID','ReceiptNo','BillID','BillNo','ChargeID','OrderID','OrderNo','PartyType','Party','Date','Amount','Comments','Reverses','Created']};
 const rd=()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.Charges&&j.Receipts&&j.Allocations)return j;}catch(e){}return{Charges:[H.Charges],Receipts:[H.Receipts],Allocations:[H.Allocations]};};
 const wr=j=>{try{localStorage.setItem(KEY,JSON.stringify(j));}catch(e){throw new Error('Browser storage is full or blocked — export a backup and clear space');}};
 const R=n=>Math.round((+n||0)*100)/100,now=()=>new Date().toISOString(),uid=(p,i)=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+(i||0);
 const sm=(a,f)=>R(a.reduce((s,x)=>s+f(x),0));
 return{
  async get(){return rd();},
  async post(action,p){const j=rd();
   if(action==='addCharges'){
    const rows=(p.rows||[]).map((c,i)=>{if(!c.party)throw new Error('Party missing');return[uid('C',i),c.type||'Order',c.billId||'',c.billNo||'',c.orderId||'',c.orderNo||'',c.ptype||'',c.party,c.dir||'out',c.date,c.desc||'',R(c.amount),c.comments||'',now()];});
    j.Charges.push(...rows);wr(j);return{count:rows.length};}
   if(action==='addReceipt'){const r=p.receipt;if(!r.party||!(+r.amount>0))throw new Error('Party and amount required');
    const no=(r.dir==='in'?'P-':'R-')+String(j.Receipts.length).padStart(4,'0');
    j.Receipts.push([r.id||uid('P'),no,r.dir||'out',r.ptype||'',r.party,r.date,r.mode||'',r.ref||'',R(r.amount),r.comments||'',r.type||'Receipt',now()]);wr(j);return{receipt:{id:r.id,no}};}
   if(action==='addAllocations'){
    const rec=j.Receipts.slice(1).find(x=>x[0]==p.paymentId);if(!rec)throw new Error('Receipt not found');
    const al=j.Allocations.slice(1);let rem=R(rec[8]-sm(al.filter(a=>a[1]==rec[0]),a=>+a[11]));const out=[];
    (p.rows||[]).forEach((x,i)=>{const ch=j.Charges.slice(1).find(c=>c[0]==x.chargeId);if(!ch)throw new Error('Charge not found');
     if(ch[7]!=rec[4])throw new Error('Charge belongs to another party');
     const amt=R(x.amount),due=R(ch[11]-sm(al.filter(a=>a[5]==ch[0]),a=>+a[11])-sm(out.filter(o=>o[5]==ch[0]),o=>o[11]));
     if(amt>0){if(amt>rem+.005)throw new Error('More than receipt balance');if(amt>due+.005)throw new Error('More than due on '+(ch[5]||ch[10]));}
     rem=R(rem-amt);out.push([uid('A',i),rec[0],rec[1],ch[2],ch[3],ch[0],ch[4],ch[5],ch[6],ch[7],p.date,amt,x.comments||'',x.reverses||'',now()]);});
    j.Allocations.push(...out);wr(j);return{count:out.length};}
   throw new Error('Unknown action');},
  backup(){return JSON.stringify(rd());},
  restore(t){const j=JSON.parse(t);if(!(j&&j.Charges&&j.Receipts&&j.Allocations))throw new Error('Not a ledger backup');wr(j);}
 };})();
const CUR='AED',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),r2=n=>Math.round((+n||0)*100)/100;
const today=()=>new Date().toISOString().slice(0,10),post=(a,p)=>Ledger.post(a,p),errText=m=>String(m);
function showToast(m,t){const e=$('toast');e.textContent=m;e.className='toast '+(t||'');e.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.style.display='none',t==='error'?9000:3000);}
let L={Charges:[],Receipts:[],Allocations:[]};
const rw=(a,h)=>(a||[]).filter(r=>Array.isArray(r)&&r[0]!==''&&String(r[0])!==h);
function data(){
 const al=rw(L.Allocations,'AllocID').map(a=>({id:String(a[0]),pid:String(a[1]),rno:a[2],billNo:a[4],cid:String(a[5]),orderNo:a[7],party:a[9],date:String(a[10]),amt:+a[11]||0,note:a[12],rev:String(a[13]||'')}));
 const bC={},bP={};al.forEach(a=>{bC[a.cid]=r2((bC[a.cid]||0)+a.amt);bP[a.pid]=r2((bP[a.pid]||0)+a.amt);});
 const ch=rw(L.Charges,'ChargeID').map(c=>({id:String(c[0]),type:c[1],billNo:String(c[3]||''),orderNo:String(c[5]||''),ptype:c[6],party:String(c[7]),dir:c[8],date:String(c[9]),desc:c[10],amt:+c[11]||0,note:c[12]})).map(c=>({...c,paid:bC[c.id]||0,due:r2(c.amt-(bC[c.id]||0))}));
 const rc=rw(L.Receipts,'PaymentID').map(r=>({id:String(r[0]),no:r[1],dir:r[2],party:String(r[4]),date:String(r[5]),mode:r[6],ref:r[7],amt:+r[8]||0,note:r[9],type:r[10]})).map(r=>({...r,alloc:bP[r.id]||0,un:r2(r.amt-(bP[r.id]||0))}));
 return{al,ch,rc};}
const fifo=(a,b)=>a.date.localeCompare(b.date)||((b.type==='Opening')-(a.type==='Opening'))||a.billNo.localeCompare(b.billNo)||a.id.localeCompare(b.id);
async function load(){try{const j=await Ledger.get();L={Charges:j.Charges||[],Receipts:j.Receipts||[],Allocations:j.Allocations||[]};}
 catch(e){showToast('Ledger not reachable — add the Accounts backend: '+errText(e.message),'error');}after();}
load();

let party='',rid=null,mode='auto',amts={},busy=false;
const D=()=>data();
function after(){const d=D();$('dl').innerHTML=[...new Set([...d.ch.map(c=>c.party),...d.rc.map(r=>r.party)])].sort().map(n=>`<option value="${esc(n)}">`).join('');render();}
function setParty(v){party=v.trim();rid=null;amts={};render();}
function setMode(m){mode=m;if(m==='auto')fill();render();}
function cur(){const d=D();return{d,r:d.rc.find(x=>x.id===rid&&x.party===party),R:d.rc.filter(r=>r.party===party&&r.un>.005)};}
function open_(d,r){return d.ch.filter(c=>c.party===party&&r&&c.dir===r.dir&&c.due>.005).sort(fifo);}
function fill(){const{d,r}=cur();amts={};if(!r)return;let rem=r.un;open_(d,r).forEach(c=>{const a=Math.min(c.due,rem);if(a>.005){amts[c.id]=r2(a);rem=r2(rem-a);}});}
function pickR(id){rid=id;if(mode==='auto')fill();else amts={};render();}
function sum(){return r2(Object.values(amts).reduce((a,x)=>a+(+x||0),0));}
function ctr(){const{r}=cur();if(!r){$('ctr').textContent='';return;}const u=r2(r.un-sum());$('ctr').innerHTML=`Allocating ${money(sum())} of ${money(r.un)} · <span class="${u<-.005?'neg':''}">Left (advance): ${money(u)}</span>`;}
function render(){const{d,r,R}=cur();
 $('m-auto').classList.toggle('on',mode==='auto');$('m-man').classList.toggle('on',mode==='man');
 $('rc').innerHTML=!party?'<div class="empty">Enter a party name</div>':R.length?R.map(x=>`<div class="rcp${x.id===rid?' on':''}" onclick="pickR('${x.id}')"><input type="radio" ${x.id===rid?'checked':''}/><div><b class="mono">${esc(x.no)}</b> <span class="badge ${x.dir}">${x.dir==='out'?'In':'Out'}</span><div class="dim" style="font-size:12px">${esc(x.date)} · ${esc(x.mode||'')} ${esc(x.note||'')}</div></div><div class="mono" style="margin-left:auto">${money(x.un)}</div></div>`).join(''):'<div class="empty">No unallocated receipts for this party</div>';
 const I=open_(d,r),ro=mode==='auto'?'readonly':'';
 $('items').innerHTML=!r?'<div class="empty">Select a receipt</div>':I.length?`<table><thead><tr><th>Date</th><th>Bill</th><th>Order / item</th><th class="n">Charge</th><th class="n">Due</th><th class="n">Allocate</th></tr></thead><tbody>${I.map(c=>`<tr><td>${esc(c.date)}</td><td class="mono">${esc(c.billNo)||'–'} ${c.type!=='Order'?`<span class="badge">${esc(c.type)}</span>`:''}</td><td>${esc(c.orderNo||c.desc)}</td><td class="n">${money(c.amt)}</td><td class="n">${money(c.due)}</td><td><input type="number" min="0" step="any" ${ro} value="${amts[c.id]||''}" oninput="amts['${c.id}']=Math.min(+this.value||0,${c.due});ctr()" onchange="if(+this.value>${c.due})this.value=${c.due}"/></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No open charges for this party</div>';
 ctr();
 const rv=new Set(d.al.filter(a=>a.rev).map(a=>a.rev)),H=d.al.filter(a=>a.party===party).sort((a,b)=>b.id.localeCompare(a.id));
 $('hist').innerHTML=!party?'':H.length?`<table><thead><tr><th>Date</th><th>Receipt</th><th>Bill</th><th>Order</th><th class="n">Amount</th><th>Note</th><th></th></tr></thead><tbody>${H.map(a=>`<tr><td>${esc(a.date)}</td><td class="mono">${esc(a.rno)}</td><td class="mono">${esc(a.billNo)}</td><td>${esc(a.orderNo)}</td><td class="n ${a.amt<0?'neg':''}">${money(a.amt)}</td><td>${esc(a.note)}${a.rev?' <span class="badge unpaid">Reversal</span>':rv.has(a.id)?' <span class="badge">Reversed</span>':''}</td><td class="acts">${a.amt>0&&!rv.has(a.id)?`<button class="btn sm dng" onclick="rev('${a.id}')">Reverse</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No allocations yet</div>';}
async function save(){if(busy)return;const{r}=cur();if(!r)return showToast('Select a receipt','error');
 const rows=Object.entries(amts).filter(([k,v])=>+v>0).map(([k,v])=>({chargeId:k,amount:r2(v),comments:$('cm').value.trim()}));
 if(!rows.length)return showToast('Nothing to allocate','error');if(sum()>r.un+.005)return showToast('More than the receipt balance','error');
 busy=true;try{await post('addAllocations',{paymentId:r.id,date:today(),rows});amts={};rid=null;await load();showToast('Allocation saved','success');}catch(e){showToast('Not saved: '+errText(e.message),'error');}busy=false;}
async function rev(id){const a=D().al.find(x=>x.id===id);if(!a||!confirm('Reverse this allocation of '+money(a.amt)+'? A negative row is added; the original stays.'))return;
 try{await post('addAllocations',{paymentId:a.pid,date:today(),rows:[{chargeId:a.cid,amount:-a.amt,reverses:a.id,comments:'Reversal of '+a.id}]});await load();showToast('Reversed','success');}catch(e){showToast('Not reversed: '+errText(e.message),'error');}}
