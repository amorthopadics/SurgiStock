<style>
/* ═══ THEME — identical to Master Setup ═══ */
:root,[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--surface:#21262d;--surface2:#2d333b;--border:#30363d;--border2:#444c56;--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;--accent:#58a6ff;--accent-dim:rgba(88,166,255,.12);--accent-glow:rgba(88,166,255,.28);--teal:#39d353;--teal-dim:rgba(57,211,83,.12);--amber:#e3b341;--amber-dim:rgba(227,179,65,.12);--red:#f85149;--red-dim:rgba(248,81,73,.12);--purple:#a371f7;--radius:8px;--radius-lg:12px;--radius-xl:16px;--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;--shadow:0 1px 3px rgba(0,0,0,.4);--shadow-lg:0 8px 32px rgba(0,0,0,.6)}
[data-theme="light"]{--bg:#f0f2f5;--bg2:#fff;--bg3:#e8ecf0;--surface:#fff;--surface2:#e2e7ed;--border:#c8d0d9;--border2:#9aa5b1;--text:#0d1117;--text2:#3d454f;--text3:#5a6370;--accent:#0550ae;--accent-dim:rgba(5,80,174,.12);--accent-glow:rgba(5,80,174,.22);--teal:#116329;--teal-dim:rgba(17,99,41,.13);--amber:#7d4e00;--amber-dim:rgba(125,78,0,.13);--red:#a8111b;--red-dim:rgba(168,17,27,.11);--purple:#6639c8;--shadow:0 1px 3px rgba(0,0,0,.10);--shadow-lg:0 8px 32px rgba(0,0,0,.15)}
[data-theme="purple"]{--bg:#0f0b1e;--bg2:#17112e;--bg3:#1e1840;--surface:#221a3a;--surface2:#2c2250;--border:#3a2e5e;--border2:#5a4890;--text:#e8e0ff;--text2:#a899d4;--text3:#7a6ca8;--accent:#c084fc;--accent-dim:rgba(192,132,252,.14);--accent-glow:rgba(192,132,252,.3);--teal:#4ade80;--teal-dim:rgba(74,222,128,.12);--amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);--red:#f87171;--red-dim:rgba(248,113,113,.12)}
[data-theme="ocean"]{--bg:#071520;--bg2:#0d2035;--bg3:#112840;--surface:#143050;--surface2:#1a3d60;--border:#1e4a72;--border2:#2e6a9e;--text:#d6eeff;--text2:#7db8e8;--text3:#4a87b8;--accent:#38bdf8;--accent-dim:rgba(56,189,248,.14);--accent-glow:rgba(56,189,248,.3);--teal:#34d399;--teal-dim:rgba(52,211,153,.12);--amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);--red:#f87171;--red-dim:rgba(248,113,113,.12)}
[data-theme="slate"]{--bg:#0e1117;--bg2:#1a1f28;--bg3:#222836;--surface:#28303e;--surface2:#313c4e;--border:#3a4556;--border2:#556070;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#60a5fa;--accent-dim:rgba(96,165,250,.13);--accent-glow:rgba(96,165,250,.28);--teal:#4ade80;--teal-dim:rgba(74,222,128,.12);--amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);--red:#f87171;--red-dim:rgba(248,113,113,.12)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
body{display:flex;flex-direction:column}
.portal-wrap{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;max-width:1600px;margin:0 auto;padding:10px;gap:8px}
/* view bar */
.view-bar{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.vb-brand{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-lg);background:var(--accent-dim);color:var(--accent);border:1px solid var(--border);font-size:16px}
.tab-nav{display:flex;gap:3px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:3px}
.tab-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius);border:none;background:transparent;color:var(--text2);font:600 12px var(--font);cursor:pointer}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 0 10px var(--accent-glow)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border-radius:var(--radius-lg);background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:15px;line-height:1;cursor:pointer;transition:color .15s,border-color .15s}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.ib.sm{width:26px;height:26px;font-size:13px;border-radius:var(--radius)}
.ib.danger:hover{border-color:var(--red);color:var(--red)}.ib.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.cache-ind{margin-left:auto}.cache-ind,.cache-ind:hover,.sync-ind,.sync-ind:hover{background:none;border:0}
.cache-ind.ok{color:var(--teal)}.cache-ind.warn{color:var(--amber)}.cache-ind.busy i,.sync-ind.busy>i{animation:spin 1s linear infinite}
.sync-ind{position:relative;color:var(--red)}.sync-ind .ping{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.sync-ind .sync-n{position:absolute;bottom:-3px;right:-2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--red);color:#fff;font-size:9px;line-height:14px;text-align:center;font-family:var(--mono)}
@keyframes spin{to{transform:rotate(360deg)}}
/* split layout */
.main-split{flex:1;display:flex;gap:10px;min-height:0}
.doc-center{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.doc-center-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;flex-shrink:0;flex-wrap:wrap}
.doc-center-header h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}
.doc-center-header h3 i{color:var(--accent);font-size:17px}
.hist-tip{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.hdr-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.sbox{position:relative}.sbox i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.sbox input{padding-left:30px;width:210px}
.doc-center-body{flex:1;overflow-y:auto;padding:14px 16px}
.doc-center-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px;color:var(--text3);gap:10px;text-align:center}
.doc-center-placeholder i{font-size:34px;opacity:.3}
.doc-preview-panel{width:0;flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow);overflow:hidden;transition:width .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.doc-preview-panel.open{width:540px}
.pph{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;flex-shrink:0}
.pph h3{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap}.pph h3 i{color:var(--accent);font-size:16px}
.pph-close{margin-left:auto;width:26px;height:26px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.pph-close:hover{background:var(--red-dim);color:var(--red);border-color:var(--red)}
.ppb{flex:1;overflow-y:auto;padding:14px;min-width:440px}
.ppf{padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0;display:flex;justify-content:flex-end;gap:7px;min-width:440px}
/* form */
.form-stack{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.fgrp-lbl{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px}
.req{color:var(--red)}
.date-input{width:100%;padding:8px 11px;border:1.5px solid var(--border2);border-radius:var(--radius);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:12.5px}
.date-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.date-input.bad,.cb.bad .date-input{border-color:var(--red);box-shadow:0 0 0 3px var(--red-dim)}
.date-input:disabled{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font:600 12px var(--font);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.dis{opacity:.4;cursor:not-allowed}
.chips.bad{padding:6px;border:1px solid var(--red);border-radius:var(--radius-lg);box-shadow:0 0 0 3px var(--red-dim)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 86px 86px 28px;gap:8px;align-items:center}
.trow>.note{grid-column:1/-1}
.note{grid-column:1/-1}
.note{font-size:11px;color:var(--teal);min-height:0}
.cb{position:relative}
.dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface2);border:1.5px solid var(--border2);border-radius:var(--radius);max-height:240px;overflow-y:auto;z-index:300;display:none;box-shadow:var(--shadow-lg)}
.dd.open{display:block}
.di{padding:8px 12px;font-size:12.5px;cursor:pointer;font-weight:600}
.di small{display:block;font-weight:400;font-family:var(--mono);font-size:10.5px;color:var(--text3)}
.di.hi,.di:hover{background:var(--accent-dim)}.di.add{color:var(--accent)}.di.mute{color:var(--text3);cursor:default}
/* buttons / table */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1.5px solid;font:600 12.5px var(--font);cursor:pointer;white-space:nowrap;line-height:1}
.btn i{font-size:15px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow)}.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border2)}.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:11.5px}.btn:disabled{opacity:.5;pointer-events:none}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(163,113,247,.18);color:#a371f7;border:1px solid rgba(163,113,247,.3)}
.log-table{width:100%;border-collapse:collapse;font-size:12px}
.log-table th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--border);background:var(--bg3);cursor:pointer;white-space:nowrap;position:sticky;top:-14px;z-index:1}
.log-table th:hover{color:var(--accent)}.log-table th.r,.log-table td.r{text-align:right}
.log-table td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.log-table tbody tr:hover{background:var(--surface2)}
.num{font-family:var(--mono);font-weight:600}.mono{font-family:var(--mono);font-size:10.5px;color:var(--text3)}
.log-table td.acts{width:1%;white-space:nowrap}.act-btns{display:inline-flex;gap:4px}
.spec-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(88,166,255,.25);white-space:nowrap}
.toast{position:fixed;bottom:22px;right:22px;background:var(--surface2);color:var(--text);border:1px solid var(--border2);padding:10px 16px;border-radius:var(--radius-lg);font-size:12.5px;font-weight:500;z-index:999;opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:none}.toast.success{background:var(--teal-dim);color:var(--teal);border-color:rgba(57,211,83,.25)}.toast.error{background:var(--red-dim);color:var(--red);border-color:rgba(248,81,73,.25)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:500}
.ov .box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:16px;width:min(380px,92vw);display:flex;flex-direction:column;gap:12px}
@media(max-width:1100px){.doc-preview-panel.open{width:460px}.ppb,.ppf{min-width:0}}
@media(max-width:900px){.doc-preview-panel.open{position:fixed;inset:0;z-index:300;border-radius:0;width:100%!important}.ppb,.ppf{min-width:0}.hist-tip{display:none}.sbox input{width:140px}}
@media(max-width:480px){.btn .lbl{display:none}.trow{grid-template-columns:minmax(0,1fr) 1fr 28px}.trow>.cb{grid-column:1/-1}}
</style>
</head>
<body>
<div class="view-bar">
  <div class="vb-brand"><i class="ti ti-adjustments-dollar"></i></div>
  <div class="tab-nav"><button class="tab-btn active"><i class="ti ti-adjustments-dollar"></i><span>Rate Thresholds</span></button></div>
  <button class="ib cache-ind warn" id="cache-ind" type="button" title="Cache: waiting…"><i class="ti ti-database"></i></button>
  <button class="ib sync-ind" id="sync-ind" type="button" style="display:none"><i class="ti ti-cloud-upload"></i><span class="ping"></span><b class="sync-n">0</b></button>
</div>
<div class="portal-wrap"><div class="main-split">
  <div class="doc-center">
    <div class="doc-center-header">
      <h3><i class="ti ti-adjustments-dollar"></i>Rate Thresholds <span class="badge" id="cnt">0</span></h3>
      <span class="hist-tip"><i class="ti ti-info-circle"></i>Min / max amount per Type, Name and Item</span>
      <div class="hdr-actions">
        <div class="sbox"><i class="ti ti-search"></i><input class="date-input" id="q" placeholder="Search name or item…" autocomplete="off"/></div>
        <button class="btn btn-primary btn-sm" id="add" type="button"><i class="ti ti-plus"></i><span class="lbl">Add Threshold</span></button>
      </div>
    </div>
    <div class="doc-center-body"><div class="chips" id="flt" style="margin-bottom:12px"></div><div id="tbl"></div></div>
  </div>
  <div class="doc-preview-panel" id="panel"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* Master sheet: same endpoint + same cache record as Master Setup */
const API='https://script.google.com/macros/s/AKfycbwCnVKZkbWPLa-3YK0x_HiCI_IpINs5A1pfumst72EIpId6NAbbtlI1F4E8MA8T5XlHhQ/exec';
const PK='rate_pending_rows_v1',TK='rate_thresholds_v2',IDB='ap2_fleet_cache',ST='datasets';
let KEY='ap2_specsData';try{KEY=localStorage.getItem('master_cache_key')||KEY}catch(e){}
const $=id=>document.getElementById(id);
const rd=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase();
const toks=q=>String(q||'').toLowerCase().split(/[\s\-\u2013\u2014\/,;|]+/).filter(Boolean);
const f2=n=>(+n).toFixed(2),p2=n=>String(n).padStart(2,'0');
const tsId=t=>{const d=new Date(t);return''+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+p2(d.getHours())+p2(d.getMinutes())+p2(d.getSeconds())+String(d.getMilliseconds()).padStart(3,'0')};
const fmtDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
function toast(m,type){const t=$('toast');t.textContent=m;t.className='toast show '+(type||'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='toast',2800)}

/* ── cache: { Specs:[[ID, Specs, Item, Description, Status], …] } ── */
const pick=d=>{if(!d||typeof d!=='object'||Array.isArray(d))return null;const k=Object.keys(d).find(x=>/^specs$/i.test(x)&&Array.isArray(d[x]));return k?d[k]:null};
function idbRead(key){return new Promise(res=>{const t=setTimeout(()=>res(null),2500),q=indexedDB.open(IDB);q.onerror=()=>{clearTimeout(t);res(null)};q.onsuccess=e=>{clearTimeout(t);const db=e.target.result;if(!db.objectStoreNames.contains(ST))return res(null);const r=db.transaction(ST,'readonly').objectStore(ST).get(key);r.onsuccess=()=>res(r.result&&r.result.data||null);r.onerror=()=>res(null)}})}
async function readCache(){try{if(window.AP2CacheWatcher&&AP2CacheWatcher.readKey)return await AP2CacheWatcher.readKey(KEY)}catch(e){}return idbRead(KEY)}
let cacheRows=[],loaded=false,lastSig='',pending=rd(PK,[]),synced=[],SES=null;
function apply(payload){const r=pick(payload);if(!Array.isArray(r))return;loaded=true;const s=r.length+':'+JSON.stringify(r);if(s!==lastSig){lastSig=s;cacheRows=r;derive();refreshUI()}else setInd()}
async function refresh(){apply(await readCache())}
window.addEventListener('message',e=>{const m=e.data;if(!m)return;
  if(m.type==='ap-session-ready')SES={sessionId:m.sessionId,token:m.token};
  if(m.type==='ap-cache-preload'&&m.datasets){const k=m.datasets[KEY]?KEY:Object.keys(m.datasets).find(x=>pick(m.datasets[x]));if(k){KEY=k;apply(m.datasets[k])}}
  if(m.type==='ap-cache-ready'&&pick(m.data))apply(m.data);
  if(m.type==='ap-cache-updated')refresh()});
try{parent.postMessage({type:'ap-session-request'},'*');parent.postMessage({type:'ap-cache-request',key:KEY},'*')}catch(e){}

/* ── lists derived from the sheet ──
   row = [ID, Specs, Item, Description, Status]   e.g. [id, "Doctor", "Dr Amjid", "Customer", "Active"]
   Only rows whose Description (4th value) is "Customer"/"customer" are used for rate thresholds:
   Specs  → Type button (Doctor, Hospital, Vendor …)      Item → Name in the drop-down */
const ELIGIBLE='customer';
const ICONS={customer:'ti-user',vendor:'ti-truck-delivery',hospital:'ti-building-hospital',doctor:'ti-stethoscope'};
const IGN=/^(item\s*names?|item\s*lists?|item\s*categor(y|ies)|stores?|medical\s*domains?|material\s*sources?|specs)$/i,IL=/^item\s*lists?$/i;
const typeIcon=k=>ICONS[k]||'ti-tag';
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
let parties=[],items=[],domains=[],types=[],custWord='Customer';
const sameRow=(a,b)=>String(a[0])===String(b[0])||(norm(a[1])===norm(b[1])&&norm(a[2])===norm(b[2])&&(!IL.test(String(a[1]).trim())||norm(a[3])===norm(b[3])));
const allRows=()=>cacheRows.concat(pending,synced).filter((r,i,a)=>Array.isArray(r)&&a.findIndex(x=>Array.isArray(x)&&sameRow(x,r))===i);
function derive(){
  parties=[];items=[];domains=[];const T=new Map();
  allRows().forEach(r=>{
    const sid=String(r[0]).trim(),lab=String(r[1]==null?'':r[1]).trim(),nm=String(r[2]==null?'':r[2]).trim();
    if(!sid||!lab||!nm||sid.toLowerCase()==='id')return;
    const act=!/^(inactive|in-active|no|0|false|disabled)$/i.test(String(r[4]||'').trim()),dsc=String(r[3]==null?'':r[3]).trim();
    if(IL.test(lab)){if(dsc&&act)items.push({sid,label:dsc,domain:nm});return}
    if(/^medical\s*domains?$/i.test(lab)){if(act)domains.push({sid,name:nm});return}
    if(IGN.test(lab)||norm(dsc)!==ELIGIBLE)return;
    custWord=dsc;if(!act)return;
    const k=norm(lab),t=T.get(k);
    if(!t)T.set(k,{k,l:cap(lab)});else if(/^[a-z]/.test(t.l)&&/^[A-Z]/.test(lab))t.l=lab;
    parties.push({sid,name:nm,type:k});
  });
  types=[...T.values()].sort((a,b)=>a.l.localeCompare(b.l));
}

/* ── write to the Master sheet (same rules: timestamp ID · Active · no duplicates) ── */
function session(){let sid='',tok='';try{const raw=sessionStorage.getItem('ap_session')||localStorage.getItem('ap_session')||'';
  if(raw){try{const o=JSON.parse(raw);sid=o.sessionId||o.id||'';tok=o.token||''}catch(e){sid=raw}}
  sid=sid||sessionStorage.getItem('ap_sessionId')||localStorage.getItem('ap_sessionId')||'';tok=tok||sessionStorage.getItem('ap_token')||localStorage.getItem('ap_token')||''}catch(e){}
  if(!sid&&!tok&&SES){sid=SES.sessionId||'';tok=SES.token||''}return{sessionId:sid,token:tok}}
async function post(action,payload){const s=session();if(!s.sessionId&&!s.token)throw new Error('Not logged in');
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},s,payload))});
  const j=await res.json();if(!j||j.success===false)throw new Error((j&&j.error)||action+' failed');return j}
const errText=m=>/not logged in/i.test(m)?'You must be logged in to save to the sheet':/unauthori[sz]ed/i.test(m)?'Session expired — please log in again':/forbidden/i.test(m)?'You do not have permission for this action':/failed to fetch|network|load failed/i.test(m)?'Network error':String(m||'Unknown error');
let busy=false;
async function sync(manual){
  if(busy||!pending.length)return;busy=true;setInd();
  try{
    const sent=pending.slice(),j=await post('addSpecsSetting',{rows:sent.map(r=>({id:r[0],specs:r[1],item:r[2],description:r[3],status:r[4]}))});
    sent.forEach(r=>{const n=j.idMap&&j.idMap[r[0]];if(n!=null&&String(n)!==String(r[0])){rules.forEach(x=>{if(String(x.pSid)===String(r[0]))x.pSid=n;if(String(x.iSid)===String(r[0]))x.iSid=n});wr(TK,rules);r[0]=n}});
    pending=pending.filter(r=>!sent.includes(r));synced.push(...sent);wr(PK,pending);
    try{parent.postMessage({type:'ap-cache-request',key:KEY,force:true},'*')}catch(e){}
    if(manual)toast('Saved to Master sheet','success');
  }catch(e){const m=errText(e.message);if(manual||/logged in|expired|permission/i.test(m))toast('Not saved to sheet yet: '+m+' — will retry','error')}
  busy=false;derive();refreshUI();
}
function newRow(lab,name,desc){
  let t=Date.now(),id=tsId(t);const used=new Set(allRows().map(r=>String(r[0])));while(used.has(id))id=tsId(++t);
  const r=[id,lab,name,desc||'','Active'];pending.push(r);wr(PK,pending);derive();refreshUI();sync(false);return r}
const ready=()=>loaded||(toast('Cache not loaded yet — wait a moment before adding','error'),false);
function askSelect(title,sub,lab,opts,okText){return new Promise(res=>{const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="box"><h3 style="font-size:13px">${esc(title)}</h3><div style="font-size:12px;color:var(--text2)">${esc(sub)}</div><div class="field"><label>${esc(lab)} <span class="req">*</span></label><select class="date-input">${opts.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div><div style="display:flex;justify-content:flex-end;gap:7px"><button class="btn btn-ghost" data-v="0">Cancel</button><button class="btn btn-primary" data-v="1">${esc(okText)}</button></div></div>`;
  document.body.appendChild(ov);ov.onclick=e=>{const v=e.target.dataset.v;if(v==null&&e.target!==ov)return;const x=ov.querySelector('select').value;ov.remove();res(v==='1'?x:null)}})}
async function addParty(name){
  if(!ready())return null;const t=types.find(x=>x.k===draft.type);if(!t){toast('Choose a Type first','error');return null}
  if(allRows().some(r=>!IL.test(String(r[1]).trim())&&norm(r[1])===t.k&&norm(r[2])===norm(name))){toast(name+' already exists in '+t.l+' (check it is Active and marked Customer in Master)','error');return null}
  const r=newRow(t.l,name,custWord);toast('Added to Master sheet under '+t.l,'success');return{text:name,sid:r[0],type:t.k}}
async function addItem(label){
  if(!ready())return null;if(!domains.length){toast('Add a Medical Domain in Master Setup first','error');return null}
  const dom=await askSelect('Add item to Master sheet',label,'Medical Domain',domains.map(d=>d.name),'Add item');if(!dom)return null;
  if(allRows().some(r=>IL.test(String(r[1]).trim())&&norm(r[2])===norm(dom)&&norm(r[3])===norm(label))){toast('Already in the Item List for '+dom,'error');return null}
  const r=newRow('Item List',dom,label);toast('Item added to Master sheet','success');return{text:label,sub:dom,sid:r[0]}}

/* ── searchable drop-down with "+ Add" ── */
function combo(host,o){
  host.innerHTML='<input class="date-input" autocomplete="off" placeholder="'+o.ph+'"/><div class="dd"></div>';
  const inp=host.firstChild,dd=host.lastChild;let cur=[],hi=-1,sel=null;
  const close=()=>{dd.classList.remove('open');hi=-1};
  function draw(q){const tk=toks(q),all=o.list(),m=all.filter(x=>tk.every(w=>(x.text+' '+(x.sub||'')).toLowerCase().includes(w)));
    cur=m.slice(0,60).map(x=>({x}));if(q.trim()&&!all.some(x=>norm(x.text)===norm(q)))cur.push({add:q.trim()});
    dd.innerHTML=cur.map((c,i)=>c.add?`<div class="di add${i===hi?' hi':''}" data-i="${i}">+ Add “${esc(c.add)}”</div>`:`<div class="di${i===hi?' hi':''}" data-i="${i}">${esc(c.x.text)}${c.x.sub?`<small>${esc(c.x.sub)}</small>`:''}</div>`).join('')||'<div class="di mute">Type to search or add</div>';
    dd.classList.add('open')}
  function set(it){sel=it;inp.value=it?it.text:'';close();o.onPick(it)}
  function choose(c){if(!c)return;if(c.add){Promise.resolve(o.onAdd(c.add)).then(it=>{if(it)set(it);else inp.focus()})}else set(c.x)}
  inp.onfocus=()=>{inp.select();draw('')};
  inp.oninput=()=>{if(sel&&inp.value!==sel.text){sel=null;o.onPick(null)}hi=-1;draw(inp.value)};
  inp.onblur=()=>setTimeout(()=>{close();inp.value=sel?sel.text:''},150);
  inp.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!dd.classList.contains('open'))draw(inp.value);hi=Math.max(0,Math.min(cur.length-1,hi+(e.key==='ArrowDown'?1:-1)));draw(sel?'':inp.value);const h=dd.querySelector('.hi');h&&h.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();choose(cur[hi>=0?hi:0])}else if(e.key==='Escape'&&dd.classList.contains('open')){e.stopPropagation();close()}};
  dd.onmousedown=e=>{e.preventDefault();const d=e.target.closest('.di');if(d&&d.dataset.i!=null)choose(cur[+d.dataset.i])};
  return{set,get:()=>sel,focus:()=>inp.focus(),input:inp};
}

/* ── thresholds ── */
let rules=rd(TK,[]),armed=null;
const ui={q:'',type:'',sortKey:'p',asc:true};
const findRule=(p,i)=>rules.find(x=>String(x.pSid)===String(p)&&String(x.iSid)===String(i));
window.RateThreshold={get:(p,i)=>{const r=findRule(p,i);return r?{min:r.min,max:r.max}:null},
  check:(p,i,rate)=>{const r=findRule(p,i);return r?{found:true,ok:rate>=r.min&&rate<=r.max,min:r.min,max:r.max}:{found:false,ok:true}}};
const tName=k=>(types.find(t=>t.k===k)||{l:k}).l;
const live=r=>{const p=parties.find(x=>String(x.sid)===String(r.pSid)),i=items.find(x=>String(x.sid)===String(r.iSid));return{p:p?p.name:r.pName,i:i?i.label:r.iLabel}};

function renderTable(){
  const tk=toks(ui.q),all=rules;
  const tcount=k=>all.filter(r=>r.pType===k).length,used=types.filter(t=>tcount(t.k));
  $('flt').innerHTML=all.length?`<button class="chip${!ui.type?' on':''}" data-t="">All <b>${all.length}</b></button>`+used.map(t=>`<button class="chip${ui.type===t.k?' on':''}" data-t="${t.k}"><i class="ti ${typeIcon(t.k)}"></i>${esc(t.l)} <b>${tcount(t.k)}</b></button>`).join(''):'';
  const rs=all.filter(r=>{const l=live(r);return(!ui.type||r.pType===ui.type)&&tk.every(w=>(l.p+' '+l.i+' '+tName(r.pType)).toLowerCase().includes(w))});
  const val=r=>{const l=live(r);return ui.sortKey==='p'?l.p:ui.sortKey==='t'?tName(r.pType):ui.sortKey==='i'?l.i:ui.sortKey==='min'?r.min:ui.sortKey==='max'?r.max:r.ts};
  rs.sort((a,b)=>{const x=val(a),y=val(b),d=ui.asc?1:-1;return(typeof x==='number'?x-y:String(x).localeCompare(String(y),undefined,{sensitivity:'base'}))*d||live(a).i.localeCompare(live(b).i)});
  $('cnt').textContent=rs.length+(rs.length!==all.length?' / '+all.length:'');
  if(!rs.length){$('tbl').innerHTML=`<div class="doc-center-placeholder"><i class="ti ${all.length?'ti-search-off':'ti-adjustments-dollar'}"></i><span>${all.length?'No records match your filter':'No rate thresholds added yet'}</span>${all.length?'':'<button class="btn btn-primary btn-sm" data-a="new"><i class="ti ti-plus"></i> Add Threshold</button>'}</div>`;return}
  const th=(k,l,c)=>`<th class="${c||''}" data-s="${k}">${l}${ui.sortKey===k?`<i class="ti ti-chevron-${ui.asc?'up':'down'}" style="font-size:11px;margin-left:3px"></i>`:''}</th>`;
  $('tbl').innerHTML=`<table class="log-table"><thead><tr><th style="cursor:default">#</th>${th('p','Name')}${th('t','Type')}${th('i','Item')}${th('min','Min','r')}${th('max','Max','r')}${th('ts','Updated')}<th style="cursor:default"></th></tr></thead><tbody>${rs.map((r,n)=>{const l=live(r),a=armed===r.id;
    return`<tr><td class="mono">${n+1}</td><td><strong>${esc(l.p)}</strong></td><td><span class="spec-chip"><i class="ti ${typeIcon(r.pType)}"></i>${esc(tName(r.pType))}</span></td><td>${esc(l.i)}</td><td class="r num">${f2(r.min)}</td><td class="r num">${f2(r.max)}</td><td class="mono">${fmtDate(r.ts)}</td>
    <td class="acts"><div class="act-btns"><button class="ib sm" title="Edit" data-e="${r.id}"><i class="ti ti-pencil"></i></button><button class="ib sm danger ${a?'armed':''}" title="${a?'Click again to confirm':'Delete'}" data-d="${r.id}"><i class="ti ti-${a?'check':'trash'}"></i></button></div></td></tr>`}).join('')}</tbody></table>`}

/* ── side window ── */
let draft=null,pcomb=null,rcombs=[];
const blank=type=>({id:null,type:type||'',party:null,rows:[{item:null,min:'',max:''}],errs:null});
function openPanel(id){
  if(id){const r=rules.find(x=>x.id===id);if(!r)return;const l=live(r);
    draft={id,type:r.pType,party:{text:l.p,sid:r.pSid,type:r.pType},rows:[{item:{text:l.i,sid:r.iSid},min:r.min,max:r.max}],errs:null}}
  else draft=blank(ui.type&&types.some(t=>t.k===ui.type)?ui.type:'');
  renderPanel();$('panel').classList.add('open');
  setTimeout(()=>{if(draft&&draft.type&&!draft.id&&pcomb)pcomb.focus()},280)}
function closePanel(){$('panel').classList.remove('open');draft=null}
function renderPanel(){
  const d=draft,edit=!!d.id,E=d.errs||{rows:{}},t=types.find(x=>x.k===d.type);
  const chip=m=>`<button type="button" class="chip${d.type===m.k?' on':''}${edit&&d.type!==m.k?' dis':''}" data-v="${m.k}"${edit?' disabled':''}><i class="ti ${typeIcon(m.k)}"></i>${esc(m.l)}</button>`;
  $('panel').innerHTML=`<div class="pph"><h3><i class="ti ti-forms"></i><span>${edit?'Edit Rate Threshold':'Add Rate Threshold'}</span></h3><button class="pph-close" data-a="close" title="Close"><i class="ti ti-x"></i></button></div>
  <div class="ppb"><div class="form-stack">
    <div class="field"><label>Type <span class="req">*</span></label><div class="chips${E.t?' bad':''}">${types.length?types.map(chip).join(''):'<span style="font-size:12px;color:var(--text3)">No entries with Description “Customer” found in the sheet yet.</span>'}</div></div>
    <div class="field"><label>Name <span class="req">*</span></label><div class="cb${E.p?' bad':''}" id="pcb"></div></div>
    <div class="field"><div class="fgrp-lbl"><i class="ti ti-package"></i>Items &amp; amounts <span class="req">*</span>${edit?'':'<button class="btn btn-ghost btn-sm" type="button" data-a="addrow" style="margin-left:auto"><i class="ti ti-plus"></i> Add item</button>'}</div>
      <div class="form-stack" style="gap:8px">${d.rows.map((r,i)=>{const e=E.rows[i]||{};return`<div class="trow">
        <div class="cb${e.item?' bad':''}" data-ri="${i}"></div>
        <input class="date-input${e.min?' bad':''}" data-ri="${i}" data-f="min" type="number" min="0" step="0.01" placeholder="Min" value="${esc(r.min)}"/>
        <input class="date-input${e.max?' bad':''}" data-ri="${i}" data-f="max" type="number" min="0" step="0.01" placeholder="Max" value="${esc(r.max)}"/>
        ${d.rows.length>1&&!edit?`<button class="ib sm danger" type="button" data-a="delrow" data-i="${i}" title="Remove item"><i class="ti ti-trash"></i></button>`:'<span></span>'}
        <div class="note" id="note-${i}"></div></div></div>`}).join('')}</div></div>
  </div></div>
  <div class="ppf"><button class="btn btn-ghost" type="button" data-a="close">Cancel</button>${edit?'':'<button class="btn btn-ghost" type="button" data-a="saveadd"><i class="ti ti-plus"></i> Save &amp; Add Another</button>'}<button class="btn btn-primary" type="button" data-a="save"><i class="ti ti-device-floppy"></i> ${edit?'Update':'Save'}</button></div>`;
  pcomb=combo($('pcb'),{ph:d.type?'Search or add name…':'Choose a Type first',
    list:()=>d.type?parties.filter(p=>p.type===d.type).map(p=>({text:p.name,sid:p.sid,type:p.type})):[],
    onPick:p=>{d.party=p;rcombs.forEach((_,i)=>prefill(i))},onAdd:addParty});
  if(d.party)pcomb.set(d.party);if(edit||!d.type)pcomb.input.disabled=true;
  rcombs=d.rows.map((r,i)=>{const c=combo(document.querySelector('.cb[data-ri="'+i+'"]'),{ph:'Item '+(i+1)+' — search or add item…',
    list:()=>items.map(x=>({text:x.label,sub:x.domain,sid:x.sid})),onPick:it=>{r.item=it;prefill(i)},onAdd:addItem});
    if(r.item)c.set(r.item);return c});
}
function prefill(i){
  const d=draft,r=d.rows[i],n=$('note-'+i);if(!n)return;n.textContent='';
  if(!d.party||!r.item)return;const ex=findRule(d.party.sid,r.item.sid);if(!ex||ex.id===d.id)return;
  r.min=ex.min;r.max=ex.max;document.querySelectorAll('input[data-ri="'+i+'"]').forEach(x=>x.value=ex[x.dataset.f]);
  n.textContent='Existing threshold loaded — saving will update it.'}
function saveDraft(another){
  if(!ready())return;const d=draft,E={t:!d.type,p:!!d.type&&!d.party,rows:{}};let msg='';
  const rows=d.rows.map((r,i)=>({i,r})).filter(x=>x.r.item||x.r.min!==''||x.r.max!==''||d.rows.length===1);
  const seen=new Set();
  rows.forEach(({i,r})=>{const e={};
    if(!r.item)e.item=1;else{const k=String(r.item.sid);if(seen.has(k)){e.item=1;msg='Same item added twice'}seen.add(k);
      if(d.party){const ex=findRule(d.party.sid,r.item.sid);if(d.id&&ex&&ex.id!==d.id){e.item=1;msg='A threshold for this name and item already exists'}}}
    const mn=r.min,mx=r.max;if(mn===''||isNaN(+mn)||+mn<0)e.min=1;if(mx===''||isNaN(+mx)||+mx<0)e.max=1;
    if(!e.min&&!e.max&&+mn>+mx){e.min=e.max=1;msg='Minimum cannot be more than maximum'}
    if(Object.keys(e).length)E.rows[i]=e});
  if(E.t||E.p||Object.keys(E.rows).length){d.errs=E;renderPanel();toast(msg||(E.t?'Choose a Type':E.p?'Choose a name':'Fill the highlighted fields'),'error');return}
  const now=Date.now();let n=0;
  rows.forEach(({r})=>{const rec={id:d.id||String(now)+'_'+n,pSid:d.party.sid,pType:d.party.type||d.type,pName:d.party.text,iSid:r.item.sid,iLabel:r.item.text,min:+r.min,max:+r.max,ts:now};
    if(d.id){rules[rules.findIndex(x=>x.id===d.id)]=rec}else{const old=findRule(rec.pSid,rec.iSid);if(old){rec.id=old.id;rules[rules.indexOf(old)]=rec}else rules.push(rec)}n++});
  wr(TK,rules);renderTable();toast(n+' threshold'+(n>1?'s':'')+' saved','success');
  if(another){const t=d.type;draft=blank(t);renderPanel();pcomb.focus()}else closePanel()}

/* ── UI wiring ── */
function setInd(){const c=$('cache-ind');c.className='ib cache-ind '+(loaded?'ok':'warn')+(busy?' busy':'');c.title=loaded?'Cache loaded · '+cacheRows.length+' rows — click to reload':'Cache: waiting…';
  const s=$('sync-ind');s.style.display=pending.length?'':'none';s.classList.toggle('busy',busy);s.querySelector('.sync-n').textContent=pending.length;s.title=pending.length+' change(s) waiting to sync to the sheet — click to retry'}
function refreshUI(){setInd();renderTable()}
$('add').onclick=()=>openPanel();
$('q').oninput=e=>{ui.q=e.target.value;renderTable()};
$('flt').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;ui.type=b.dataset.t;renderTable()};
$('tbl').onclick=e=>{
  const th=e.target.closest('th[data-s]');if(th){ui.asc=ui.sortKey===th.dataset.s?!ui.asc:true;ui.sortKey=th.dataset.s;return renderTable()}
  if(e.target.closest('[data-a="new"]'))return openPanel();
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.e)openPanel(b.dataset.e);
  if(b.dataset.d){if(armed===b.dataset.d){rules=rules.filter(x=>x.id!==armed);armed=null;wr(TK,rules);toast('Threshold deleted','success')}else{armed=b.dataset.d;clearTimeout(renderTable._t);renderTable._t=setTimeout(()=>{armed=null;renderTable()},2800)}renderTable()}};
$('panel').addEventListener('click',e=>{
  const c=e.target.closest('.chip[data-v]');if(c&&!c.disabled){draft.type=c.dataset.v;draft.party=null;draft.errs=null;renderPanel();pcomb.focus();return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='close')closePanel();
  if(a==='addrow'){draft.rows.push({item:null,min:'',max:''});renderPanel();rcombs[rcombs.length-1].focus()}
  if(a==='delrow'&&draft.rows.length>1){draft.rows.splice(+b.dataset.i,1);draft.errs=null;renderPanel()}
  if(a==='save')saveDraft(false);if(a==='saveadd')saveDraft(true)});
$('panel').addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.f){draft.rows[+t.dataset.ri][t.dataset.f]=t.value;t.classList.remove('bad')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&draft&&$('panel').classList.contains('open'))closePanel()});
$('cache-ind').onclick=()=>refresh();$('sync-ind').onclick=()=>sync(true);
window.addEventListener('online',()=>sync(false));setInterval(()=>{if(navigator.onLine!==false)sync(false)},10000);
derive();refreshUI();
try{AP2CacheWatcher.init();AP2CacheWatcher.subscribe(()=>refresh())}catch(e){}
refresh();setInterval(refresh,4000);
</script>
