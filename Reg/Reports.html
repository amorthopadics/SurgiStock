<script>
'use strict';
/* ═══ LEDGER STORE — local-cache mode (no backend). Same data shape as the Apps Script backend,
   so going live later = set USE_BACKEND=true (and re-enable the shared scripts in <head>). ═══ */
const USE_BACKEND=true;   // true: ledger is read from the ap2_ledger cache (read-only page) · false: old local-only mode (localStorage)
const Ledger=USE_BACKEND?{get:()=>freshLedger(),post:(a,p)=>AP2Api.post(a,p).then(r=>r||{}),
  backup:()=>JSON.stringify({Charges:L.Charges,Receipts:L.Receipts,Allocations:L.Allocations}),            // exports what is on screen
  restore:()=>{throw new Error('Restore is only available in local mode — the ledger now lives on the server');}}:(()=>{
 const KEY='acc_ledger_v1',H={
  Charges:['ChargeID','Type','BillID','BillNo','OrderID','OrderNo','PartyType','Party','Dir','Date','Description','Amount','Comments','Created'],
  Receipts:['PaymentID','ReceiptNo','Dir','PartyType','Party','Date','Mode','Ref','Amount','Comments','Type','Created'],
  Allocations:['AllocID','PaymentID','ReceiptNo','BillID','BillNo','ChargeID','OrderID','OrderNo','PartyType','Party','Date','Amount','Comments','Reverses','Created']};
 const rd=()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.Charges&&j.Receipts&&j.Allocations)return j;}catch(e){}return{Charges:[H.Charges],Receipts:[H.Receipts],Allocations:[H.Allocations]};};
 const wr=j=>{try{localStorage.setItem(KEY,JSON.stringify(j));}catch(e){throw new Error('Browser storage is full or blocked — export a backup and clear space');}};
 const R=n=>Math.round((+n||0)*100)/100,now=()=>new Date().toISOString(),uid=(p,i)=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)+(i||0);
 const sm=(a,f)=>R(a.reduce((s,x)=>s+f(x),0));
 return{
  async get(){return rd();},
  async post(action,p){const j=rd();
   if(action==='addCharges'){
    const rows=(p.rows||[]).map((c,i)=>{if(!c.party)throw new Error('Party missing');return[uid('C',i),c.type||'Order',c.billId||'',c.billNo||'',c.orderId||'',c.orderNo||'',c.ptype||'',c.party,c.dir||'out',c.date,c.desc||'',R(c.amount),c.comments||'',now()];});
    j.Charges.push(...rows);wr(j);return{count:rows.length};}
   if(action==='addReceipt'){const r=p.receipt;if(!r.party||!(+r.amount>0))throw new Error('Party and amount required');
    const no=(r.dir==='in'?'P-':'R-')+String(j.Receipts.length).padStart(4,'0');
    j.Receipts.push([r.id||uid('P'),no,r.dir||'out',r.ptype||'',r.party,r.date,r.mode||'',r.ref||'',R(r.amount),r.comments||'',r.type||'Receipt',now()]);wr(j);return{receipt:{id:r.id,no}};}
   if(action==='addAllocations'){
    const rec=j.Receipts.slice(1).find(x=>x[0]==p.paymentId);if(!rec)throw new Error('Receipt not found');
    const al=j.Allocations.slice(1);let rem=R(rec[8]-sm(al.filter(a=>a[1]==rec[0]),a=>+a[11]));const out=[];
    (p.rows||[]).forEach((x,i)=>{const ch=j.Charges.slice(1).find(c=>c[0]==x.chargeId);if(!ch)throw new Error('Charge not found');
     if(ch[7]!=rec[4])throw new Error('Charge belongs to another party');
     const amt=R(x.amount),due=R(ch[11]-sm(al.filter(a=>a[5]==ch[0]),a=>+a[11])-sm(out.filter(o=>o[5]==ch[0]),o=>o[11]));
     if(amt>0){if(amt>rem+.005)throw new Error('More than receipt balance');if(amt>due+.005)throw new Error('More than due on '+(ch[5]||ch[10]));}
     rem=R(rem-amt);out.push([uid('A',i),rec[0],rec[1],ch[2],ch[3],ch[0],ch[4],ch[5],ch[6],ch[7],p.date,amt,x.comments||'',x.reverses||'',now()]);});
    j.Allocations.push(...out);wr(j);return{count:out.length};}
   if(action==='reverseBill'){const al=j.Allocations.slice(1),ch=j.Charges.slice(1),done=new Set(ch.filter(c=>c[1]==='Reversal').map(c=>String(c[12]).replace('rev:','')));
    const t=ch.filter(c=>c[2]==p.billId&&c[1]!=='Reversal'&&!done.has(String(c[0])));
    t.forEach(c=>{if(Math.abs(sm(al.filter(a=>a[5]==c[0]),a=>+a[11]))>.005)throw new Error('This bill has allocated payments — reverse them in Allocation first');});
    const rows=t.map((c,i)=>[uid('C',i),'Reversal',c[2],c[3],c[4],c[5],c[6],c[7],c[8],now().slice(0,10),'Reversal: '+(c[10]||''),R(-c[11]),'rev:'+c[0],now()]);
    j.Charges.push(...rows);wr(j);return{count:rows.length};}
   throw new Error('Unknown action');},
  backup(){return JSON.stringify(rd());},
  restore(t){const j=JSON.parse(t);if(!(j&&j.Charges&&j.Receipts&&j.Allocations))throw new Error('Not a ledger backup');wr(j);}
 };})();
const CUR='AED',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),r2=n=>Math.round((+n||0)*100)/100;
const today=()=>new Date().toISOString().slice(0,10),post=(a,p)=>Ledger.post(a,p),errText=m=>String(m);
function showToast(m,t){const e=$('toast');e.textContent=m;e.className='toast '+(t||'');e.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>e.style.display='none',t==='error'?9000:3000);}
let L={Charges:[],Receipts:[],Allocations:[]};
const rw=(a,h)=>(a||[]).filter(r=>Array.isArray(r)&&r[0]!==''&&String(r[0])!==h);
function data(){
 const al=rw(L.Allocations,'AllocID').map(a=>({id:String(a[0]),pid:String(a[1]),rno:a[2],billNo:a[4],cid:String(a[5]),orderNo:a[7],party:a[9],date:String(a[10]),amt:+a[11]||0,note:a[12],rev:String(a[13]||'')}));
 const rvC={};rw(L.Charges,'ChargeID').forEach(c=>{if(c[1]==='Reversal')rvC[String(c[12]).replace('rev:','')]=+c[11]||0;});const bC={},bP={};al.forEach(a=>{bC[a.cid]=r2((bC[a.cid]||0)+a.amt);bP[a.pid]=r2((bP[a.pid]||0)+a.amt);});
 const ch=rw(L.Charges,'ChargeID').map(c=>({id:String(c[0]),type:c[1],billNo:String(c[3]||''),orderNo:String(c[5]||''),ptype:c[6],party:String(c[7]).trim(),dir:c[8],date:String(c[9]),desc:c[10],amt:+c[11]||0,note:c[12]})).map(c=>({...c,paid:bC[c.id]||0,due:r2(c.amt-(bC[c.id]||0)+(rvC[c.id]||0))}));
 const rc=rw(L.Receipts,'PaymentID').map(r=>({id:String(r[0]),no:r[1],dir:r[2],party:String(r[4]).trim(),date:String(r[5]),mode:r[6],ref:r[7],amt:+r[8]||0,note:r[9],type:r[10]})).map(r=>({...r,alloc:bP[r.id]||0,un:r2(r.amt-(bP[r.id]||0))}));
 return{al,ch,rc};}
const fifo=(a,b)=>a.date.localeCompare(b.date)||((b.type==='Opening')-(a.type==='Opening'))||a.billNo.localeCompare(b.billNo)||a.id.localeCompare(b.id);
/* ═══ CACHE SOURCE — "ap2_ledger" (same three-path loader as userPortal.html / Bills.html / Allocation.html)
   1. parent push   : ap-cache-request → index.html answers ap-cache-ready / ap-cache-preload (same-origin only)
   2. IndexedDB read: AP2CacheWatcher.readKey('ap2_ledger'), 6 retries (300 · 500 · 800 · 1200 · 2000 · 3000 ms)
   3. live updates  : AP2CacheWatcher.subscribe → re-read on any change (+15 s poll, + on tab focus)
   Newest record wins (ts). All empty → AdminPro.get(key). Still nothing → error panel + Retry (never an endless skeleton).
   ⚠ dataLayer.js: add 'ap2_ledger' to ALLOW_EMPTY_OBJECT_DATASETS (a fresh system has no rows). */
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),DELAYS=[300,500,800,1200,2000,3000];
const isObj=d=>!!d&&typeof d==='object';
const IDB_DB='ap2_fleet_cache',IDB_STORE='datasets';
const withTimeout=(p,ms)=>Promise.race([Promise.resolve(p),new Promise(r=>setTimeout(()=>r(undefined),ms))]);
function scanIDB(match){return new Promise(res=>{                  // key-name-proof read: newest record in the store whose data has the right shape
  try{const rq=indexedDB.open(IDB_DB);
    rq.onerror=()=>res(null);rq.onblocked=()=>res(null);
    rq.onupgradeneeded=()=>{try{rq.transaction.abort();}catch(e){}};   // DB missing → don't create an empty one
    rq.onsuccess=()=>{const db=rq.result;
      try{if(!db.objectStoreNames.contains(IDB_STORE)){db.close();return res(null);}
        const cur=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).openCursor();let best=null;
        cur.onsuccess=e=>{const c=e.target.result;
          if(c){const v=c.value;if(v&&typeof v==='object'&&match(v.data||v)&&(!best||(+v.ts||0)>=(+best.ts||0)))best=v;c.continue();}
          else{db.close();res(best);}};
        cur.onerror=()=>{db.close();res(null);};
      }catch(e){try{db.close();}catch(x){}res(null);}};
  }catch(e){res(null);}});}
async function readCached(key,ok,dbg){                            // 1) AP2CacheWatcher.readKey (1.5 s cap)  2) scan of the IndexedDB store
  let r=null;
  try{if(window.AP2CacheWatcher&&typeof AP2CacheWatcher.readKey==='function')r=await withTimeout(AP2CacheWatcher.readKey(key),1500);}catch(e){}
  dbg.readKey=ok(r)?'record':r===undefined?'timeout':'empty';
  if(ok(r))return r;
  const v=await withTimeout(scanIDB(d=>ok(d)),2000);dbg.scan=v?'found':'none';
  return v||null;}
const dbgLine=()=>' AP2CacheWatcher '+(window.AP2CacheWatcher?(typeof AP2CacheWatcher.readKey==='function'?'ok':'no readKey'):'MISSING')+' · AdminPro '+(window.AdminPro?'ok':'MISSING')+' · indexedDB '+(window.indexedDB?'ok':'MISSING');
const SRC={ledger:{key:'ap2_ledger',label:'Ledger',shape:d=>isObj(d)&&Array.isArray(d.Charges)&&Array.isArray(d.Receipts)&&Array.isArray(d.Allocations),
  set:d=>{L={Charges:d.Charges,Receipts:d.Receipts,Allocations:d.Allocations};}}};
const SV=Object.values(SRC);SV.forEach(s=>Object.assign(s,{ts:0,fp:'',painted:false,err:'',dbg:{}}));
const ST={state:'loading',err:'',booting:false};
const ready=()=>SV.every(s=>s.painted);
function unpackS(s,r){if(!isObj(r))return null;if(s.shape(r))return{data:r,ts:0};if(s.shape(r.data))return{data:r.data,ts:+r.ts||0};return null;}
function applySrc(s,r,from,force){
 const u=unpackS(s,r);if(!u)return false;
 if(!force&&s.painted&&u.ts&&u.ts<=s.ts)return true;           // not newer than what is on screen
 s.ts=force?Date.now():(u.ts||Math.max(s.ts,Date.now()));
 const fp=JSON.stringify(u.data);
 if(!force&&s.painted&&fp===s.fp)return true;                   // identical → no re-render
 s.fp=fp;s.set(u.data);s.painted=true;s.err='';
 if(ready()){ST.state='ready';ST.err='';after();}else render();
 return true;}
async function readIDB(s){return readCached(s.key,r=>!!unpackS(s,r),s.dbg);}
async function applyFromIDB(s){const r=await readIDB(s);return r?applySrc(s,r,'idb'):false;}
async function fetchLive(s){
 try{if(!(window.AdminPro&&typeof AdminPro.get==='function'))throw new Error('AdminPro is not available');
  const r=await withTimeout(AdminPro.get(s.key),15000);if(r===undefined)throw new Error('AdminPro.get returned nothing or timed out');if(!applySrc(s,r,'live')&&!s.painted)throw new Error('unexpected data from server');}
 catch(e){s.err=String((e&&e.message)||e);}}
async function freshLedger(){                                   // after a write: force-pull the ledger (updates IndexedDB too), fall back to the endpoint
 const s=SRC.ledger;let r=null;
 try{if(window.AdminPro){const fn=typeof AdminPro.refresh==='function'?AdminPro.refresh:AdminPro.get;r=await fn.call(AdminPro,s.key,{force:true});}}catch(e){}
 if(!unpackS(s,r))r=await AP2Api.get('ledger');
 if(!applySrc(s,r,'live',true))throw new Error('Ledger returned unexpected data');
 return L;}
function askParent(){if(window.parent===window)return;try{window.parent.postMessage({type:'ap-cache-request',keys:SV.map(s=>s.key)},location.origin);}catch(e){}}
function pickPayload(m,s){
 for(const bag of [m,m.data,m.datasets,m.payload,m.caches])if(isObj(bag)&&bag[s.key]!==undefined&&unpackS(s,bag[s.key]))return bag[s.key];
 if(m.key===s.key||m.name===s.key||m.dataset===s.key){const v=m.data!==undefined?m.data:m.value;if(unpackS(s,v))return v;}
 return null;}
function onCacheMessage(e){                                     // same-origin parent only
 if(e.origin!==location.origin||(e.source!==window.parent&&e.source!==window))return;
 const m=e.data;if(!isObj(m))return;const t=String(m.type||m.msg||'');if(!/^ap-cache/.test(t))return;
 SV.forEach(s=>{let got=false;if(/^ap-cache-(ready|preload)$/.test(t)){const d=pickPayload(m,s);if(d)got=applySrc(s,d,'parent');}
  if(!got)setTimeout(()=>applyFromIDB(s),250);});}
function watchSrc(){
 const W=window.AP2CacheWatcher;if(!W||typeof W.subscribe!=='function')return;
 const cb=k=>{const key=(k&&k.key)||k;const hit=typeof key==='string'?SV.filter(s=>s.key===key):SV;hit.forEach(applyFromIDB);};
 try{W.subscribe(cb);}catch(e){SV.forEach(s=>{try{W.subscribe(s.key,()=>applyFromIDB(s));}catch(x){}});}}
async function bootSrc(s){
 let ok=await applyFromIDB(s);
 for(const d of DELAYS){if(ok||s.painted)break;await sleep(d);ok=await applyFromIDB(s);}
 if(!ok&&!s.painted)await fetchLive(s);}
async function bootAll(){
 if(ST.booting)return;ST.booting=true;ST.state='loading';ST.err='';render();askParent();
 await Promise.all(SV.filter(s=>!s.painted).map(bootSrc));
 ST.booting=false;
 if(!ready()){ST.state='error';ST.err=SV.filter(s=>!s.painted).map(s=>s.label+' ('+s.key+')'+(s.err?': '+s.err:'')).join(' · ');render();showToast('Not loaded — '+ST.err,'error');}}
function retryAll(){ST.booting=false;bootAll();}
const stateHTML=()=>ST.state==='error'
 ?`<div class="empty">Ledger data isn’t available yet.<div class="dim" style="margin:6px 0 10px;font-size:12px">${esc(ST.err||'The cache is empty and the server could not be reached.')}</div><div class="dim" style="font-size:11px;margin-bottom:10px">${esc(SV.map(s=>s.label+': readKey='+(s.dbg.readKey||'-')+', scan='+(s.dbg.scan||'-')).join(' · ')+' ·'+dbgLine())}</div><button class="btn pri" onclick="retryAll()"><i class="ti ti-refresh"></i>Retry</button></div>`
 :'<div class="sk"></div>'.repeat(6);
const notReady=()=>{if(USE_BACKEND&&!ready()){showToast(ST.state==='error'?'Data not loaded — press Retry':'Still loading — please wait','error');return true;}return false;};

async function load(){
 if(USE_BACKEND){try{await freshLedger();}catch(e){showToast('Ledger not reachable: '+errText(e.message),'error');}after();return;}
try{const j=await Ledger.get();L={Charges:j.Charges||[],Receipts:j.Receipts||[],Allocations:j.Allocations||[]};}
 catch(e){showToast('Ledger not reachable — add the Accounts backend: '+errText(e.message),'error');}after();}

const TABS=[['out','Outstanding'],['stm','Statement'],['age','Aging'],['trc','Trace'],['day','Daily collection'],['hist','Allocation history']];let tab='out';
const after=()=>render();
const T=(h,rows,num=[])=>rows.length?`<table><thead><tr>${h.map((x,i)=>`<th class="${num.includes(i)?'n':''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${num.includes(i)?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">No data</div>';
const M=n=>money(n),S=(a,f)=>r2(a.reduce((s,x)=>s+f(x),0));
function render(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab${tab===k?' on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
 if(USE_BACKEND&&!ready()){$('kpi').innerHTML='';$('view').innerHTML=stateHTML();return;}
 const dir=$('dir').value,q=$('q').value.toLowerCase().split(/\s+/).filter(Boolean),fr=$('from').value,to=$('to').value,d=data();
 const inR=x=>(!fr||x>=fr)&&(!to||x<=to),ok=s=>q.every(w=>s.toLowerCase().includes(w));
 const ch=d.ch.filter(c=>c.dir===dir&&inR(c.date)&&ok([c.party,c.billNo,c.orderNo,c.desc,c.note,c.type].join(' '))),rc=d.rc.filter(r=>r.dir===dir&&inR(r.date)&&ok([r.party,r.no,r.ref,r.note,r.mode].join(' ')));
 const parties=[...new Set([...ch.map(c=>c.party),...rc.map(r=>r.party)])].sort();let kpi='',out='';
 if(tab==='out'){const R=parties.map(p=>{const c=S(ch.filter(x=>x.party===p),x=>x.amt),r=S(rc.filter(x=>x.party===p),x=>x.amt);return[esc(p),M(c),M(r),`<span class="${c-r>.005?'neg':''}">${M(Math.abs(c-r))} ${c-r>.005?'due':c-r<-.005?'advance':''}</span>`];});
  kpi=`<div>Charged<b>${M(S(ch,x=>x.amt))}</b></div><div>${dir==='out'?'Received':'Paid'}<b>${M(S(rc,x=>x.amt))}</b></div><div>Net balance<b>${M(S(ch,x=>x.amt)-S(rc,x=>x.amt))}</b></div>`;out=T(['Party','Charged',dir==='out'?'Received':'Paid','Balance'],R,[1,2,3]);}
 if(tab==='stm'){const rows=[];parties.forEach(p=>{let b=0;[...ch.filter(c=>c.party===p).map(c=>({d:c.date,k:c.type==='Order'?'Bill':c.type,ref:c.billNo||'–',t:c.orderNo||c.desc,dr:c.amt,cr:0,n:c.note})),...rc.filter(r=>r.party===p).map(r=>({d:r.date,k:'Receipt',ref:r.no,t:[r.mode,r.ref].filter(Boolean).join(' · '),dr:0,cr:r.amt,n:r.note}))].sort((a,b)=>a.d.localeCompare(b.d)).forEach(x=>{b=r2(b+x.dr-x.cr);rows.push([esc(p),esc(x.d),x.k,esc(x.ref),esc(x.t),x.dr?M(x.dr):'',x.cr?M(x.cr):'',M(b),esc(x.n)]);});});
  out=T(['Party','Date','Type','Ref','Details','Charge','Paid','Balance','Comments'],rows,[5,6,7]);}
 if(tab==='age'){const now=Date.parse(today()),B=[0,0,0,0];const R=parties.map(p=>{const b=[0,0,0,0];ch.filter(c=>c.party===p&&c.due>.005).forEach(c=>{const a=Math.floor((now-Date.parse(c.date))/864e5);b[a<=30?0:a<=60?1:a<=90?2:3]+=c.due;});b.forEach((v,i)=>B[i]+=v);const adv=S(rc.filter(r=>r.party===p),r=>r.un);return[esc(p),...b.map(M),M(S(b,x=>x)),M(adv)];});
  kpi=['0–30','31–60','61–90','90+'].map((l,i)=>`<div>${l} days<b>${M(B[i])}</b></div>`).join('');out=T(['Party','0–30','31–60','61–90','90+','Total due','Unallocated advance'],R,[1,2,3,4,5,6]);}
 if(tab==='trc'){const al=d.al,rows=ch.slice(0,200).map(c=>[`<b class="mono">${esc(c.billNo||'–')}</b> ${esc(c.orderNo||c.desc)} <span class="badge">${esc(c.type)}</span>`,esc(c.party),M(c.amt),M(c.paid),M(c.due),al.filter(a=>a.cid===c.id).map(a=>`${esc(a.rno)}: ${M(a.amt)}`).join('<br>')||'<span class="dim">unpaid</span>']);
  const rr=rc.slice(0,200).map(r=>[`<b class="mono">${esc(r.no)}</b> ${esc(r.date)}`,esc(r.party),M(r.amt),M(r.alloc),M(r.un),al.filter(a=>a.pid===r.id).map(a=>`${esc(a.orderNo||a.billNo||'item')}: ${M(a.amt)}`).join('<br>')||'<span class="dim">not allocated</span>']);
  out='<h3 style="font-size:14px;margin-bottom:6px">Charges → paid by</h3>'+T(['Bill / order','Party','Charge','Paid','Due','Paid by'],rows,[2,3,4])+'<h3 style="font-size:14px;margin:14px 0 6px">Receipts → settled</h3>'+T(['Receipt','Party','Amount','Allocated','Unallocated','Settled orders'],rr,[2,3,4]);}
 if(tab==='day'){const m={};rc.forEach(r=>{const k=r.date+'|'+r.mode;(m[k]=m[k]||{d:r.date,m:r.mode,n:0,t:0});m[k].n++;m[k].t=r2(m[k].t+r.amt);});
  kpi=`<div>Total<b>${M(S(rc,x=>x.amt))}</b></div><div>Entries<b>${rc.length}</b></div>`;out=T(['Date','Mode','Entries','Total'],Object.values(m).sort((a,b)=>b.d.localeCompare(a.d)).map(x=>[esc(x.d),esc(x.m),x.n,M(x.t)]),[2,3]);}
 if(tab==='hist'){const rv=new Set(d.al.filter(a=>a.rev).map(a=>a.rev)),cd={};d.ch.forEach(c=>cd[c.id]=c.dir);
  out=T(['Date','Receipt','Party','Bill','Order','Amount','Note'],d.al.filter(a=>cd[a.cid]===dir&&inR(a.date)&&ok([a.party,a.rno,a.billNo,a.orderNo,a.note].join(' '))).sort((a,b)=>b.id.localeCompare(a.id)).map(a=>[esc(a.date),esc(a.rno),esc(a.party),esc(a.billNo),esc(a.orderNo),`<span class="${a.amt<0?'neg':''}">${M(a.amt)}</span>`,esc(a.note)+(a.rev?' (reversal)':rv.has(a.id)?' (reversed)':'')]),[5]);}
 $('kpi').innerHTML=kpi;$('view').innerHTML=out;}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([Ledger.backup()],{type:'application/json'}));a.download='ledger-backup-'+today()+'.json';a.click();}
function rsf(i){const f=i.files[0];if(!f)return;if(!confirm('Restore replaces ALL local ledger data with this file. Continue?')){i.value='';return;}
 f.text().then(t=>{Ledger.restore(t);return load();}).then(()=>showToast('Backup restored','success')).catch(e=>showToast('Restore failed: '+e.message,'error'));i.value='';}
function csv(){if(USE_BACKEND&&!ready())return showToast('Data not loaded yet','error');const t=document.querySelector('#view table');if(!t)return showToast('Nothing to export','error');
 const s=[...t.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replace(/\n/g,' ').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='report-'+tab+'-'+today()+'.csv';a.click();}

/* ═══ BOOT ═══ */
if(USE_BACKEND){
 const rb=document.querySelector('.bar .btn[onclick*="rs"]');if(rb)rb.style.display='none';   // restore makes no sense against a server ledger
 window.addEventListener('message',onCacheMessage);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(!ready()&&!ST.booting)bootAll();else SV.forEach(applyFromIDB);});
 watchSrc();bootAll();setInterval(()=>{if(ready())SV.forEach(applyFromIDB);},15000);   // safety net behind the subscription
}else load();
</script>
